<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090d"><title>DART — تواصل حول العالم</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="data:,">
<style>
:root{--bg:#09090d;--panel:#14141a;--panel2:#1b1b22;--line:#292932;--yellow:#f4e84a;--muted:#92929e;--white:#f6f6f8;--blue:#62b9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}a{color:var(--yellow)}.hidden{display:none!important}.wrap{max-width:760px;margin:auto;padding:0 14px 96px}.top{position:sticky;top:0;z-index:5;background:#09090deF;border-bottom:1px solid var(--line);padding:16px 14px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900;letter-spacing:1px}.brand b{color:var(--yellow)}.top-actions{display:flex;gap:10px}.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:10px 12px}.stories{display:flex;gap:14px;overflow:auto;padding:17px 0 20px;scrollbar-width:none}.story{min-width:76px;text-align:center}.story .ring{height:70px;width:70px;border:3px solid var(--yellow);border-radius:50%;padding:3px;margin:auto;background:#292933;display:grid;place-items:center;overflow:hidden}.story img{height:100%;width:100%;border-radius:50%;object-fit:cover}.story small{display:block;color:var(--muted);margin-top:6px;max-width:80px;overflow:hidden;text-overflow:ellipsis}.story.add .ring{font-size:32px;color:var(--yellow)}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin:12px 0;overflow:hidden}.posthead{display:flex;align-items:center;gap:10px;padding:14px}.avatar{height:44px;width:44px;object-fit:cover;border-radius:50%;border:2px solid var(--yellow);background:#292933}.posthead .meta{flex:1;min-width:0}.posthead strong{display:block}.muted{color:var(--muted);font-size:13px}.postimg{display:block;width:100%;max-height:650px;object-fit:cover;background:#111}.posttext{padding:0 15px 12px;line-height:1.7;white-space:pre-wrap}.actions{display:flex;gap:5px;padding:10px 12px;border-top:1px solid var(--line)}.actions button{background:none;border:0;padding:9px;color:var(--muted)}.actions button.liked{color:var(--yellow)}.comments{padding:0 14px 12px}.comment{padding:5px 0;color:#d8d8df;font-size:14px}.commentform{display:flex;gap:8px;margin-top:10px}.field{width:100%;border:1px solid var(--line);background:#0f0f14;color:white;border-radius:13px;padding:12px;outline:none}.field:focus{border-color:var(--yellow)}.btn{border:0;background:var(--yellow);color:#111;border-radius:13px;padding:12px 16px;font-weight:800}.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:white}.btn.danger{background:#a33;color:white}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d0d12f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:9}.nav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;min-width:54px}.nav button.active{color:var(--yellow)}.nav span{font-size:22px}.view{display:none}.view.active{display:block}.auth{max-width:440px;margin:7vh auto;padding:24px}.auth h1{font-size:28px}.auth .field{margin:8px 0}.auth .btn{width:100%;margin-top:8px}.switch{color:var(--yellow);cursor:pointer}.sectiontitle{padding:12px 3px;font-size:20px}.empty{padding:30px;text-align:center;color:var(--muted)}.profilebox{text-align:center;padding:25px}.profilebox .avatar{width:100px;height:100px}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.modalbox{width:min(100%,520px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;max-height:90vh;overflow:auto}.modalbox h3{margin-top:0}.modalbox textarea{min-height:120px;resize:vertical}.modalbox .field{margin:8px 0}.modalactions{display:flex;gap:8px;margin-top:12px}.modalactions button{flex:1}.msglist{display:flex;flex-direction:column;gap:9px}.msg{max-width:80%;padding:12px;border-radius:15px;background:var(--panel2);align-self:flex-start}.msg.mine{align-self:flex-end;background:#555224;color:#fff}.searchrow{display:flex;gap:8px;margin:12px 0}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#26262d;border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:50;max-width:90%;display:none}.toast.show{display:block}.loading{text-align:center;padding:20px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}
</style>
</head><body>
<div id="toast" class="toast"></div>
<div id="auth" class="card auth"><div class="brand">DART <b>●</b></div><h1 id="authTitle">أهلاً بك في DART</h1><p class="muted">تواصل، شارك، واكتشف العالم.</p><input id="email" class="field" type="email" placeholder="البريد الإلكتروني"><input id="password" class="field" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><div id="nameWrap" class="hidden"><input id="fullName" class="field" placeholder="الاسم الظاهر"></div><button id="authBtn" class="btn">تسجيل الدخول</button><p class="muted" id="switchText">ليس لديك حساب؟ <span class="switch" id="switchAuth">إنشاء حساب</span></p><p class="small">يلزم إعداد Supabase مرة واحدة لتفعيل الحسابات الحقيقية.</p></div>
<div id="app" class="hidden"><header class="top"><div class="brand">DART <b>●</b></div><div class="top-actions"><button class="iconbtn" onclick="openMessages()">✉</button><button class="iconbtn" onclick="showView('search')">⌕</button></div></header><div class="wrap">
<section id="feed" class="view active"><div class="stories" id="stories"><div class="story add" onclick="openStory()"><div class="ring">＋</div><small>قصتي</small></div></div><div class="sectiontitle">الرئيسية</div><div id="posts"><div class="loading">جارٍ تحميل المنشورات…</div></div></section>
<section id="search" class="view"><h2>اكتشاف</h2><div class="searchrow"><input id="searchInput" class="field" placeholder="ابحث عن أشخاص"><button class="btn" onclick="searchUsers()">بحث</button></div><div id="searchResults"></div></section>
<section id="create" class="view"><h2>منشور جديد</h2><textarea id="newText" class="field" placeholder="شنو تحب تشارك؟"></textarea><input id="newImage" class="field" type="file" accept="image/*"><button class="btn" style="width:100%" onclick="createPost()">نشر</button></section>
<section id="messages" class="view"><h2>الرسائل</h2><div id="messageThreads"><div class="empty">ابحث عن شخص وابدأ محادثة.</div></div></section>
<section id="profile" class="view"><div id="profileContent"></div></section>
</div><nav class="nav"><button data-view="profile" onclick="showView('profile')"><span>◉</span>حسابي</button><button data-view="messages" onclick="openMessages()"><span>✉</span>رسائل</button><button data-view="create" onclick="showView('create')"><span style="font-size:32px;color:var(--yellow)">＋</span>نشر</button><button data-view="search" onclick="showView('search')"><span>⌕</span>اكتشاف</button><button data-view="feed" onclick="showView('feed')"><span>⌂</span>الرئيسية</button></nav></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Add your Supabase project URL and anon/public key after creating the project.
const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
let sb=null,user=null,signupMode=false,activeChat=null;
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=> $('toast').classList.remove('show'),3500)}
function configured(){return SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.includes('YOUR_')}
if(configured()&&window.supabase){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);init()}else{ $('authTitle').textContent='إعداد DART';$('switchText').innerHTML='أضف رابط Supabase والمفتاح في ملف index.html لتفعيل الحسابات.';$('authBtn').textContent='غير متصل بالخدمات';$('authBtn').disabled=true;}
function toggleAuth(){signupMode=!signupMode;$('nameWrap').classList.toggle('hidden',!signupMode);$('authTitle').textContent=signupMode?'إنشاء حساب DART':'أهلاً بك في DART';$('authBtn').textContent=signupMode?'إنشاء حساب':'تسجيل الدخول';$('switchText').innerHTML=signupMode?'لديك حساب؟ <span class="switch" id="switchAuth">تسجيل الدخول</span>':'ليس لديك حساب؟ <span class="switch" id="switchAuth">إنشاء حساب</span>'; $('switchAuth').onclick=toggleAuth}
$('switchAuth').onclick=toggleAuth;$('authBtn').onclick=authAction;
async function authAction(){if(!sb)return;const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return toast('أدخل البريد وكلمة مرور من 6 أحرف على الأقل');$('authBtn').disabled=true;try{if(signupMode){const name=$('fullName').value.trim()||email.split('@')[0];const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)throw error;toast('تم إنشاء الحساب. تحقق من بريدك إذا طلب ذلك.');}else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}}catch(e){toast(e.message)}finally{$('authBtn').disabled=false}}
async function init(){const {data:{session}}=await sb.auth.getSession();if(session)enter(session.user);sb.auth.onAuthStateChange((_event,session)=>{if(session)enter(session.user);else exit()})}
async function enter(u){user=u;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadFeed();await loadProfile();await loadStories()}
function exit(){$('app').classList.add('hidden');$('auth').classList.remove('hidden');user=null}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));if(v==='feed')loadFeed();if(v==='profile')loadProfile();if(v==='messages')loadThreads()}
async function getProfile(id){const {data}=await sb.from('profiles').select('*').eq('id',id).maybeSingle();return data}
function avatar(p){return p?.avatar_url||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop'}
async function loadFeed(){if(!user)return;const {data,error}=await sb.from('posts').select('*,profiles(id,display_name,avatar_url),likes(user_id),comments(id,body,created_at,profiles(display_name))').order('created_at',{ascending:false}).limit(60);if(error){$('posts').innerHTML='<div class="empty">'+escapeHTML(error.message)+'</div>';return}if(!data?.length){$('posts').innerHTML='<div class="empty">لا توجد منشورات بعد. كن أول من يشارك!</div>';return}$('posts').innerHTML=data.map(p=>postHTML(p)).join('')}
function postHTML(p){const liked=p.likes?.some(l=>l.user_id===user.id);return `<article class="card" id="post-${p.id}"><div class="posthead"><img class="avatar" src="${escapeHTML(avatar(p.profiles))}"><div class="meta"><strong>${escapeHTML(p.profiles?.display_name||'مستخدم')}</strong><span class="muted">${new Date(p.created_at).toLocaleString()}</span></div>${p.user_id===user.id?`<button class="iconbtn" onclick="deletePost('${p.id}')">⋯</button>`:''}</div>${p.image_url?`<img class="postimg" src="${escapeHTML(p.image_url)}">`:''}<div class="posttext">${escapeHTML(p.body)}</div><div class="actions"><button class="${liked?'liked':''}" onclick="toggleLike('${p.id}',${liked})">${liked?'♥':'♡'} ${p.likes?.length||0}</button><button onclick="toggleComments('${p.id}')">◌ ${p.comments?.length||0} تعليق</button><button onclick="startChat('${p.user_id}')">✉ رسالة</button></div><div class="comments hidden" id="comments-${p.id}">${(p.comments||[]).slice(-3).map(c=>`<div class="comment"><b>${escapeHTML(c.profiles?.display_name||'مستخدم')}:</b> ${escapeHTML(c.body)}</div>`).join('')}<div class="commentform"><input class="field" id="commentInput-${p.id}" placeholder="اكتب تعليقاً"><button class="btn" onclick="addComment('${p.id}')">إرسال</button></div></div></article>`}
async function toggleLike(postId,liked){if(liked){await sb.from('likes').delete().eq('post_id',postId).eq('user_id',user.id)}else{const {error}=await sb.from('likes').insert({post_id:postId,user_id:user.id});if(error&&error.code!=='23505')toast(error.message)}loadFeed()}
function toggleComments(id){$('comments-'+id).classList.toggle('hidden')}
async function addComment(id){const input=$('commentInput-'+id),body=input.value.trim();if(!body)return;const {error}=await sb.from('comments').insert({post_id:id,user_id:user.id,body});if(error)return toast(error.message);input.value='';loadFeed()}
async function createPost(){const body=$('newText').value.trim(),file=$('newImage').files[0];if(!body&&!file)return toast('اكتب شيئاً أو اختر صورة');let image_url=null;if(file){const path=user.id+'/'+Date.now()+'-'+file.name;const {error}=await sb.storage.from('post-images').upload(path,file,{upsert:false});if(error)return toast('رفع الصورة: '+error.message);const {data}=sb.storage.from('post-images').getPublicUrl(path);image_url=data.publicUrl}const {error}=await sb.from('posts').insert({user_id:user.id,body,image_url});if(error)return toast(error.message);$('newText').value='';$('newImage').value='';toast('تم نشر المنشور');showView('feed')}
async function deletePost(id){if(!confirm('حذف المنشور؟'))return;const {error}=await sb.from('posts').delete().eq('id',id).eq('user_id',user.id);if(error)toast(error.message);else loadFeed()}
async function loadProfile(){if(!user)return;const p=await getProfile(user.id);const {data:posts}=await sb.from('posts').select('*').eq('user_id',user.id).order('created_at',{ascending:false});$('profileContent').innerHTML=`<div class="card profilebox"><img class="avatar" src="${escapeHTML(avatar(p))}"><h2>${escapeHTML(p?.display_name||user.email)}</h2><p class="muted">${escapeHTML(p?.bio||'')}</p><button class="btn secondary" onclick="editProfile()">تعديل الحساب</button><button class="btn secondary" style="margin:8px" onclick="logout()">تسجيل الخروج</button></div><h3>منشوراتي (${posts?.length||0})</h3>${(posts||[]).map(x=>`<div class="card"><div class="posttext">${escapeHTML(x.body||'')}${x.image_url?`<img class="postimg" src="${escapeHTML(x.image_url)}">`:''}</div></div>`).join('')}`}
function editProfile(){const p=document.createElement('div');p.innerHTML=`<h3>تعديل الحساب</h3><input class="field" id="editName" placeholder="الاسم"><textarea class="field" id="editBio" placeholder="نبذة عنك"></textarea><input class="field" id="editAvatar" placeholder="رابط صورة الملف (اختياري)"><div class="modalactions"><button class="btn" onclick="saveProfile()">حفظ</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`;openModal(p);getProfile(user.id).then(x=>{if(x){ $('editName').value=x.display_name||'';$('editBio').value=x.bio||'';$('editAvatar').value=x.avatar_url||''}})}
async function saveProfile(){const {error}=await sb.from('profiles').update({display_name:$('editName').value.trim(),bio:$('editBio').value.trim(),avatar_url:$('editAvatar').value.trim()||null}).eq('id',user.id);if(error)toast(error.message);else{closeModal();loadProfile();loadFeed()}}
async function searchUsers(){const q=$('searchInput').value.trim();if(!q)return;const {data,error}=await sb.from('profiles').select('*').ilike('display_name','%'+q+'%').limit(30);if(error)return toast(error.message);$('searchResults').innerHTML=(data||[]).filter(x=>x.id!==user.id).map(p=>`<div class="card posthead"><img class="avatar" src="${escapeHTML(avatar(p))}"><div class="meta"><strong>${escapeHTML(p.display_name||'مستخدم')}</strong></div><button class="btn secondary" onclick="follow('${p.id}')">متابعة</button><button class="btn" onclick="startChat('${p.id}')">رسالة</button></div>`).join('')||'<div class="empty">لا توجد نتائج.</div>'}
async function follow(id){const {error}=await sb.from('follows').insert({follower_id:user.id,following_id:id});if(error&&error.code==='23505')toast('أنت تتابعه بالفعل');else if(error)toast(error.message);else toast('تمت المتابعة')}
async function loadStories(){const {data}=await sb.from('stories').select('*,profiles(display_name,avatar_url)').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});$('stories').innerHTML=`<div class="story add" onclick="openStory()"><div class="ring">＋</div><small>قصتي</small></div>`+(data||[]).map(s=>`<div class="story" onclick="viewStory('${s.id}')"><div class="ring"><img src="${escapeHTML(s.image_url)}"></div><small>${escapeHTML(s.profiles?.display_name||'')}</small></div>`).join('')}
function openStory(){const x=document.createElement('div');x.innerHTML=`<h3>إضافة قصة</h3><input id="storyFile" class="field" type="file" accept="image/*"><div class="modalactions"><button class="btn" onclick="createStory()">نشر القصة</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`;openModal(x)}
async function createStory(){const f=$('storyFile').files[0];if(!f)return toast('اختر صورة');const path=user.id+'/story-'+Date.now()+'-'+f.name;const {error}=await sb.storage.from('story-images').upload(path,f);if(error)return toast(error.message);const {data}=sb.storage.from('story-images').getPublicUrl(path);const {error:e}=await sb.from('stories').insert({user_id:user.id,image_url:data.publicUrl});if(e)return toast(e.message);closeModal();loadStories()}
async function viewStory(id){const {data}=await sb.from('stories').select('*,profiles(display_name)').eq('id',id).single();if(data){const x=document.createElement('div');x.innerHTML=`<h3>${escapeHTML(data.profiles?.display_name||'قصة')}</h3><img style="width:100%;max-height:70vh;object-fit:contain" src="${escapeHTML(data.image_url)}"><button class="btn secondary" onclick="closeModal()">إغلاق</button>`;openModal(x)}}
async function loadThreads(){const {data,error}=await sb.from('messages').select('sender_id,receiver_id,created_at').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`).order('created_at',{ascending:false});if(error)return toast(error.message);const ids=[...new Set((data||[]).map(m=>m.sender_id===user.id?m.receiver_id:m.sender_id))];const people=await Promise.all(ids.map(getProfile));$('messageThreads').innerHTML=people.map(p=>p?`<div class="card posthead"><img class="avatar" src="${escapeHTML(avatar(p))}"><div class="meta"><strong>${escapeHTML(p.display_name||'مستخدم')}</strong></div><button class="btn" onclick="startChat('${p.id}')">فتح</button></div>`:'').join('')||'<div class="empty">لا توجد محادثات بعد.</div>'}
function openMessages(){showView('messages')}
async function startChat(id){if(id===user.id)return toast('لا يمكنك مراسلة نفسك');activeChat=id;const p=await getProfile(id);const {data,error}=await sb.from('messages').select('*').or(`and(sender_id.eq.${user.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${user.id})`).order('created_at');if(error)return toast(error.message);const x=document.createElement('div');x.innerHTML=`<h3>محادثة مع ${escapeHTML(p?.display_name||'مستخدم')}</h3><div id="chatMsgs" class="msglist">${(data||[]).map(m=>`<div class="msg ${m.sender_id===user.id?'mine':''}">${escapeHTML(m.body)}</div>`).join('')}</div><div class="commentform"><input class="field" id="chatInput" placeholder="اكتب رسالة"><button class="btn" onclick="sendMessage()">إرسال</button></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="closeModal()">إغلاق</button>`;openModal(x)}
async function sendMessage(){const body=$('chatInput').value.trim();if(!body)return;const {error}=await sb.from('messages').insert({sender_id:user.id,receiver_id:activeChat,body});if(error)return toast(error.message);$('chatInput').value='';startChat(activeChat)}
function openModal(node){$('modalBox').replaceChildren(node);$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
async function logout(){await sb.auth.signOut()}
</script></body></html>
