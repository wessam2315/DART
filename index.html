
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERT - تواصل مع العالم</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6fb;color:#202536}
header{background:#17233d;color:white;padding:22px;text-align:center}
.logo{font-size:38px;font-weight:bold;color:#55d6a0}
.container{max-width:500px;margin:35px auto;padding:20px}
.card{background:white;padding:25px;border-radius:18px;box-shadow:0 4px 18px #0001}
h2{text-align:center}
input{width:100%;padding:15px;margin:9px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:10px;background:#17233d;color:white;font-size:17px}
.secondary{background:#21a878}
footer{text-align:center;padding:20px;color:#777}
</style>
</head>
<body>
<header>
<div class="logo">DERT</div>
<p>تواصل مع العالم 🌍</p>
</header>
<div class="container">
<div class="card">
<h2>مرحباً بك في DERT</h2>
<p style="text-align:center">عالمك الاجتماعي يبدأ من هنا</p>
<input type="text" placeholder="اسم المستخدم">
<input type="email" placeholder="البريد الإلكتروني">
<input type="password" placeholder="كلمة المرور">
<button onclick="alert('سيتم تفعيل تسجيل الدخول قريباً')">تسجيل الدخول</button>
<button class="secondary" onclick="alert('سيتم تفعيل إنشاء الحساب قريباً')">إنشاء حساب جديد</button>
</div>
</div>
<footer>DERT © 2026 - تواصل مع العالم</footer>
</body>
</html>
