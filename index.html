
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERT - تواصل مع العالم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f4f8;
  color:#17233d;
}
header{
  background:#17233d;
  color:white;
  text-align:center;
  padding:25px;
}
.logo{
  font-size:40px;
  font-weight:bold;
  color:#55d98a;
}
.container{
  max-width:460px;
  margin:35px auto;
  padding:15px;
}
.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 18px #0001;
}
h2{text-align:center}
input{
  width:100%;
  padding:14px;
  margin:9px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  background:#17233d;
  color:white;
  font-size:17px;
  cursor:pointer;
}
button:disabled{opacity:.6}
.secondary{background:#218878}
#message{
  text-align:center;
  margin-top:16px;
  line-height:1.8;
  overflow-wrap:anywhere;
}
footer{
  text-align:center;
  color:#777;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">DERT</div>
  <p>تواصل مع العالم 🌍</p>
</header>

<div class="container">
<div class="card">

<h2>مرحباً بك في DERT</h2>
<p style="text-align:center">أنشئ حسابك أو سجّل الدخول</p>

<input id="username" type="text" placeholder="اسم المستخدم">
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">

<button id="signupBtn" onclick="signUp()">إنشاء حساب جديد</button>
<button id="loginBtn" class="secondary" onclick="signIn()">تسجيل الدخول</button>
<button id="logoutBtn" onclick="signOut()">تسجيل الخروج</button>

<p id="message" aria-live="polite">أهلاً بك في DERT</p>

</div>
</div>

<footer>DERT © 2026 - تواصل مع العالم</footer>

<script>
// إعدادات مشروع Supabase
const SUPABASE_URL = "https://forwefmjghgcybiccdxz.supabase.co";

const SUPABASE_KEY = "sb_publishable_xsXMr3yr2yJXOgRn9ZjMtQ_sfoS0OIR";

// إنشاء الاتصال
let client = null;

try {
  if (!window.supabase) {
    throw new Error("تعذر تحميل مكتبة Supabase. تحقق من الإنترنت.");
  }

  client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
} catch(error) {
  showMessage("خطأ في الاتصال: " + error.message);
}

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

function setLoading(loading) {
  document.getElementById("signupBtn").disabled = loading;
  document.getElementById("loginBtn").disabled = loading;
  document.getElementById("logoutBtn").disabled = loading;
}

async function signUp() {
  if (!client) {
    showMessage("الاتصال غير جاهز. تحقق من إعدادات Supabase.");
    return;
  }

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !email || !password) {
    showMessage("يرجى ملء جميع الحقول.");
    return;
  }

  if (password.length < 6) {
    showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
    return;
  }

  try {
    setLoading(true);
    showMessage("جارٍ إنشاء الحساب...");

    const {data, error} = await client.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          username: username
        }
      }
    });

    if (error) throw error;

    if (data.session) {
      showMessage("تم إنشاء حسابك وتسجيل دخولك بنجاح 🎉");
    } else {
      showMessage("تم إرسال طلب إنشاء الحساب. افحص بريدك الإلكتروني لتأكيد الحساب إذا كان التأكيد مفعّلاً.");
    }

  } catch(error) {
    showMessage("تعذر إنشاء الحساب: " + error.message);
  } finally {
    setLoading(false);
  }
}

async function signIn() {
  if (!client) {
    showMessage("الاتصال غير جاهز. تحقق من إعدادات Supabase.");
    return;
  }

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("أدخل البريد الإلكتروني وكلمة المرور.");
    return;
  }

  try {
    setLoading(true);
    showMessage("جارٍ تسجيل الدخول...");

    const {data, error} = await client.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) throw error;

    showMessage("أهلاً بك في DERT! تم تسجيل الدخول بنجاح 🎉");

  } catch(error) {
    showMessage("تعذر تسجيل الدخول: " + error.message);
  } finally {
    setLoading(false);
  }
}

async function signOut() {
  if (!client) {
    showMessage("الاتصال غير جاهز.");
    return;
  }

  try {
    setLoading(true);

    const {error} = await client.auth.signOut();

    if (error) throw error;

    showMessage("تم تسجيل الخروج بنجاح.");

  } catch(error) {
    showMessage("تعذر تسجيل الخروج: " + error.message);
  } finally {
    setLoading(false);
  }
}

// التحقق من الجلسة الحالية
async function checkSession() {
  if (!client) return;

  try {
    const {data, error} = await client.auth.getSession();

    if (error) throw error;

    if (data.session) {
      showMessage("أنت مسجل الدخول حالياً في DERT.");
    }
  } catch(error) {
    showMessage("تعذر التحقق من الجلسة: " + error.message);
  }
}

checkSession();
</script>

</body>
</html>
