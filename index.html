<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>DERT — الإعدادات والاختصارات</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f9;
      --surface-2: #f1f2f5;
      --text: #161823;
      --muted: #6e7280;
      --section-label: #737685;
      --divider: #ededf0;
      --hover: #f7f7f9;
      --active: #efefef;
      --chevron: #8a8d99;
      --accent: #fe2c55;
      --accent-hover: #e52248;
      --accent-soft: #fff0f3;
      --success: #0f9d58;
      --success-soft: #e8f6ef;
      --danger: #d93025;
      --danger-soft: #fff4f3;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text;
      font-family: inherit;
    }

    html, body {
      height: 100%;
      background: #eceef2;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Kufi Arabic", "Cairo", sans-serif;
      overscroll-behavior-y: none;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(20px + var(--safe-bottom));
      box-shadow: 0 8px 36px rgba(22, 24, 35, 0.08);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 54px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 8px;
    }

    .topbar-title {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topbar-btn {
      border: 1px solid var(--divider);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.14s ease, transform 0.1s ease;
    }

    .topbar-btn:active {
      background: var(--active);
      transform: scale(0.98);
    }

    .search-wrap {
      padding: 10px 16px;
      border-bottom: 1px solid var(--divider);
      background: var(--bg);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border-radius: 11px;
      padding: 9px 12px;
      border: 1px solid transparent;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .search-box:focus-within {
      border-color: #c8cdd8;
      background: #ffffff;
    }

    .search-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .section {
      padding-top: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--divider);
    }

    .section:last-of-type {
      border-bottom: none;
      padding-bottom: 24px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--section-label);
      padding: 0 18px 8px;
      text-align: right;
    }

    .menu-item {
      width: 100%;
      border: none;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      cursor: pointer;
      transition: background 0.12s ease;
      text-align: right;
      gap: 10px;
    }

    .menu-item:hover {
      background: var(--hover);
    }

    .menu-item:active {
      background: var(--active);
    }

    .menu-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .menu-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: var(--text);
      display: grid;
      place-items: center;
    }

    .menu-icon svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-label-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .menu-label {
      font-size: 15.5px;
      font-weight: 500;
      color: var(--text);
    }

    .menu-meta {
      font-size: 11.5px;
      color: var(--muted);
      background: var(--surface);
      padding: 2.5px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .menu-chevron {
      color: var(--chevron);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .empty-search {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 40;
      display: flex;
      justify-content: center;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .subpage {
      width: 100%;
      max-width: 480px;
      background: var(--bg);
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(14px + var(--safe-bottom));
      transform: translateX(-100%);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .drawer-backdrop.open .subpage {
      transform: translateX(0);
    }

    .subpage-header {
      height: 54px;
      padding: 0 14px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .subpage-title {
      font-size: 16px;
      font-weight: 700;
    }

    .close-btn {
      border: none;
      background: var(--surface);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .close-btn:active {
      background: var(--active);
    }

    .subpage-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .card {
      border: 1px solid var(--divider);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fff;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--divider);
    }

    .card-row:first-child { padding-top: 0; }
    .card-row:last-child { border-bottom: none; padding-bottom: 0; }

    .row-title {
      font-size: 14.5px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .row-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .split-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .split-box {
      background: var(--surface);
      border-radius: 10px;
      padding: 10px;
      border: 1px solid var(--divider);
    }

    .split-val {
      font-size: 15px;
      font-weight: 800;
      margin-top: 2px;
    }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .gateway-btn {
      border: 1px solid #dfe2ea;
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .gateway-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .switch {
      position: relative;
      width: 46px;
      height: 25px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #d6d8df;
      border-radius: 999px;
      transition: 0.2s;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 19px;
      height: 19px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background: var(--accent);
    }

    input:checked + .slider::before {
      transform: translateX(21px);
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 18px;
      border: 1px dashed #cfd2dc;
      border-radius: 14px;
      background: #fafafa;
    }

    .qr-grid {
      display: grid;
      grid-template-columns: repeat(9, 17px);
      gap: 3px;
      padding: 12px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--divider);
    }

    .qr-cell {
      width: 17px;
      height: 17px;
      border-radius: 2px;
      background: #fff;
    }

    .qr-cell.on {
      background: #161823;
    }

    .btn-primary {
      width: 100%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: 11px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.14s ease, transform 0.1s ease;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.99); }

    .btn-secondary {
      width: 100%;
      border: 1px solid var(--divider);
      background: var(--surface);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 11px;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-danger-outline {
      width: 100%;
      border: 1px solid #f3c6c3;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 11px;
      cursor: pointer;
      margin-top: 8px;
    }

    .mini-del-btn {
      border: none;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .input-field, .select-field, .textarea-field {
      width: 100%;
      border: 1px solid #d8dbe3;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-top: 6px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .textarea-field {
      min-height: 110px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
    }

    .input-field:focus, .select-field:focus, .textarea-field:focus {
      border-color: var(--text);
    }

    .log-item {
      padding: 9px 0;
      border-bottom: 1px solid var(--divider);
      font-size: 12.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .log-item:last-child { border-bottom: none; }

    .badge-ok {
      color: var(--success);
      font-weight: 700;
      font-size: 11.5px;
      background: var(--success-soft);
      padding: 2px 7px;
      border-radius: 999px;
      display: inline-block;
      margin-top: 2px;
    }

    .toast {
      position: fixed;
      bottom: calc(22px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(22, 24, 35, 0.95);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 60;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <span class="topbar-title">الإعدادات والاختصارات</span>
      <div class="topbar-actions">
        <button class="topbar-btn" id="importStateBtn" type="button">استيراد JSON</button>
        <button class="topbar-btn" id="exportStateBtn" type="button">تصدير JSON</button>
        <button class="topbar-btn" id="resetBtn" type="button">إعادة ضبط</button>
      </div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input class="search-input" id="searchInput" type="search" placeholder="ابحث في الاختصارات والإعدادات..." />
      </div>
    </div>

    <main id="menuContainer"></main>
  </div>

  <div class="drawer-backdrop" id="subpageBackdrop" aria-hidden="true">
    <div class="subpage" id="subpagePanel" role="dialog" aria-modal="true">
      <div class="subpage-header">
        <span class="subpage-title" id="subpageTitle"></span>
        <button class="close-btn" id="closeSubpageBtn" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div class="subpage-body" id="subpageBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "dert_release_ready_settings_v2";

    const defaultState = {
      appName: "DERT",
      packageId: "com.dert.app",
      versionName: "1.0.0",
      balanceCoins: 500,
      grossRevenueCoins: 1000,
      selectedGateway: "زين كاش",
      phoneOrWalletRef: "",
      transactions: [
        { id: "TX-101", title: "شحن رصيد (زين كاش)", amount: "+500 عملة", status: "مكتمل" }
      ],
      activityTime: "42 د اليوم",
      searchHistory: ["بث مباشر", "مقاطع مميزة", "إعدادات الحساب"],
      offlineVideos: [
        { id: "VID-1", title: "مقطع محفوظ #1", size: "18.4 MB" },
        { id: "VID-2", title: "مقطع محفوظ #2", size: "24.1 MB" }
      ],
      handle: "@w20xw",
      displayName: "وسام | wessam",
      minis: [
        { id: "M1", name: "المونتاج السريع", desc: "قص وتحويل المقاطع بسرعة", enabled: true },
        { id: "M2", name: "مولد العناوين", desc: "اقتراح عناوين وهاشتاغات للمحتوى", enabled: true }
      ],
      shopItems: [
        { id: "SH-1", name: "باقة تصميم احترافية", price: "25,000 د.ع" },
        { id: "SH-2", name: "إدارة صفحة وحساب", price: "40,000 د.ع" }
      ],
      studioStats: {
        views: "14.8K",
        followersGrowth: "+185",
        liveEnabled: true
      },
      promotedCount: 1,
      settings: {
        privateAccount: false,
        allowComments: true,
        allowDownloads: true,
        pushNotifications: true,
        dataSaver: false,
        language: "العربية (العراق)",
        twoFactorAuth: true
      }
    };

    function cloneDefault() {
      return JSON.parse(JSON.stringify(defaultState));
    }

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const base = cloneDefault();
        return {
          ...base,
          ...(raw || {}),
          transactions: Array.isArray(raw?.transactions) ? raw.transactions : base.transactions,
          searchHistory: Array.isArray(raw?.searchHistory) ? raw.searchHistory : base.searchHistory,
          offlineVideos: Array.isArray(raw?.offlineVideos) ? raw.offlineVideos : base.offlineVideos,
          minis: Array.isArray(raw?.minis) ? raw.minis : base.minis,
          shopItems: Array.isArray(raw?.shopItems) ? raw.shopItems : base.shopItems,
          studioStats: { ...base.studioStats, ...(raw?.studioStats || {}) },
          settings: { ...base.settings, ...(raw?.settings || {}) }
        };
      } catch {
        return cloneDefault();
      }
    }

    let state = loadState();
    let currentOpenItem = null;
    let searchQuery = "";

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      window.dispatchEvent(new CustomEvent("dert:stateUpdated", { detail: state }));
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove("show"), 2100);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const icons = {
      wallet: `<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14" r="1.2" fill="currentColor" stroke="none"/></svg>`,
      clock: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3.2 1.8"/></svg>`,
      offline: `<svg viewBox="0 0 24 24"><path d="M17.5 18H7.5a4.5 4.5 0 0 1-.8-8.9A5.5 5.5 0 0 1 17.3 7.5 4 4 0 0 1 17.5 18z"/><path d="M12 11v5m0 0-2-2m2 2 2-2"/></svg>`,
      qr: `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><path d="M14 14h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm4 2h2v2h-2z"/></svg>`,
      minis: `<svg viewBox="0 0 24 24"><path d="M12 3l8 4.6v9.2L12 21.4 4 16.8V7.6L12 3z"/><path d="M12 12l8-4.6M12 12v9.4M12 12 4 7.4"/></svg>`,
      shop: `<svg viewBox="0 0 24 24"><path d="M4 8l1.5-4h13L20 8"/><path d="M4 8h16v2a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-5 0A2.5 2.5 0 0 1 4 10V8z"/><path d="M6 12.5V20h12v-7.5"/></svg>`,
      studio: `<svg viewBox="0 0 24 24"><circle cx="10" cy="8.5" r="3.5"/><path d="M4 19.5c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><path d="M18 6l.9 2.1L21 9l-2.1.9L18 12l-.9-2.1L15 9l2.1-.9L18 6z"/></svg>`,
      promote: `<svg viewBox="0 0 24 24"><path d="M12 3c2.5 3.1 2.2 5.4.5 7.5 1.8-.3 3.2-1.7 3.7-3.5 2.1 2.1 2.8 5.2 1.8 8.2-1 2.9-3.6 4.8-6.7 4.8-3.7 0-6.3-2.8-6.3-6.4 0-2.6 1.4-4.8 3.6-6.2-.2 1.7.4 3.3 1.7 4.2-.6-1.8-.2-3.5 1-4.8z"/></svg>`,
      settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
      chevron: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`
    };

    function getSections() {
      const broadcasterShare = Math.round(state.grossRevenueCoins * 0.6);
      return [
        {
          title: "الأصول",
          items: [
            {
              id: "balance",
              label: "الرصيد",
              icon: "wallet",
              meta: `${state.balanceCoins} عملة • المذيع 60%: ${broadcasterShare}`
            }
          ]
        },
        {
          title: "الأدوات الشخصية",
          items: [
            { id: "activity", label: "مركز الأنشطة", icon: "clock", meta: state.activityTime },
            { id: "offline", label: "فيديوهات دون اتصال بالإنترنت", icon: "offline", meta: `${state.offlineVideos.length} محفوظة` },
            { id: "qr", label: "رمز QR لديك", icon: "qr", meta: state.handle },
            { id: "minis", label: `${state.appName} Minis`, icon: "minis", meta: `${state.minis.filter(m => m.enabled).length} مفعلة` }
          ]
        },
        {
          title: "أدوات الإبداع والأعمال",
          items: [
            { id: "shop", label: "المجموعة التجارية", icon: "shop", meta: `${state.shopItems.length} عنصر` },
            { id: "studio", label: `${state.appName} Studio`, icon: "studio", meta: `${state.studioStats.views} مشاهدة` },
            { id: "promote", label: "الترويج", icon: "promote", meta: `${state.promotedCount} نشط` }
          ]
        },
        {
          title: null,
          items: [
            { id: "settings", label: "الإعدادات والخصوصية", icon: "settings", meta: state.settings.language }
          ]
        }
      ];
    }

    function renderMenu() {
      const container = document.getElementById("menuContainer");
      container.innerHTML = "";
      const q = searchQuery.trim().toLowerCase();
      let totalRendered = 0;

      getSections().forEach((sec) => {
        const filteredItems = q
          ? sec.items.filter(it => it.label.toLowerCase().includes(q) || (it.meta || "").toLowerCase().includes(q))
          : sec.items;

        if (!filteredItems.length) return;
        totalRendered += filteredItems.length;

        const sectionEl = document.createElement("section");
        sectionEl.className = "section";

        if (sec.title) {
          const h2 = document.createElement("h2");
          h2.className = "section-title";
          h2.textContent = sec.title;
          sectionEl.appendChild(h2);
        }

        filteredItems.forEach((item) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "menu-item";
          btn.innerHTML = `
            <span class="menu-left">
              <span class="menu-icon">${icons[item.icon] || ""}</span>
              <span class="menu-label-wrap">
                <span class="menu-label">${escapeHtml(item.label)}</span>
                ${item.meta ? `<span class="menu-meta">${escapeHtml(item.meta)}</span>` : ""}
              </span>
            </span>
            <span class="menu-chevron">${icons.chevron}</span>
          `;
          btn.addEventListener("click", () => openSubpage(item));
          sectionEl.appendChild(btn);
        });

        container.appendChild(sectionEl);
      });

      if (!totalRendered) {
        container.innerHTML = `<div class="empty-search">لا توجد نتائج مطابقة للبحث "${escapeHtml(searchQuery)}"</div>`;
      }
    }

    function renderQrCells(seedText) {
      let hash = 0;
      for (let i = 0; i < seedText.length; i++) {
        hash = (hash * 31 + seedText.charCodeAt(i)) >>> 0;
      }
      return Array.from({ length: 81 }, (_, idx) => {
        const bit = ((hash >> (idx % 24)) ^ (idx * 7)) & 1;
        return `<span class="qr-cell ${bit ? "on" : ""}"></span>`;
      }).join("");
    }

    function openSubpage(item) {
      currentOpenItem = item;
      const backdrop = document.getElementById("subpageBackdrop");
      const titleEl = document.getElementById("subpageTitle");
      const bodyEl = document.getElementById("subpageBody");
      titleEl.textContent = item.label;

      if (item.id === "balance") {
        const gateways = ["زين كاش", "سوبر كي", "زين العراق", "آسياسيل"];
        const broadcasterShare = Math.round(state.grossRevenueCoins * 0.6);
        const platformShare = Math.round(state.grossRevenueCoins * 0.4);

        bodyEl.innerHTML = `
          <div class="card">
            <div class="row-title">الرصيد والعملات</div>
            <div style="font-size:26px;font-weight:800;margin:6px 0;">${state.balanceCoins} عملة</div>
            <div class="row-desc">توزيع أرباح البث والمحتوى: 60% للمذيع / 40% للمنصة</div>
            <div class="split-grid">
              <div class="split-box">
                <div class="row-desc">حصة المذيع (60%)</div>
                <div class="split-val">${broadcasterShare} عملة</div>
              </div>
              <div class="split-box">
                <div class="row-desc">حصة المنصة (40%)</div>
                <div class="split-val">${platformShare} عملة</div>
              </div>
            </div>
            <div class="pill-grid">
              ${gateways.map(g => `<button type="button" class="gateway-btn ${state.selectedGateway === g ? "active" : ""}" data-gw="${escapeHtml(g)}">${escapeHtml(g)}</button>`).join("")}
            </div>
            <input class="input-field" id="refInput" value="${escapeHtml(state.phoneOrWalletRef)}" placeholder="رقم المحفظة أو الخط (اختياري)" />
            <button class="btn-primary" id="topupBtn">+ شحن 200 عملة عبر ${escapeHtml(state.selectedGateway)}</button>
          </div>
          <div class="card">
            <div class="row-title" style="margin-bottom:8px;">سجل العمليات</div>
            ${state.transactions.map(t => `
              <div class="log-item">
                <div><strong>${escapeHtml(t.title)}</strong><div class="row-desc">${escapeHtml(t.id)}</div></div>
                <div><div>${escapeHtml(t.amount)}</div><span class="badge-ok">${escapeHtml(t.status)}</span></div>
              </div>
            `).join("")}
          </div>
        `;

        bodyEl.querySelectorAll("[data-gw]").forEach(b => {
          b.onclick = () => {
            state.selectedGateway = b.dataset.gw;
            saveState();
            openSubpage(item);
          };
        });

        bodyEl.querySelector("#topupBtn").onclick = () => {
          const refVal = bodyEl.querySelector("#refInput").value.trim();
          state.phoneOrWalletRef = refVal;
          state.balanceCoins += 200;
          state.grossRevenueCoins += 200;
          state.transactions.unshift({
            id: "TX-" + Math.floor(100 + Math.random() * 900),
            title: `شحن رصيد (${state.selectedGateway})${refVal ? " • " + refVal : ""}`,
            amount: "+200 عملة",
            status: "مكتمل"
          });
          saveState();
          renderMenu();
          openSubpage(item);
          showToast("تم شحن 200 عملة");
        };
      } else if (item.id === "activity") {
        bodyEl.innerHTML = `
          <div class="card">
            <div class="card-row">
              <div><div class="row-title">وقت الاستخدام اليومي</div><div class="row-desc">متابعة النشاط داخل التطبيق</div></div>
              <strong>${escapeHtml(state.activityTime)}</strong>
            </div>
            <div class="card-row">
              <div><div class="row-title">سجل البحث (${state.searchHistory.length})</div><div class="row-desc">${state.searchHistory.map(escapeHtml).join(" • ") || "لا يوجد سجل"}</div></div>
              <button class="topbar-btn" id="clearSearchHistBtn">مسح</button>
            </div>
          </div>
        `;
        bodyEl.querySelector("#clearSearchHistBtn").onclick = () => {
          state.searchHistory = [];
          saveState();
          openSubpage(item);
          showToast("تم مسح سجل البحث");
        };
      } else if (item.id === "offline") {
        bodyEl.innerHTML = `
          <div class="card">
            <div class="row-title">الفيديوهات المحفوظة دون اتصال (${state.offlineVideos.length})</div>
            ${state.offlineVideos.map(v => `
              <div class="log-item">
                <div><strong>${escapeHtml(v.title)}</strong><div class="row-desc">${escapeHtml(v.size)}</div></div>
                <span class="badge-ok">جاهز</span>
              </div>
            `).join("") || `<div class="row-desc" style="margin:8px 0;">لا توجد فيديوهات محفوظة حالياً</div>`}
            <button class="btn-primary" id="addOfflineBtn">+ حفظ فيديو جديد</button>
            <button class="btn-danger-outline" id="clearOfflineBtn">حذف جميع الفيديوهات المحفوظة</button>
          </div>
        `;
        bodyEl.querySelector("#addOfflineBtn").onclick = () => {
          const idx = state.offlineVideos.length + 1;
          state.offlineVideos.push({ id: "VID-" + Date.now(), title: `مقطع محفوظ #${idx}`, size: "21.5 MB" });
          saveState();
          renderMenu();
          openSubpage(item);
          showToast("تم حفظ الفيديو");
        };
        bodyEl.querySelector("#clearOfflineBtn").onclick = () => {
          state.offlineVideos = [];
          saveState();
          renderMenu();
          openSubpage(item);
          showToast("تم حذف المحفوظات");
        };
      } else if (item.id === "qr") {
        bodyEl.innerHTML = `
          <div class="qr-box">
            <div class="row-title">${escapeHtml(state.displayName)} (${escapeHtml(state.handle)})</div>
            <div class="qr-grid">${renderQrCells(state.handle)}</div>
            <label style="width:100%;font-size:12px;color:var(--muted);">اسم العرض:
              <input class="input-field" id="nameInput" value="${escapeHtml(state.displayName)}" />
            </label>
            <label style="width:100%;font-size:12px;color:var(--muted);">المعرف (@username):
              <input class="input-field" id="handleInput" value="${escapeHtml(state.handle)}" />
            </label>
            <button class="btn-primary" id="saveQrBtn">حفظ بيانات الحساب ورمز QR</button>
          </div>
        `;
        bodyEl.querySelector("#saveQrBtn").onclick = () => {
          const h = bodyEl.querySelector("#handleInput").value.trim();
          const n = bodyEl.querySelector("#nameInput").value.trim();
          if (h) state.handle = h.startsWith("@") ? h : "@" + h;
          if (n) state.displayName = n;
          saveState();
          renderMenu();
          openSubpage(item);
          showToast("تم التحديث");
        };
      } else if (item.id === "minis") {
        bodyEl.innerHTML = `
          <div class="card">
            ${state.minis.map((m, i) => `
              <div class="card-row">
                <div><div class="row-title">${escapeHtml(m.name)}</div><div class="row-desc">${escapeHtml(m.desc)}</div></div>
                <label class="switch">
                  <input type="checkbox" data-m-idx="${i}" ${m.enabled ? "checked" : ""} />
                  <span class="slider"></span>
                </label>
              </div>
            `).join("")}
          </div>
        `;
        bodyEl.querySelectorAll("[data-m-idx]").forEach(chk => {
          chk.onchange = () => {
            state.minis[Number(chk.dataset.mIdx)].enabled = chk.checked;
            saveState();
            renderMenu();
            showToast("تم تحديث الأداة المصغرة");
          };
        });
      } else if (item.id === "shop") {
        bodyEl.innerHTML = `
          <div class="card">
            <div class="row-title" style="margin-bottom:8px;">عناصر المجموعة التجارية</div>
            ${state.shopItems.map((s, idx) => `
              <div class="log-item">
                <div><strong>${escapeHtml(s.name)}</strong><div class="row-desc">${escapeHtml(s.id)}</div></div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <strong>${escapeHtml(s.price)}</strong>
                  <button type="button" class="mini-del-btn" data-del-shop="${idx}">حذف</button>
                </div>
              </div>
            `).join("") || `<div class="row-desc" style="margin:6px 0;">لا توجد عناصر حالياً</div>`}
            <input class="input-field" id="newShopName" placeholder="اسم خدمة أو منتج جديد" />
            <input class="input-field" id="newShopPrice" placeholder="السعر (مثال: 15,000 د.ع)" />
            <button class="btn-primary" id="addShopBtn">+ إضافة للمجموعة التجارية</button>
          </div>
        `;
        bodyEl.querySelectorAll("[data-del-shop]").forEach(btn => {
          btn.onclick = () => {
            state.shopItems.splice(Number(btn.dataset.delShop), 1);
            saveState();
            renderMenu();
            openSubpage(item);
            showToast("تم حذف العنصر");
          };
        });
        bodyEl.querySelector("#addShopBtn").onclick = () => {
          const name = bodyEl.querySelector("#newShopName").value.trim();
          const price = bodyEl.querySelector("#newShopPrice").value.trim() || "10,000 د.ع";
          if (!name) return;
          state.shopItems.push({ id: "SH-" + Math.floor(100 + Math.random() * 900), name, price });
          saveState();
          renderMenu();
          openSubpage(item);
          showToast("تمت الإضافة");
        };
      } else if (item.id === "studio") {
        bodyEl.innerHTML = `
          <div class="card">
            <div class="card-row"><div><div class="row-title">إجمالي المشاهدات</div><div class="row-desc">آخر 30 يوماً</div></div><strong>${escapeHtml(state.studioStats.views)}</strong></div>
            <div class="card-row"><div><div class="row-title">نمو المتابعين</div><div class="row-desc">صافي الزيادة</div></div><strong>${escapeHtml(state.studioStats.followersGrowth)}</strong></div>
            <div class="card-row">
              <div><div class="row-title">تفعيل البث المباشر</div><div class="row-desc">السماح ببدء بث مباشر من الاستوديو</div></div>
              <label class="switch">
                <input type="checkbox" id="liveToggle" ${state.studioStats.liveEnabled ? "checked" : ""} />
                <span class="slider"></span>
              </label>
            </div>
          </div>
        `;
        bodyEl.querySelector("#liveToggle").onchange = (e) => {
          state.studioStats.liveEnabled = e.target.checked;
          saveState();
          showToast("تم تحديث حالة البث المباشر");
        };
      } else if (item.id === "promote") {
        bodyEl.innerHTML = `
          <div class="card">
            <div class="row-title">حملات الترويج النشطة: ${state.promotedCount}</div>
            <div class="row-desc">زيادة وصول الفيديوهات والمحتوى</div>
            <button class="btn-primary" id="addPromoBtn">+ إطلاق حملة ترويج جديدة</button>
          </div>
        `;
        bodyEl.querySelector("#addPromoBtn").onclick = () => {
          state.promotedCount += 1;
          saveState();
          renderMenu();
          openSubpage(item);
          showToast("تم إطلاق الحملة");
        };
      } else if (item.id === "settings") {
        const s = state.settings;
        const toggleRow = (key, title, desc) => `
          <div class="card-row">
            <div><div class="row-title">${title}</div><div class="row-desc">${desc}</div></div>
            <label class="switch">
              <input type="checkbox" data-skey="${key}" ${s[key] ? "checked" : ""} />
              <span class="slider"></span>
            </label>
          </div>
        `;
        bodyEl.innerHTML = `
          <div class="card">
            ${toggleRow("privateAccount", "حساب خاص", "تقييد مشاهدة المحتوى على المتابعين المعتمدين")}
            ${toggleRow("allowComments", "التعليقات", "السماح بالتعليق على المنشورات")}
            ${toggleRow("allowDownloads", "التنزيلات", "السماح بتنزيل المقاطع")}
            ${toggleRow("pushNotifications", "الإشعارات الفورية", "تنبيهات الرسائل والنشاط")}
            ${toggleRow("dataSaver", "توفير البيانات", "تقليل استهلاك الإنترنت أثناء التصفح")}
            ${toggleRow("twoFactorAuth", "المصادقة الثنائية", "حماية إضافية لتسجيل الدخول")}
            <div class="card-row" style="flex-direction:column;align-items:stretch;">
              <div class="row-title">اللغة والمنطقة</div>
              <select class="select-field" id="langSelect">
                <option value="العربية (العراق)" ${s.language === "العربية (العراق)" ? "selected" : ""}>العربية (العراق)</option>
                <option value="العربية" ${s.language === "العربية" ? "selected" : ""}>العربية</option>
                <option value="English" ${s.language === "English" ? "selected" : ""}>English</option>
              </select>
            </div>
          </div>
          <div class="card">
            <div class="row-desc">معرف الحزمة: <strong>${escapeHtml(state.packageId)}</strong> • الإصدار: <strong>${escapeHtml(state.versionName)}</strong></div>
          </div>
        `;

        bodyEl.querySelectorAll("[data-skey]").forEach(chk => {
          chk.onchange = () => {
            state.settings[chk.dataset.skey] = chk.checked;
            saveState();
            showToast("تم حفظ الإعداد");
          };
        });

        bodyEl.querySelector("#langSelect").onchange = (e) => {
          state.settings.language = e.target.value;
          saveState();
          renderMenu();
          showToast("تم تغيير اللغة");
        };
      }

      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
    }

    function openImportModal() {
      currentOpenItem = { id: "import_json", label: "استيراد نسخة JSON" };
      const backdrop = document.getElementById("subpageBackdrop");
      document.getElementById("subpageTitle").textContent = "استيراد نسخة JSON";
      document.getElementById("subpageBody").innerHTML = `
        <div class="card">
          <div class="row-title">الصق بيانات JSON هنا</div>
          <div class="row-desc">سيتم التحقق من الصيغة وحفظ الإعدادات تلقائياً</div>
          <textarea class="textarea-field" id="jsonImportArea" placeholder='{"balanceCoins": 500}'></textarea>
          <button class="btn-primary" id="applyJsonBtn">تطبيق واستيراد</button>
        </div>
      `;
      document.getElementById("applyJsonBtn").onclick = () => {
        try {
          const parsed = JSON.parse(document.getElementById("jsonImportArea").value);
          if (!parsed || typeof parsed !== "object") throw new Error("invalid");
          localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
          state = loadState();
          renderMenu();
          closeSubpage();
          showToast("تم استيراد الإعدادات بنجاح");
        } catch {
          showToast("صيغة JSON غير صحيحة");
        }
      };
      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
    }

    function closeSubpage() {
      currentOpenItem = null;
      const backdrop = document.getElementById("subpageBackdrop");
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeSubpageBtn").addEventListener("click", closeSubpage);
    document.getElementById("subpageBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "subpageBackdrop") closeSubpage();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderMenu();
    });

    document.getElementById("importStateBtn").addEventListener("click", openImportModal);

    document.getElementById("exportStateBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "dert-settings-backup.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("تم تصدير البيانات JSON");
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      state = cloneDefault();
      saveState();
      renderMenu();
      if (currentOpenItem && currentOpenItem.id !== "import_json") openSubpage(currentOpenItem);
      showToast("تمت إعادة الضبط بالكامل");
    });

    renderMenu();
  </script>
</body>
</html>
