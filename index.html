<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>DERT — تيك توك وانستا</title>
  <style>
    :root {
      --bg: #ffffff;
      --dark: #0f1015;
      --dark-card: #191b24;
      --surface: #f5f6f8;
      --text: #161823;
      --muted: #6e7280;
      --border: #e9eaee;
      --accent: #fe2c55;
      --accent-soft: #fff0f3;
      --blue: #0095f6;
      --success: #0f9d58;
      --danger: #d93025;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: #e9ecf1;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Kufi Arabic", "Cairo", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .phone-frame {
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-top: var(--safe-top);
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .top-header {
      height: 52px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #fff;
      z-index: 15;
      flex-shrink: 0;
    }

    .top-header.dark {
      background: rgba(15, 16, 21, 0.88);
      color: #fff;
      border-bottom-color: rgba(255,255,255,0.08);
      position: absolute;
      top: var(--safe-top);
      left: 0;
      right: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .feed-tabs {
      display: flex;
      gap: 16px;
      font-size: 15px;
      font-weight: 700;
    }

    .feed-tab {
      background: none;
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 2px;
      position: relative;
    }

    .feed-tab.active {
      color: #fff;
    }

    .feed-tab.active::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 2.5px;
      background: #fff;
      border-radius: 99px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: inherit;
      font-size: 19px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
    }

    .screen-area {
      flex: 1;
      overflow-y: auto;
      position: relative;
      padding-bottom: calc(64px + var(--safe-bottom));
    }

    .screen-area.no-pad-top {
      padding-top: 0;
      background: var(--dark);
    }

    /* Reels / Feed */
    .reel-card {
      position: relative;
      width: 100%;
      min-height: calc(100dvh - 52px - 64px - var(--safe-top) - var(--safe-bottom));
      background: #14161f;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      border-bottom: 6px solid #090a0f;
    }

    .reel-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    .reel-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
    }

    .reel-content {
      position: relative;
      z-index: 2;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .reel-info {
      flex: 1;
      min-width: 0;
    }

    .reel-user-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .follow-mini-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .follow-mini-btn.following {
      background: rgba(255,255,255,0.22);
    }

    .reel-caption {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .reel-tag {
      font-size: 12px;
      color: #d6d9e6;
    }

    .reel-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .action-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .circle-action {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .circle-action.liked {
      color: var(--accent);
      background: rgba(254, 44, 85, 0.22);
    }

    .action-count {
      font-size: 11.5px;
      font-weight: 700;
    }

    /* Explore / Instagram Grid */
    .explore-search {
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
    }

    .insta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding-top: 2px;
    }

    .grid-tile {
      aspect-ratio: 3 / 4;
      position: relative;
      background: #222;
      cursor: pointer;
      overflow: hidden;
    }

    .grid-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grid-views {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* Inbox */
    .stories-strip {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 64px;
      font-size: 11.5px;
      cursor: pointer;
    }

    .story-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg, #fe2c55, #ff9a44);
      display: grid;
      place-items: center;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    .chat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      background: #fff;
    }

    .chat-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-sm {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
    }

    .unread-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }

    /* Profile */
    .profile-hero {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .avatar-lg {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      margin-bottom: 8px;
    }

    .stats-row {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin: 12px 0;
    }

    .stat-num {
      font-size: 16px;
      font-weight: 800;
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--muted);
    }

    .profile-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }

    .btn-sm {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 9px;
      cursor: pointer;
    }

    .btn-sm.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 460px;
      height: calc(58px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: #fff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 25;
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--text);
      font-weight: 800;
    }

    .plus-pill {
      background: var(--text);
      color: #fff;
      width: 40px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
    }

    /* Drawer & Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }

    .overlay.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 460px;
      max-height: 88dvh;
      background: #fff;
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sheet-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }

    .sheet-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 4px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      text-align: right;
      font-size: 14.5px;
      font-weight: 600;
    }

    .field {
      width: 100%;
      border: 1px solid #d5d8e0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-top: 8px;
      font-family: inherit;
    }

    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .gw-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .gw-chip {
      border: 1px solid #d5d8e0;
      background: #fff;
      border-radius: 9px;
      padding: 9px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .gw-chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #161823;
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 80;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <header class="top-header" id="topHeader"></header>
    <main class="screen-area" id="screenArea"></main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="home" type="button"><span>🏠</span><span>الرئيسية</span></button>
      <button class="nav-btn" data-tab="explore" type="button"><span>🔎</span><span>استكشاف</span></button>
      <button class="nav-btn" id="openCreateBtn" type="button"><span class="plus-pill">+</span><span>نشر</span></button>
      <button class="nav-btn" data-tab="inbox" type="button"><span>💬</span><span>الوارد</span></button>
      <button class="nav-btn" data-tab="profile" type="button"><span>👤</span><span>حسابي</span></button>
    </nav>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet">
      <div class="sheet-head">
        <span id="sheetTitle"></span>
        <button class="icon-btn" id="closeSheetBtn" type="button">✕</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const KEY = "dert_tiktok_insta_app_v1";

    const initialData = {
      tab: "home",
      feedMode: "foryou",
      user: {
        name: "وسام | wessam",
        handle: "@w20xw",
        bio: "محتوى إبداعي • تقنية • تصميم\nDERT Creator",
        avatar: "https://picsum.photos/200/200?random=11",
        followers: 14900,
        following: 85,
        likes: 82900,
        coins: 500,
        grossCoins: 1000,
        gateway: "زين كاش",
        privateAcc: false,
        commentsOn: true,
        offlineSaved: 3,
        promoted: 1
      },
      posts: [
        {
          id: "p1",
          author: "وسام | wessam",
          handle: "@w20xw",
          avatar: "https://picsum.photos/200/200?random=11",
          media: "https://picsum.photos/500/800?random=21",
          caption: "بداية قوية على DERT 🔥 #محتوى #إبداع",
          sound: "صوت أصلي - w20xw",
          views: "12.4K",
          likes: 1420,
          liked: false,
          following: true,
          comments: ["رهيب جداً 👏", "استمر يا بطل"]
        },
        {
          id: "p2",
          author: "استوديو الإبداع",
          handle: "@creative_hub",
          avatar: "https://picsum.photos/200/200?random=12",
          media: "https://picsum.photos/500/800?random=22",
          caption: "لقطات وتصميمات جديدة ✨ #تصميم #برمجة",
          sound: "موسيقى هادئة - DERT",
          views: "8.9K",
          likes: 940,
          liked: true,
          following: false,
          comments: ["فكرة حلوة"]
        },
        {
          id: "p3",
          author: "بث مباشر DERT",
          handle: "@dert_live",
          avatar: "https://picsum.photos/200/200?random=13",
          media: "https://picsum.photos/500/800?random=23",
          caption: "تفاعل مباشر وتوزيع هدايا 60% للمذيع / 40% للمنصة",
          sound: "بث مباشر - DERT Live",
          views: "21.1K",
          likes: 2650,
          liked: false,
          following: true,
          comments: ["متابعينك من البداية"]
        }
      ],
      chats: [
        { id: "c1", name: "علي رشيد", avatar: "https://picsum.photos/100/100?random=31", lastMsg: "شاف المقطع الجديد؟", time: "الآن", unread: 2 },
        { id: "c2", name: "إشعارات النظام", avatar: "https://picsum.photos/100/100?random=32", lastMsg: "تم تفعيل الرصيد والمحفظة بنجاح", time: "10 د", unread: 1 }
      ],
      search: ""
    };

    let db = JSON.parse(localStorage.getItem(KEY) || "null") || JSON.parse(JSON.stringify(initialData));

    function save() {
      localStorage.setItem(KEY, JSON.stringify(db));
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1900);
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }

    function render() {
      const header = document.getElementById("topHeader");
      const area = document.getElementById("screenArea");

      document.querySelectorAll(".nav-btn[data-tab]").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === db.tab);
      });

      if (db.tab === "home") {
        header.className = "top-header dark";
        header.innerHTML = `
          <button class="icon-btn" onclick="openSettingsDrawer()" type="button">☰</button>
          <div class="feed-tabs">
            <button class="feed-tab ${db.feedMode === "following" ? "active" : ""}" onclick="setMode('following')" type="button">أتابعه</button>
            <button class="feed-tab ${db.feedMode === "foryou" ? "active" : ""}" onclick="setMode('foryou')" type="button">لك</button>
          </div>
          <button class="icon-btn" onclick="switchTab('explore')" type="button">🔍</button>
        `;
        area.className = "screen-area no-pad-top";
        const list = db.feedMode === "following" ? db.posts.filter(p => p.following) : db.posts;
        area.innerHTML = (list.length ? list : db.posts).map(p => `
          <article class="reel-card">
            <img class="reel-media" src="${esc(p.media)}" alt="" />
            <div class="reel-gradient"></div>
            <div class="reel-content">
              <div class="reel-info">
                <div class="reel-user-row">
                  <strong>${esc(p.handle)}</strong>
                  <button class="follow-mini-btn ${p.following ? "following" : ""}" onclick="toggleFollow('${p.id}')" type="button">
                    ${p.following ? "متابَع" : "+ متابعة"}
                  </button>
                </div>
                <div class="reel-caption">${esc(p.caption)}</div>
                <div class="reel-tag">🎵 ${esc(p.sound)}</div>
              </div>
              <div class="reel-actions">
                <div class="action-col">
                  <button class="circle-action ${p.liked ? "liked" : ""}" onclick="toggleLike('${p.id}')" type="button">♥</button>
                  <span class="action-count">${p.likes}</span>
                </div>
                <div class="action-col">
                  <button class="circle-action" onclick="openComments('${p.id}')" type="button">💬</button>
                  <span class="action-count">${p.comments.length}</span>
                </div>
                <div class="action-col">
                  <button class="circle-action" onclick="sharePost('${p.id}')" type="button">↗</button>
                  <span class="action-count">مشاركة</span>
                </div>
              </div>
            </div>
          </article>
        `).join("");
      } else if (db.tab === "explore") {
        header.className = "top-header";
        header.innerHTML = `
          <span class="brand-title">استكشاف DERT</span>
          <button class="icon-btn" onclick="openWallet()" type="button">🪙 ${db.user.coins}</button>
        `;
        area.className = "screen-area";
        const q = db.search.trim().toLowerCase();
        const filtered = q ? db.posts.filter(p => p.caption.toLowerCase().includes(q) || p.handle.toLowerCase().includes(q)) : db.posts;
        area.innerHTML = `
          <div class="explore-search">
            <input class="search-input" value="${esc(db.search)}" oninput="updateSearch(this.value)" placeholder="ابحث عن مقاطع أو حسابات..." />
          </div>
          <div class="insta-grid">
            ${filtered.map(p => `
              <div class="grid-tile" onclick="openPostPreview('${p.id}')">
                <img src="${esc(p.media)}" alt="" />
                <span class="grid-views">▶ ${esc(p.views)}</span>
              </div>
            `).join("")}
          </div>
        `;
      } else if (db.tab === "inbox") {
        header.className = "top-header";
        header.innerHTML = `
          <span class="brand-title">صندوق الوارد</span>
          <button class="icon-btn" onclick="openSettingsDrawer()" type="button">☰</button>
        `;
        area.className = "screen-area";
        area.innerHTML = `
          <div class="stories-strip">
            ${db.posts.map(p => `
              <div class="story-item" onclick="openPostPreview('${p.id}')">
                <div class="story-ring"><img src="${esc(p.avatar)}" alt="" /></div>
                <span>${esc(p.author.split(" ")[0])}</span>
              </div>
            `).join("")}
          </div>
          ${db.chats.map(c => `
            <div class="chat-row" onclick="openChat('${c.id}')">
              <div class="chat-left">
                <img class="avatar-sm" src="${esc(c.avatar)}" alt="" />
                <div>
                  <div style="font-weight:700;font-size:14.5px;">${esc(c.name)}</div>
                  <div style="color:var(--muted);font-size:12.5px;margin-top:2px;">${esc(c.lastMsg)}</div>
                </div>
              </div>
              <div style="text-align:left;">
                <div style="font-size:11px;color:var(--muted);">${esc(c.time)}</div>
                ${c.unread ? `<span class="unread-badge">${c.unread}</span>` : ""}
              </div>
            </div>
          `).join("")}
        `;
      } else if (db.tab === "profile") {
        header.className = "top-header";
        header.innerHTML = `
          <span class="brand-title">${esc(db.user.handle)}</span>
          <button class="icon-btn" onclick="openSettingsDrawer()" type="button">☰</button>
        `;
        area.className = "screen-area";
        area.innerHTML = `
          <div class="profile-hero">
            <img class="avatar-lg" src="${esc(db.user.avatar)}" alt="" />
            <div style="font-size:17px;font-weight:800;">${esc(db.user.name)}</div>
            <div style="font-size:12.5px;color:var(--muted);white-space:pre-line;margin-top:4px;">${esc(db.user.bio)}</div>
            <div class="stats-row">
              <div><div class="stat-num">${db.user.following}</div><div class="stat-lbl">أتابعه</div></div>
              <div><div class="stat-num">${db.user.followers}</div><div class="stat-lbl">متابعون</div></div>
              <div><div class="stat-num">${db.user.likes}</div><div class="stat-lbl">إعجابات</div></div>
            </div>
            <div class="profile-actions">
              <button class="btn-sm primary" onclick="openEditProfile()" type="button">تعديل الملف</button>
              <button class="btn-sm" onclick="openWallet()" type="button">الرصيد (${db.user.coins})</button>
              <button class="btn-sm" onclick="openSettingsDrawer()" type="button">الإعدادات</button>
            </div>
          </div>
          <div class="insta-grid">
            ${db.posts.map(p => `
              <div class="grid-tile" onclick="openPostPreview('${p.id}')">
                <img src="${esc(p.media)}" alt="" />
                <span class="grid-views">♥ ${p.likes}</span>
              </div>
            `).join("")}
          </div>
        `;
      }
    }

    function switchTab(t) { db.tab = t; save(); render(); }
    function setMode(m) { db.feedMode = m; save(); render(); }
    function updateSearch(v) { db.search = v; render(); }

    function toggleLike(id) {
      const p = db.posts.find(x => x.id === id);
      if (!p) return;
      p.liked = !p.liked;
      p.likes += p.liked ? 1 : -1;
      db.user.likes += p.liked ? 1 : -1;
      save(); render();
    }

    function toggleFollow(id) {
      const p = db.posts.find(x => x.id === id);
      if (!p) return;
      p.following = !p.following;
      db.user.following += p.following ? 1 : -1;
      save(); render();
      toast(p.following ? "تمت المتابعة" : "تم إلغاء المتابعة");
    }

    function sharePost(id) {
      toast("تم نسخ رابط المنشور");
    }

    function openSheet(title, html) {
      document.getElementById("sheetTitle").textContent = title;
      document.getElementById("sheetBody").innerHTML = html;
      document.getElementById("overlay").classList.add("open");
    }

    function closeSheet() {
      document.getElementById("overlay").classList.remove("open");
    }

    function openComments(id) {
      const p = db.posts.find(x => x.id === id);
      if (!p) return;
      openSheet(`التعليقات (${p.comments.length})`, `
        <div id="cmtList">${p.comments.map(c => `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;">${esc(c)}</div>`).join("")}</div>
        <input class="field" id="cmtInput" placeholder="اكتب تعليقاً..." />
        <button class="btn-main" onclick="addComment('${id}')" type="button">إرسال التعليق</button>
      `);
    }

    function addComment(id) {
      const inp = document.getElementById("cmtInput");
      const val = inp.value.trim();
      if (!val) return;
      const p = db.posts.find(x => x.id === id);
      p.comments.push(val);
      save(); render(); openComments(id);
    }

    function openPostPreview(id) {
      const p = db.posts.find(x => x.id === id);
      if (!p) return;
      openSheet(p.author, `
        <img src="${esc(p.media)}" style="width:100%;border-radius:12px;max-height:360px;object-fit:cover;" />
        <p style="margin-top:10px;font-size:14px;">${esc(p.caption)}</p>
        <div style="margin-top:8px;font-size:12.5px;color:var(--muted);">المشاهدات: ${esc(p.views)} • الإعجابات: ${p.likes}</div>
      `);
    }

    function openChat(id) {
      const c = db.chats.find(x => x.id === id);
      if (!c) return;
      c.unread = 0;
      save(); render();
      openSheet(c.name, `
        <div style="background:var(--surface);padding:12px;border-radius:10px;font-size:13.5px;">${esc(c.lastMsg)}</div>
        <input class="field" id="msgInp" placeholder="اكتب رسالة..." />
        <button class="btn-main" onclick="sendChat('${id}')" type="button">إرسال</button>
      `);
    }

    function sendChat(id) {
      const inp = document.getElementById("msgInp");
      const val = inp.value.trim();
      if (!val) return;
      const c = db.chats.find(x => x.id === id);
      c.lastMsg = val;
      c.time = "الآن";
      save(); render(); openChat(id);
    }

    function openEditProfile() {
      openSheet("تعديل الملف الشخصي", `
        <input class="field" id="pName" value="${esc(db.user.name)}" placeholder="الاسم" />
        <input class="field" id="pHandle" value="${esc(db.user.handle)}" placeholder="@username" />
        <textarea class="field" id="pBio" rows="3" placeholder="النبذة التعريفية">${esc(db.user.bio)}</textarea>
        <button class="btn-main" onclick="saveProfile()" type="button">حفظ التعديلات</button>
      `);
    }

    function saveProfile() {
      db.user.name = document.getElementById("pName").value.trim() || db.user.name;
      const h = document.getElementById("pHandle").value.trim();
      if (h) db.user.handle = h.startsWith("@") ? h : "@" + h;
      db.user.bio = document.getElementById("pBio").value;
      save(); render(); closeSheet(); toast("تم حفظ الملف الشخصي");
    }

    function openWallet() {
      const gws = ["زين كاش", "سوبر كي", "زين العراق", "آسياسيل"];
      const mShare = Math.round(db.user.grossCoins * 0.6);
      const pShare = Math.round(db.user.grossCoins * 0.4);
      openSheet("الرصيد والمحفظة", `
        <div style="font-size:24px;font-weight:800;">${db.user.coins} عملة</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:4px;">حصة المذيع (60%): ${mShare} • حصة المنصة (40%): ${pShare}</div>
        <div class="gw-grid">
          ${gws.map(g => `<button class="gw-chip ${db.user.gateway === g ? "active" : ""}" onclick="pickGw('${g}')" type="button">${g}</button>`).join("")}
        </div>
        <button class="btn-main" onclick="topupCoins()" type="button">+ شحن 200 عملة (${esc(db.user.gateway)})</button>
      `);
    }

    function pickGw(g) { db.user.gateway = g; save(); openWallet(); }
    function topupCoins() {
      db.user.coins += 200;
      db.user.grossCoins += 200;
      save(); render(); openWallet(); toast("تم شحن 200 عملة");
    }

    function openSettingsDrawer() {
      openSheet("الإعدادات والاختصارات", `
        <button class="setting-row" onclick="openWallet()" type="button"><span>💰 الرصيد</span><span>${db.user.coins} عملة ‹</span></button>
        <button class="setting-row" onclick="toast('مركز الأنشطة مفعّل')" type="button"><span>⏱ مركز الأنشطة</span><span>‹</span></button>
        <button class="setting-row" onclick="saveOffline()" type="button"><span>☁ فيديوهات دون اتصال</span><span>${db.user.offlineSaved} ‹</span></button>
        <button class="setting-row" onclick="toast('${esc(db.user.handle)}')" type="button"><span>🔳 رمز QR لديك</span><span>‹</span></button>
        <button class="setting-row" onclick="toast('DERT Minis جاهزة')" type="button"><span>🧊 DERT Minis</span><span>‹</span></button>
        <button class="setting-row" onclick="toast('المجموعة التجارية مفعّلة')" type="button"><span>🛍 المجموعة التجارية</span><span>‹</span></button>
        <button class="setting-row" onclick="toast('DERT Studio جاهز')" type="button"><span>🎬 DERT Studio</span><span>‹</span></button>
        <button class="setting-row" onclick="addPromo()" type="button"><span>🔥 الترويج</span><span>${db.user.promoted} نشط ‹</span></button>
        <button class="setting-row" onclick="togglePrivacy()" type="button"><span>⚙ حساب خاص</span><span>${db.user.privateAcc ? "مفعّل" : "عام"} ‹</span></button>
      `);
    }

    function saveOffline() { db.user.offlineSaved += 1; save(); openSettingsDrawer(); toast("تم حفظ فيديو دون اتصال"); }
    function addPromo() { db.user.promoted += 1; save(); openSettingsDrawer(); toast("تم تفعيل ترويج جديد"); }
    function togglePrivacy() { db.user.privateAcc = !db.user.privateAcc; save(); openSettingsDrawer(); toast("تم تحديث الخصوصية"); }

    document.getElementById("openCreateBtn").addEventListener("click", () => {
      openSheet("نشر مقطع أو صورة جديدة", `
        <input class="field" id="newCap" placeholder="اكتب وصف المنشور..." />
        <button class="btn-main" onclick="createPost()" type="button">نشر الآن</button>
      `);
    });

    function createPost() {
      const cap = document.getElementById("newCap").value.trim() || "منشور جديد على DERT ✨";
      const rnd = Math.floor(40 + Math.random() * 50);
      db.posts.unshift({
        id: "p_" + Date.now(),
        author: db.user.name,
        handle: db.user.handle,
        avatar: db.user.avatar,
        media: `https://picsum.photos/500/800?random=${rnd}`,
        caption: cap,
        sound: "صوت أصلي - " + db.user.handle,
        views: "1",
        likes: 0,
        liked: false,
        following: true,
        comments: []
      });
      save(); closeSheet(); switchTab("home"); toast("تم نشر المنشور");
    }

    document.querySelectorAll(".nav-btn[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    document.getElementById("overlay").addEventListener("click", e => {
      if (e.target.id === "overlay") closeSheet();
    });

    render();
  </script>
</body>
</html>
