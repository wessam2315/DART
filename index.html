
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DERT - منصة التواصل الاجتماعي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f7;color:#172033}
header{background:#2563eb;color:white;padding:18px;text-align:center;font-size:26px;font-weight:bold}
.container{max-width:650px;margin:18px auto;padding:12px}
.card,.post{background:white;padding:18px;margin-bottom:15px;border-radius:15px;box-shadow:0 3px 12px #00000010}
input,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
textarea{min-height:90px;resize:vertical}
button,.choose-photo{display:inline-block;border:0;border-radius:10px;padding:13px;background:#2563eb;color:white;font-size:16px;cursor:pointer;margin-top:8px;text-align:center}
button:disabled{opacity:.6}
.full{width:100%}
.secondary{background:#475569}
.danger{background:#dc2626}
.small{color:#64748b;font-size:13px}
#home{display:none}
#message,#postMessage,#profileMessage{text-align:center;line-height:1.7}
.profile{border:2px solid #dbeafe}
.profile-top{display:flex;align-items:center;gap:15px}
.avatar{width:85px;height:85px;border-radius:50%;object-fit:cover;background:#2563eb;color:white;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold}
.profile-name{font-size:21px;font-weight:bold}
.username{color:#64748b;margin-top:6px}
.stats{display:flex;justify-content:space-around;text-align:center;padding:17px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;margin:15px 0}
.stats strong{display:block;font-size:20px}
.stats span{font-size:13px;color:#64748b}
.post img{width:100%;max-height:450px;object-fit:contain;border-radius:10px;margin-top:10px}
.post-text{white-space:pre-wrap;line-height:1.7}
.post-date{font-size:12px;color:#777;margin-top:10px}
#avatarFile{display:none}
.choose-photo{width:100%;background:#475569}
.photo-help{font-size:12px;color:#64748b;margin-top:5px}
</style>
</head>

<body>
<header>DERT 🌍</header>

<div class="container">

<section id="auth" class="card">
<h2 style="text-align:center">مرحباً بك في DERT</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button class="full" id="loginBtn">تسجيل الدخول</button>
<button class="full secondary" id="signupBtn">إنشاء حساب جديد</button>
<p id="message"></p>
</section>

<section id="home">

<div class="card profile" id="profileSection">
<h2>👤 ملفي الشخصي</h2>

<div class="profile-top">
<div id="avatarDisplay" class="avatar">D</div>
<div>
<div id="displayName" class="profile-name">مستخدم DERT</div>
<div id="displayUsername" class="username">@username</div>
</div>
</div>

<div class="stats">
<div><strong id="postsCount">0</strong><span>منشورات</span></div>
<div><strong>0</strong><span>متابعون</span></div>
<div><strong>0</strong><span>يتابع</span></div>
</div>

<h3>تعديل معلومات الحساب</h3>
<input id="fullName" placeholder="الاسم الكامل">
<input id="username" placeholder="اسم المستخدم بالإنجليزية">
<textarea id="bio" placeholder="اكتب نبذة عن نفسك"></textarea>

<label class="choose-photo" for="avatarFile">📷 اختيار صورة من الهاتف</label>
<input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp">
<p class="photo-help">اختر صورة بصيغة JPG أو PNG أو WEBP، بحجم لا يتجاوز 5 ميغابايت.</p>

<button class="full" id="saveProfileBtn">💾 حفظ الملف الشخصي</button>
<p id="profileMessage"></p>
</div>

<div class="card">
<h2 id="welcomeTitle">أهلاً بك في DERT</h2>
<p id="userEmail" class="small"></p>
<button class="danger full" id="logoutBtn">تسجيل الخروج</button>
</div>

<div class="card">
<h3>📝 إنشاء منشور جديد</h3>
<textarea id="postContent" placeholder="بماذا تفكر؟"></textarea>
<label>اختر صورة من هاتفك:</label>
<input id="postImage" type="file" accept="image/*">
<button class="full" id="publishBtn">نشر المنشور</button>
<p id="postMessage"></p>
</div>

<h2>🌍 المنشورات</h2>
<div id="postsList">جارٍ تحميل المنشورات...</div>

</section>
</div>

<script>
const SUPABASE_URL = "https://forwefmjghgcybiccdxz.supabase.co";
const SUPABASE_KEY = "sb_publishable_xsXMr3yr2yJXOgRn9ZjMtQ_sfoS0OIR";

const client = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let previewUrl = null;

const el = id => document.getElementById(id);

function showLogin(){
  el("auth").style.display = "block";
  el("home").style.display = "none";
  currentUser = null;
  currentProfile = null;
}

function showAvatar(url,name){
  const box = el("avatarDisplay");
  box.replaceChildren();

  if(url){
    const img = document.createElement("img");
    img.src = url;
    img.alt = "الصورة الشخصية";
    img.className = "avatar";
    img.onerror = () => {
      box.textContent = (name || "D").charAt(0).toUpperCase();
      box.className = "avatar";
    };
    box.className = "";
    box.appendChild(img);
  }else{
    box.className = "avatar";
    box.textContent = (name || "D").charAt(0).toUpperCase();
  }
}

function makeUsername(email,id){
  let base = (email || "user").split("@")[0]
    .toLowerCase().replace(/[^a-z0-9_]/g,"");

  if(!base) base = "user";
  return base + "_" + id.replace(/-/g,"").slice(0,6);
}

/* معاينة الصورة المختارة */
el("avatarFile").addEventListener("change",function(){
  const file = this.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    el("profileMessage").textContent = "الملف يجب أن يكون صورة.";
    this.value = "";
    return;
  }

  if(file.size > 5 * 1024 * 1024){
    el("profileMessage").textContent = "حجم الصورة يجب ألا يتجاوز 5 ميغابايت.";
    this.value = "";
    return;
  }

  if(previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(file);

  showAvatar(previewUrl,el("fullName").value || "D");
  el("profileMessage").textContent = "تم اختيار الصورة. اضغط حفظ الملف الشخصي.";
});

async function loadProfile(){
  if(!currentUser) return;

  el("profileMessage").textContent = "جارٍ تحميل الملف الشخصي...";

  try{
    let {data,error} = await client
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

    if(error) throw error;

    if(!data){
      const newProfile = {
        id:currentUser.id,
        username:makeUsername(currentUser.email,currentUser.id),
        full_name:""
      };

      const result = await client
        .from("profiles")
        .insert(newProfile);

      if(result.error && result.error.code !== "23505"){
        throw result.error;
      }

      const reload = await client
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();

      if(reload.error) throw reload.error;
      data = reload.data;
    }

    if(!data){
      throw new Error("تعذر العثور على بيانات الملف الشخصي");
    }

    currentProfile = data;

    el("displayName").textContent = data.full_name || "مستخدم DERT";
    el("displayUsername").textContent = "@" + (data.username || "user");

    el("fullName").value = data.full_name || "";
    el("username").value = data.username || "";
    el("bio").value = data.bio || "";
    el("avatarFile").value = "";

    if(previewUrl){
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    showAvatar(data.avatar_url,data.full_name || data.username);
    el("profileMessage").textContent = "";

  }catch(error){
    el("profileMessage").textContent = "خطأ في الملف الشخصي: " + error.message;
  }
}

/* حفظ الملف الشخصي ورفع الصورة */
el("saveProfileBtn").onclick = async function(){
  if(!currentUser) return;

  const fullName = el("fullName").value.trim();
  const username = el("username").value.trim().toLowerCase();
  const bio = el("bio").value.trim();
  const file = el("avatarFile").files[0];

  if(!/^[a-z0-9_]{3,25}$/.test(username)){
    el("profileMessage").textContent =
      "اسم المستخدم يجب أن يكون 3 إلى 25 حرفاً إنجليزياً أو رقماً أو _";
    return;
  }

  if(file && !file.type.startsWith("image/")){
    el("profileMessage").textContent = "الملف يجب أن يكون صورة.";
    return;
  }

  if(file && file.size > 5 * 1024 * 1024){
    el("profileMessage").textContent = "حجم الصورة يجب ألا يتجاوز 5 ميغابايت.";
    return;
  }

  const button = el("saveProfileBtn");
  button.disabled = true;
  button.textContent = "جارٍ الحفظ...";

  try{
    let avatarUrl = currentProfile?.avatar_url || null;

    if(file){
      el("profileMessage").textContent = "جارٍ رفع الصورة...";

      const extensionMap = {
        "image/jpeg":"jpg",
        "image/png":"png",
        "image/webp":"webp"
      };

      const extension = extensionMap[file.type];

      if(!extension){
        throw new Error("اختر صورة بصيغة JPG أو PNG أو WEBP.");
      }

      const path = currentUser.id + "/profile/" +
        crypto.randomUUID() + "." + extension;

      const {error:uploadError} = await client.storage
        .from("posts")
        .upload(path,file,{
          contentType:file.type,
          upsert:false
        });

      if(uploadError) throw uploadError;

      const {data:urlData} = client.storage
        .from("posts")
        .getPublicUrl(path);

      avatarUrl = urlData.publicUrl;
    }

    el("profileMessage").textContent = "جارٍ حفظ البيانات...";

    const {data,error} = await client
      .from("profiles")
      .update({
        full_name:fullName,
        username:username,
        bio:bio,
        avatar_url:avatarUrl
      })
      .eq("id",currentUser.id)
      .select()
      .single();

    if(error) throw error;

    currentProfile = data;

    el("displayName").textContent = data.full_name || "مستخدم DERT";
    el("displayUsername").textContent = "@" + data.username;

    showAvatar(data.avatar_url,data.full_name || data.username);

    el("avatarFile").value = "";

    if(previewUrl){
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    el("profileMessage").textContent = "تم حفظ التغييرات والصورة بنجاح ❤️";

  }catch(error){
    el("profileMessage").textContent = "تعذر الحفظ: " + error.message;
  }finally{
    button.disabled = false;
    button.textContent = "💾 حفظ الملف الشخصي";
  }
};

async function showHome(user){
  if(!user) return;

  currentUser = user;
  el("auth").style.display = "none";
  el("home").style.display = "block";
  el("userEmail").textContent = user.email || "";

  await loadProfile();
  await loadPosts();
}

el("signupBtn").onclick = async function(){
  const email = el("email").value.trim();
  const password = el("password").value;

  if(!email || !password){
    el("message").textContent = "أدخل البريد وكلمة المرور";
    return;
  }

  if(password.length < 6){
    el("message").textContent = "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
    return;
  }

  el("message").textContent = "جارٍ إنشاء الحساب...";

  const {data,error} = await client.auth.signUp({email,password});

  if(error){
    el("message").textContent = error.message;
    return;
  }

  if(data.session){
    await showHome(data.user);
  }else{
    el("message").textContent =
      "تم إنشاء الحساب. افحص بريدك لتأكيد الحساب ثم سجّل الدخول.";
  }
};

el("loginBtn").onclick = async function(){
  const email = el("email").value.trim();
  const password = el("password").value;

  if(!email || !password){
    el("message").textContent = "أدخل البريد وكلمة المرور";
    return;
  }

  el("message").textContent = "جارٍ تسجيل الدخول...";

  const {data,error} = await client.auth.signInWithPassword({
    email,password
  });

  if(error){
    el("message").textContent = "خطأ: " + error.message;
    return;
  }

  await showHome(data.user);
  el("message").textContent = "";
};

el("logoutBtn").onclick = async function(){
  const {error} = await client.auth.signOut();

  if(error){
    el("message").textContent = error.message;
    return;
  }

  showLogin();
};

el("publishBtn").onclick = async function(){
  if(!currentUser){
    el("postMessage").textContent = "سجّل الدخول أولاً";
    return;
  }

  const content = el("postContent").value.trim();
  const file = el("postImage").files[0];

  if(!content && !file){
    el("postMessage").textContent = "اكتب منشوراً أو اختر صورة";
    return;
  }

  if(file && !file.type.startsWith("image/")){
    el("postMessage").textContent = "الملف يجب أن يكون صورة";
    return;
  }

  if(file && file.size > 5 * 1024 * 1024){
    el("postMessage").textContent = "حجم الصورة يجب ألا يتجاوز 5 ميغابايت";
    return;
  }

  const button = el("publishBtn");
  button.disabled = true;
  button.textContent = "جارٍ النشر...";

  try{
    let imageUrl = null;

    if(file){
      const extension = file.name.split(".").pop().toLowerCase();
      const path = currentUser.id + "/" + crypto.randomUUID() + "." + extension;

      const {error:uploadError} = await client.storage
        .from("posts")
        .upload(path,file,{contentType:file.type,upsert:false});

      if(uploadError) throw uploadError;

      const {data:urlData} = client.storage
        .from("posts")
        .getPublicUrl(path);

      imageUrl = urlData.publicUrl;
    }

    const {error} = await client.from("posts").insert({
      user_id:currentUser.id,
      content:content || null,
      image_url:imageUrl
    });

    if(error) throw error;

    el("postContent").value = "";
    el("postImage").value = "";
    el("postMessage").textContent = "تم نشر المنشور بنجاح ❤️";

    await loadPosts();

  }catch(error){
    el("postMessage").textContent = "تعذر النشر: " + error.message;
  }finally{
    button.disabled = false;
    button.textContent = "نشر المنشور";
  }
};

async function loadPosts(){
  const list = el("postsList");
  list.textContent = "جارٍ تحميل المنشورات...";

  const {data,error} = await client
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    list.textContent = "تعذر تحميل المنشورات: " + error.message;
    return;
  }

  list.replaceChildren();

  if(!data || data.length === 0){
    list.textContent = "لا توجد منشورات حتى الآن.";
    el("postsCount").textContent = "0";
    return;
  }

  el("postsCount").textContent =
    data.filter(p => p.user_id === currentUser.id).length;

  data.forEach(post => {
    const card = document.createElement("article");
    card.className = "post";

    const author = document.createElement("strong");

    if(post.user_id === currentUser.id){
      author.textContent = "@" + (currentProfile?.username || "أنت");
    }else{
      author.textContent = "مستخدم DERT";
    }

    card.appendChild(author);

    if(post.content){
      const text = document.createElement("p");
      text.className = "post-text";
      text.textContent = post.content;
      card.appendChild(text);
    }

    if(post.image_url){
      const img = document.createElement("img");
      img.src = post.image_url;
      img.alt = "صورة المنشور";
      img.loading = "lazy";
      card.appendChild(img);
    }

    const date = document.createElement("div");
    date.className = "post-date";
    date.textContent = new Date(post.created_at).toLocaleString("ar-IQ");
    card.appendChild(date);

    list.appendChild(card);
  });
}

client.auth.onAuthStateChange((event,session)=>{
  if(event === "SIGNED_OUT"){
    showLogin();
  }
});

async function checkSession(){
  const {data,error} = await client.auth.getSession();

  if(error){
    el("message").textContent = error.message;
    return;
  }

  if(data.session){
    await showHome(data.session.user);
  }else{
    showLogin();
  }
}

checkSession();
</script>
</body>
</html>
