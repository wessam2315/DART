<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>DERT — تيك توك</title>
  <style>
    :root {
      --bg-light: #ffffff;
      --bg-dark: #000000;
      --surface: #f4f4f6;
      --surface-dark: #161823;
      --text-light: #161823;
      --text-dark: #ffffff;
      --muted: #737685;
      --border: #ebebef;
      --tt-red: #fe2c55;
      --tt-cyan: #25f4ee;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: #111318;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Kufi Arabic", "Cairo", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100dvh;
      background: var(--bg-dark);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45);
    }

    /* الشاشة القابلة للتمرير العمودي بأسلوب تيك توك */
    .scroll-viewport {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      padding-bottom: calc(56px + var(--safe-bottom));
    }

    .scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    .scroll-viewport.light-mode {
      background: var(--bg-light);
      color: var(--text-light);
      scroll-snap-type: none;
    }

    /* بطاقة الفيديو الكاملة (For You / Following) */
    .tt-feed-item {
      position: relative;
      width: 100%;
      height: calc(100dvh - 56px - var(--safe-bottom));
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #090a0e;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .tt-media-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tt-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.45) 0%,
        rgba(0, 0, 0, 0.05) 35%,
        rgba(0, 0, 0, 0.15) 60%,
        rgba(0, 0, 0, 0.85) 100%
      );
      pointer-events: none;
    }

    /* الشريط العلوي في الرئيسية بأسلوب تيك توك */
    .tt-top-bar {
      position: absolute;
      top: calc(10px + var(--safe-top));
      left: 0;
      right: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #fff;
    }

    .tt-top-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 21px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
    }

    .tt-top-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .tt-tab-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      padding: 4px 2px;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .tt-tab-btn.active {
      color: #ffffff;
      transform: scale(1.04);
    }

    .tt-tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 15%;
      right: 15%;
      height: 3px;
      border-radius: 99px;
      background: #ffffff;
    }

    /* المحتوى السفلي والأزرار الجانبية على الفيديو */
    .tt-overlay-row {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 12px 16px 10px;
      gap: 10px;
    }

    .tt-meta-col {
      flex: 1;
      min-width: 0;
      padding-left: 8px;
    }

    .tt-author {
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tt-caption {
      font-size: 13.5px;
      line-height: 1.48;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 8px;
    }

    .tt-sound-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: #fff;
      font-weight: 600;
    }

    .tt-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      flex-shrink: 0;
    }

    .tt-avatar-wrap {
      position: relative;
      width: 48px;
      height: 48px;
      margin-bottom: 4px;
    }

    .tt-avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #fff;
      display: block;
    }

    .tt-plus-badge {
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--tt-red);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .tt-plus-badge.followed {
      background: #ffffff;
      color: var(--tt-red);
      font-size: 12px;
    }

    .tt-rail-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .tt-rail-icon {
      font-size: 29px;
      line-height: 1.1;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45));
      transition: transform 0.14s ease, color 0.14s ease;
    }

    .tt-rail-btn.active .tt-rail-icon {
      color: var(--tt-red);
      transform: scale(1.12);
    }

    .tt-rail-count {
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.65);
    }

    .tt-disc {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, #222 25%, #0a0a0a 26%, #2b2b2b 65%, #000 66%);
      border: 6px solid #1d1f26;
      display: grid;
      place-items: center;
      overflow: hidden;
      animation: spinDisc 6s linear infinite;
    }

    .tt-disc img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* شاشة الأصدقاء (Friends) */
    .light-header {
      position: sticky;
      top: 0;
      z-index: 12;
      height: 52px;
      padding: calc(var(--safe-top)) 16px 0;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-light);
    }

    .light-title {
      font-size: 17px;
      font-weight: 800;
    }

    .friend-card {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .friend-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .friend-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .btn-follow-pill {
      background: var(--tt-red);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-follow-pill.muted-pill {
      background: var(--surface);
      color: var(--text-light);
    }

    /* صندوق الوارد (Inbox) بأسلوب تيك توك */
    .stories-row {
      display: flex;
      gap: 14px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .stories-row::-webkit-scrollbar { display: none; }

    .story-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 62px;
      font-size: 11.5px;
      cursor: pointer;
    }

    .story-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid #00c48c;
      padding: 2px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .story-circle img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .story-create-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #25f4ee;
      color: #000;
      font-size: 14px;
      font-weight: 900;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
    }

    .inbox-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .inbox-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .inbox-icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      color: #fff;
      flex-shrink: 0;
    }

    .red-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--tt-red);
      display: inline-block;
    }

    /* الملف الشخصي (Profile) بأسلوب تيك توك */
    .profile-top {
      padding: calc(12px + var(--safe-top)) 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .profile-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .profile-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .profile-pic {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 800;
    }

    .profile-handle {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .profile-metrics {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 14px 0;
    }

    .metric-val {
      font-size: 16.5px;
      font-weight: 800;
    }

    .metric-lbl {
      font-size: 12px;
      color: var(--muted);
    }

    .profile-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .p-btn {
      border: none;
      background: var(--surface);
      color: var(--text-light);
      font-size: 13.5px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .p-btn.primary {
      background: var(--tt-red);
      color: #fff;
    }

    .profile-bio {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-light);
      white-space: pre-line;
      text-align: center;
    }

    .profile-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .p-tab {
      background: none;
      border: none;
      padding: 12px 0;
      font-size: 16px;
      color: var(--muted);
      cursor: pointer;
      position: relative;
    }

    .p-tab.active {
      color: var(--text-light);
      font-weight: 800;
    }

    .p-tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 25%;
      right: 25%;
      height: 2.5px;
      background: var(--text-light);
    }

    .video-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding-top: 2px;
    }

    .v-tile {
      aspect-ratio: 3 / 4;
      position: relative;
      background: #1c1e26;
      cursor: pointer;
      overflow: hidden;
    }

    .v-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .v-plays {
      position: absolute;
      bottom: 5px;
      right: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* الشريط السفلي بأسلوب تيك توك */
    .tt-bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 450px;
      height: calc(56px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--bg-dark);
      color: #fff;
      border-top: 1px solid rgba(255,255,255,0.12);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 25;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .tt-bottom-nav.light-nav {
      background: #ffffff;
      color: var(--text-light);
      border-top-color: var(--border);
    }

    .tt-nav-btn {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    .tt-nav-btn.active {
      opacity: 1;
      font-weight: 800;
    }

    .tt-create-box {
      position: relative;
      width: 44px;
      height: 28px;
      border-radius: 8px;
      background: #fff;
      color: #000;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 900;
      box-shadow: -3px 0 0 var(--tt-cyan), 3px 0 0 var(--tt-red);
    }

    .tt-bottom-nav.light-nav .tt-create-box {
      background: #161823;
      color: #fff;
    }

    .nav-badge-num {
      position: absolute;
      top: -3px;
      left: 22%;
      background: var(--tt-red);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
    }

    /* القائمة الجانبية والنافذة السفلية */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: flex-start;
      align-items: stretch;
      z-index: 50;
    }

    .drawer-overlay.open {
      display: flex;
    }

    .side-drawer {
      width: 82%;
      max-width: 340px;
      background: #fff;
      color: var(--text-light);
      height: 100%;
      padding-top: calc(14px + var(--safe-top));
      padding-bottom: calc(16px + var(--safe-bottom));
      overflow-y: auto;
    }

    .drawer-group-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      padding: 14px 18px 6px;
    }

    .drawer-row {
      width: 100%;
      border: none;
      background: #fff;
      color: var(--text-light);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: right;
    }

    .drawer-row:hover {
      background: var(--surface);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 60;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 450px;
      max-height: 85dvh;
      background: #fff;
      color: var(--text-light);
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-top {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
    }

    .modal-content {
      padding: 16px;
      overflow-y: auto;
    }

    .m-input {
      width: 100%;
      border: 1px solid #d5d8e0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-top: 8px;
      font-family: inherit;
    }

    .m-btn {
      width: 100%;
      background: var(--tt-red);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    .gw-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .gw-opt {
      border: 1px solid #d5d8e0;
      background: #fff;
      border-radius: 9px;
      padding: 9px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .gw-opt.active {
      border-color: var(--tt-red);
      background: #fff0f3;
      color: var(--tt-red);
    }

    .toast {
      position: fixed;
      bottom: calc(68px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 24, 35, 0.92);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 80;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="scroll-viewport" id="viewport"></div>

    <nav class="tt-bottom-nav" id="bottomNav">
      <button class="tt-nav-btn active" data-nav="home" type="button">
        <span>🏠</span>
        <span>الصفحة الرئيسية</span>
      </button>
      <button class="tt-nav-btn" data-nav="friends" type="button">
        <span>👥</span>
        <span>الأصدقاء</span>
      </button>
      <button class="tt-nav-btn" id="createPostBtn" type="button">
        <span class="tt-create-box">+</span>
      </button>
      <button class="tt-nav-btn" data-nav="inbox" type="button">
        <span class="nav-badge-num" id="inboxBadge">5</span>
        <span>💬</span>
        <span>صندوق الوارد</span>
      </button>
      <button class="tt-nav-btn" data-nav="profile" type="button">
        <span>👤</span>
        <span>الملف الشخصي</span>
      </button>
    </nav>
  </div>

  <!-- قائمة الاختصارات الجانبية (مثل الصورة الأولى) -->
  <div class="drawer-overlay" id="drawerOverlay">
    <aside class="side-drawer" id="sideDrawer">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0 18px 8px;">
        <strong>الاختصارات</strong>
        <button class="tt-top-btn" style="color:#161823;" id="closeDrawerBtn" type="button">✕</button>
      </div>

      <div class="drawer-group-title">الأصول</div>
      <button class="drawer-row" onclick="openWalletModal()" type="button">
        <span>💳 الرصيد</span>
        <span id="drawerCoinsTxt">500 عملة ‹</span>
      </button>

      <div class="drawer-group-title">الأدوات الشخصية</div>
      <button class="drawer-row" onclick="toast('مركز الأنشطة')" type="button"><span>🕒 مركز الأنشطة</span><span>‹</span></button>
      <button class="drawer-row" onclick="addOfflineVideo()" type="button"><span>☁️ فيديوهات دون اتصال بالإنترنت</span><span id="drawerOfflineTxt">3 ‹</span></button>
      <button class="drawer-row" onclick="toast('رمز QR الخاص بك')" type="button"><span>🔳 رمز QR لديك</span><span>‹</span></button>
      <button class="drawer-row" onclick="toast('DERT Minis')" type="button"><span>🧊 DERT Minis</span><span>‹</span></button>

      <div class="drawer-group-title">أدوات الإبداع والأعمال</div>
      <button class="drawer-row" onclick="toast('المجموعة التجارية')" type="button"><span>🛍️ المجموعة التجارية</span><span>‹</span></button>
      <button class="drawer-row" onclick="toast('DERT Studio')" type="button"><span>👤✨ DERT Studio</span><span>‹</span></button>
      <button class="drawer-row" onclick="addPromoCampaign()" type="button"><span>🔥 الترويج</span><span id="drawerPromoTxt">1 نشط ‹</span></button>

      <div class="drawer-group-title">الإعدادات والخصوصية</div>
      <button class="drawer-row" onclick="togglePrivateAccount()" type="button"><span>⚙️ الإعدادات والخصوصية</span><span id="drawerPrivTxt">عام ‹</span></button>
    </aside>
  </div>

  <!-- نافذة منبثقة للتعليقات / الرصيد / النشر -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-top">
        <span id="modalTitle"></span>
        <button class="tt-top-btn" style="color:#161823;" id="closeModalBtn" type="button">✕</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "dert_tiktok_style_v1";

    const initialState = {
      nav: "home",
      homeTab: "foryou",
      profileTab: "videos",
      profile: {
        name: "وسام | wessam",
        handle: "@w20xw",
        bio: "الرمادي\nأصنع لنفسك تاريخ و أجعل غيرك يتعلمة 🦅.\nDERT Creator",
        avatar: "https://picsum.photos/200/200?random=101",
        following: 85,
        followers: 14900,
        likes: 82900,
        coins: 500,
        grossCoins: 1000,
        gateway: "زين كاش",
        offlineCount: 3,
        promoCount: 1,
        privateAcc: false
      },
      videos: [
        {
          id: "v1",
          author: "وسام | wessam",
          handle: "@w20xw",
          avatar: "https://picsum.photos/200/200?random=101",
          media: "https://picsum.photos/480/850?random=201",
          caption: "محتوى جديد على DERT 🔥 #تيك_توك #DERT",
          sound: "الصوت الأصلي - w20xw",
          plays: "12.4K",
          likes: 3256,
          liked: false,
          saved: false,
          following: true,
          comments: ["رهيب جداً 👏", "استمر يا بطل"]
        },
        {
          id: "v2",
          author: "علي رشيد",
          handle: "@ali_rasheed",
          avatar: "https://picsum.photos/200/200?random=102",
          media: "https://picsum.photos/480/850?random=202",
          caption: "لقطات سريعة ومقاطع يومية ✨ #محتوى",
          sound: "موسيقى ترند - DERT",
          plays: "4226",
          likes: 890,
          liked: false,
          saved: true,
          following: false,
          comments: ["فيديو جميل"]
        },
        {
          id: "v3",
          author: "عبدالله آل فهد",
          handle: "@abdullah_f",
          avatar: "https://picsum.photos/200/200?random=103",
          media: "https://picsum.photos/480/850?random=203",
          caption: "بث مباشر وتفاعل مستمر على DERT",
          sound: "بث مباشر - DERT Live",
          plays: "19.8K",
          likes: 2140,
          liked: true,
          saved: false,
          following: true,
          comments: ["متابعينك 🔥"]
        }
      ],
      inbox: [
        { id: "i1", title: "النشاط والمتابعون الجدد", sub: "أعجب بالمقطع الخاص بك", time: "الآن", color: "#fe2c55", dot: true },
        { id: "i2", title: "علي رشيد", sub: "شارك فيديو • منذ 3 س", time: "3 س", color: "#161823", avatar: "https://picsum.photos/100/100?random=102", dot: true },
        { id: "i3", title: "إشعارات النظام", sub: "تم تفعيل المحفظة وتقسيم الأرباح 60% / 40%", time: "1 ي", color: "#0095f6", dot: false }
      ]
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || JSON.parse(JSON.stringify(initialState));

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      syncDrawerLabels();
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }

    function syncDrawerLabels() {
      document.getElementById("drawerCoinsTxt").textContent = `${state.profile.coins} عملة ‹`;
      document.getElementById("drawerOfflineTxt").textContent = `${state.profile.offlineCount} ‹`;
      document.getElementById("drawerPromoTxt").textContent = `${state.profile.promoCount} نشط ‹`;
      document.getElementById("drawerPrivTxt").textContent = `${state.profile.privateAcc ? "خاص" : "عام"} ‹`;
      const unread = state.inbox.filter(x => x.dot).length;
      const badge = document.getElementById("inboxBadge");
      badge.textContent = unread;
      badge.style.display = unread ? "inline-block" : "none";
    }

    function render() {
      const vp = document.getElementById("viewport");
      const bNav = document.getElementById("bottomNav");

      document.querySelectorAll(".tt-nav-btn[data-nav]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.nav === state.nav);
      });

      const isDark = state.nav === "home";
      bNav.classList.toggle("light-nav", !isDark);
      vp.classList.toggle("light-mode", !isDark);

      if (state.nav === "home") {
        const list = state.homeTab === "following" ? state.videos.filter(v => v.following) : state.videos;
        const items = list.length ? list : state.videos;

        vp.innerHTML = `
          <div class="tt-top-bar">
            <button class="tt-top-btn" onclick="openDrawer()" type="button">☰</button>
            <div class="tt-top-tabs">
              <button class="tt-tab-btn ${state.homeTab === "following" ? "active" : ""}" onclick="setHomeTab('following')" type="button">أتابعه</button>
              <button class="tt-tab-btn ${state.homeTab === "foryou" ? "active" : ""}" onclick="setHomeTab('foryou')" type="button">لك</button>
            </div>
            <button class="tt-top-btn" onclick="openSearchModal()" type="button">🔍</button>
          </div>
          ${items.map(v => `
            <section class="tt-feed-item">
              <img class="tt-media-bg" src="${esc(v.media)}" alt="" />
              <div class="tt-scrim"></div>
              <div class="tt-overlay-row">
                <div class="tt-meta-col">
                  <div class="tt-author">${esc(v.handle)}</div>
                  <div class="tt-caption">${esc(v.caption)}</div>
                  <div class="tt-sound-line"><span>🎵</span><span>${esc(v.sound)}</span></div>
                </div>
                <div class="tt-rail">
                  <div class="tt-avatar-wrap">
                    <img class="tt-avatar-img" src="${esc(v.avatar)}" alt="" />
                    <button class="tt-plus-badge ${v.following ? "followed" : ""}" onclick="toggleFollow('${v.id}')" type="button">
                      ${v.following ? "✓" : "+"}
                    </button>
                  </div>
                  <button class="tt-rail-btn ${v.liked ? "active" : ""}" onclick="toggleLike('${v.id}')" type="button">
                    <span class="tt-rail-icon">♥</span>
                    <span class="tt-rail-count">${v.likes}</span>
                  </button>
                  <button class="tt-rail-btn" onclick="openComments('${v.id}')" type="button">
                    <span class="tt-rail-icon">💬</span>
                    <span class="tt-rail-count">${v.comments.length}</span>
                  </button>
                  <button class="tt-rail-btn ${v.saved ? "active" : ""}" onclick="toggleSave('${v.id}')" type="button">
                    <span class="tt-rail-icon">🔖</span>
                    <span class="tt-rail-count">حفظ</span>
                  </button>
                  <button class="tt-rail-btn" onclick="toast('تم نسخ رابط المقطع')" type="button">
                    <span class="tt-rail-icon">↪</span>
                    <span class="tt-rail-count">مشاركة</span>
                  </button>
                  <div class="tt-disc"><img src="${esc(v.avatar)}" alt="" /></div>
                </div>
              </div>
            </section>
          `).join("")}
        `;
      } else if (state.nav === "friends") {
        vp.innerHTML = `
          <div class="light-header">
            <span class="light-title">الأصدقاء</span>
            <button class="tt-top-btn" style="color:#161823;" onclick="openSearchModal()" type="button">🔍</button>
          </div>
          ${state.videos.map(v => `
            <div class="friend-card">
              <div class="friend-left">
                <img class="friend-avatar" src="${esc(v.avatar)}" alt="" />
                <div>
                  <div style="font-weight:700;font-size:14.5px;">${esc(v.author)}</div>
                  <div style="font-size:12px;color:var(--muted);">${esc(v.handle)}</div>
                </div>
              </div>
              <button class="btn-follow-pill ${v.following ? "muted-pill" : ""}" onclick="toggleFollow('${v.id}')" type="button">
                ${v.following ? "متابَع" : "متابعة"}
              </button>
            </div>
          `).join("")}
        `;
      } else if (state.nav === "inbox") {
        vp.innerHTML = `
          <div class="light-header">
            <span class="light-title">صندوق الوارد</span>
            <button class="tt-top-btn" style="color:#161823;" onclick="openDrawer()" type="button">☰</button>
          </div>
          <div class="stories-row">
            <div class="story-bubble" onclick="openCreateModal()">
              <div class="story-circle">
                <img src="${esc(state.profile.avatar)}" alt="" />
                <span class="story-create-badge">+</span>
              </div>
              <span>إنشاء</span>
            </div>
            ${state.videos.map(v => `
              <div class="story-bubble" onclick="toast('حالة ${esc(v.author)}')">
                <div class="story-circle"><img src="${esc(v.avatar)}" alt="" /></div>
                <span>${esc(v.author.split(" ")[0])}</span>
              </div>
            `).join("")}
          </div>
          ${state.inbox.map(item => `
            <div class="inbox-item" onclick="openInboxItem('${item.id}')">
              <div class="inbox-left">
                ${item.avatar
                  ? `<img class="friend-avatar" src="${esc(item.avatar)}" alt="" />`
                  : `<div class="inbox-icon-circle" style="background:${item.color};">${item.id === "i1" ? "⚡" : "💳"}</div>`
                }
                <div>
                  <div style="font-weight:700;font-size:14.5px;">${esc(item.title)}</div>
                  <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${esc(item.sub)}</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);">
                <span>${esc(item.time)}</span>
                ${item.dot ? `<span class="red-dot"></span>` : ""}
              </div>
            </div>
          `).join("")}
        `;
      } else if (state.nav === "profile") {
        const gridList = state.profileTab === "saved" ? state.videos.filter(v => v.saved) : state.videos;
        vp.innerHTML = `
          <div class="profile-top">
            <div class="profile-header-bar">
              <button class="tt-top-btn" style="color:#161823;" onclick="openDrawer()" type="button">☰</button>
              <strong>${esc(state.profile.name)}</strong>
              <button class="tt-top-btn" style="color:#161823;" onclick="openWalletModal()" type="button">💳</button>
            </div>
            <div class="profile-center">
              <img class="profile-pic" src="${esc(state.profile.avatar)}" alt="" />
              <div class="profile-name">${esc(state.profile.name)}</div>
              <div class="profile-handle">${esc(state.profile.handle)}</div>
              <div class="profile-metrics">
                <div><div class="metric-val">${state.profile.following}</div><div class="metric-lbl">أتابعه</div></div>
                <div><div class="metric-val">${(state.profile.followers / 1000).toFixed(1)} ألف</div><div class="metric-lbl">متابعون</div></div>
                <div><div class="metric-val">${(state.profile.likes / 1000).toFixed(1)} ألف</div><div class="metric-lbl">تسجيلات الإعجاب</div></div>
              </div>
              <div class="profile-btns">
                <button class="p-btn" onclick="openEditProfileModal()" type="button">تعديل الملف الشخصي</button>
                <button class="p-btn primary" onclick="openWalletModal()" type="button">الرصيد (${state.profile.coins})</button>
              </div>
              <div class="profile-bio">${esc(state.profile.bio)}</div>
            </div>
          </div>
          <div class="profile-tabs">
            <button class="p-tab ${state.profileTab === "videos" ? "active" : ""}" onclick="setProfileTab('videos')" type="button">⋮⋮⋮</button>
            <button class="p-tab ${state.profileTab === "saved" ? "active" : ""}" onclick="setProfileTab('saved')" type="button">🔖</button>
            <button class="p-tab ${state.profileTab === "liked" ? "active" : ""}" onclick="setProfileTab('liked')" type="button">♥</button>
          </div>
          <div class="video-grid-3">
            ${(gridList.length ? gridList : state.videos).map(v => `
              <div class="v-tile" onclick="openComments('${v.id}')">
                <img src="${esc(v.media)}" alt="" />
                <span class="v-plays">▷ ${esc(v.plays)}</span>
              </div>
            `).join("")}
          </div>
        `;
      }

      syncDrawerLabels();
    }

    function setHomeTab(t) { state.homeTab = t; save(); render(); }
    function setProfileTab(t) { state.profileTab = t; save(); render(); }

    function toggleLike(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.liked = !v.liked;
      v.likes += v.liked ? 1 : -1;
      state.profile.likes += v.liked ? 1 : -1;
      save(); render();
    }

    function toggleSave(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.saved = !v.saved;
      save(); render();
      toast(v.saved ? "تم الحفظ" : "تمت الإزالة من المحفوظات");
    }

    function toggleFollow(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.following = !v.following;
      state.profile.following += v.following ? 1 : -1;
      save(); render();
      toast(v.following ? "تمت المتابعة" : "تم إلغاء المتابعة");
    }

    function openDrawer() { document.getElementById("drawerOverlay").classList.add("open"); }
    function closeDrawer() { document.getElementById("drawerOverlay").classList.remove("open"); }

    function openModal(title, html) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalContent").innerHTML = html;
      document.getElementById("modalOverlay").classList.add("open");
    }

    function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }

    function openComments(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      openModal(`التعليقات (${v.comments.length})`, `
        <div>${v.comments.map(c => `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;">${esc(c)}</div>`).join("")}</div>
        <input class="m-input" id="cInp" placeholder="أضف تعليقاً..." />
        <button class="m-btn" onclick="submitComment('${id}')" type="button">نشر التعليق</button>
      `);
    }

    function submitComment(id) {
      const val = document.getElementById("cInp").value.trim();
      if (!val) return;
      const v = state.videos.find(x => x.id === id);
      v.comments.push(val);
      save(); render(); openComments(id);
    }

    function openWalletModal() {
      closeDrawer();
      const gws = ["زين كاش", "سوبر كي", "زين العراق", "آسياسيل"];
      const mShare = Math.round(state.profile.grossCoins * 0.6);
      const pShare = Math.round(state.profile.grossCoins * 0.4);
      openModal("الرصيد", `
        <div style="font-size:24px;font-weight:800;">${state.profile.coins} عملة</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:4px;">حصة المذيع (60%): ${mShare} • حصة المنصة (40%): ${pShare}</div>
        <div class="gw-row">
          ${gws.map(g => `<button class="gw-opt ${state.profile.gateway === g ? "active" : ""}" onclick="pickGateway('${g}')" type="button">${g}</button>`).join("")}
        </div>
        <button class="m-btn" onclick="topupWallet()" type="button">+ شحن 200 عملة (${esc(state.profile.gateway)})</button>
      `);
    }

    function pickGateway(g) { state.profile.gateway = g; save(); openWalletModal(); }
    function topupWallet() {
      state.profile.coins += 200;
      state.profile.grossCoins += 200;
      save(); render(); openWalletModal(); toast("تم شحن 200 عملة");
    }

    function addOfflineVideo() { state.profile.offlineCount += 1; save(); toast("تم حفظ فيديو دون اتصال"); }
    function addPromoCampaign() { state.profile.promoCount += 1; save(); toast("تمت إضافة حملة ترويج"); }
    function togglePrivateAccount() { state.profile.privateAcc = !state.profile.privateAcc; save(); toast("تم تحديث الخصوصية"); }

    function openEditProfileModal() {
      openModal("تعديل الملف الشخصي", `
        <input class="m-input" id="eName" value="${esc(state.profile.name)}" placeholder="الاسم" />
        <input class="m-input" id="eHandle" value="${esc(state.profile.handle)}" placeholder="@username" />
        <textarea class="m-input" id="eBio" rows="3" placeholder="النبذة التعريفية">${esc(state.profile.bio)}</textarea>
        <button class="m-btn" onclick="saveProfileEdits()" type="button">حفظ</button>
      `);
    }

    function saveProfileEdits() {
      state.profile.name = document.getElementById("eName").value.trim() || state.profile.name;
      const h = document.getElementById("eHandle").value.trim();
      if (h) state.profile.handle = h.startsWith("@") ? h : "@" + h;
      state.profile.bio = document.getElementById("eBio").value;
      save(); render(); closeModal(); toast("تم الحفظ");
    }

    function openInboxItem(id) {
      const item = state.inbox.find(x => x.id === id);
      if (!item) return;
      item.dot = false;
      save(); render();
      openModal(item.title, `
        <p style="font-size:14px;line-height:1.6;">${esc(item.sub)}</p>
        <input class="m-input" id="rInp" placeholder="اكتب رداً..." />
        <button class="m-btn" onclick="replyInbox('${id}')" type="button">إرسال</button>
      `);
    }

    function replyInbox(id) {
      const val = document.getElementById("rInp").value.trim();
      if (!val) return;
      const item = state.inbox.find(x => x.id === id);
      item.sub = val;
      item.time = "الآن";
      save(); render(); openInboxItem(id);
    }

    function openSearchModal() {
      openModal("بحث", `
        <input class="m-input" id="sInp" placeholder="ابحث عن حساب أو هاشتاغ..." oninput="filterSearchResults(this.value)" />
        <div id="sRes" style="margin-top:12px;"></div>
      `);
      filterSearchResults("");
    }

    function filterSearchResults(q) {
      const term = q.trim().toLowerCase();
      const res = state.videos.filter(v => !term || v.author.toLowerCase().includes(term) || v.caption.toLowerCase().includes(term));
      document.getElementById("sRes").innerHTML = res.map(v => `
        <div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;cursor:pointer;" onclick="closeModal();openComments('${v.id}')">
          <strong>${esc(v.author)}</strong> — ${esc(v.caption)}
        </div>
      `).join("");
    }

    function openCreateModal() {
      openModal("نشر فيديو جديد", `
        <input class="m-input" id="vCap" placeholder="اكتب وصف المقطع والهاشتاغات..." />
        <button class="m-btn" onclick="publishVideo()" type="button">نشر الآن</button>
      `);
    }

    function publishVideo() {
      const cap = document.getElementById("vCap").value.trim() || "مقطع جديد على DERT 🔥";
      const rnd = Math.floor(210 + Math.random() * 70);
      state.videos.unshift({
        id: "v_" + Date.now(),
        author: state.profile.name,
        handle: state.profile.handle,
        avatar: state.profile.avatar,
        media: `https://picsum.photos/480/850?random=${rnd}`,
        caption: cap,
        sound: "الصوت الأصلي - " + state.profile.handle,
        plays: "1",
        likes: 0,
        liked: false,
        saved: false,
        following: true,
        comments: []
      });
      save(); closeModal(); state.nav = "home"; state.homeTab = "foryou"; render(); toast("تم نشر المقطع");
    }

    document.querySelectorAll(".tt-nav-btn[data-nav]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.nav = btn.dataset.nav;
        save();
        render();
      });
    });

    document.getElementById("createPostBtn").addEventListener("click", openCreateModal);
    document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
    document.getElementById("drawerOverlay").addEventListener("click", e => {
      if (e.target.id === "drawerOverlay") closeDrawer();
    });
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", e => {
      if (e.target.id === "modalOverlay") closeModal();
    });

    render();
  </script>
</body>
</html>
