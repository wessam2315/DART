<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>DERT</title>
  <style>
    :root {
      --bg-dark: #000000;
      --bg-light: #ffffff;
      --surface: #f1f1f2;
      --surface-2: #e7e8ed;
      --text-dark: #161823;
      --text-muted: #737685;
      --border: #ededf0;
      --tt-red: #fe2c55;
      --tt-cyan: #25f4ee;
      --tt-yellow: #face15;
      --green: #0f9d58;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text;
      font-family: inherit;
    }

    html, body {
      height: 100%;
      background: #08080a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Kufi Arabic", "Cairo", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-viewport {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      padding-bottom: calc(58px + var(--safe-bottom));
      background: #000;
    }

    .main-viewport::-webkit-scrollbar {
      display: none;
    }

    .main-viewport.light-mode {
      background: var(--bg-light);
      color: var(--text-dark);
      scroll-snap-type: none;
    }

    /* الصفحة الرئيسية للفيديوهات */
    .tt-slide {
      position: relative;
      width: 100%;
      height: calc(100dvh - 58px - var(--safe-bottom));
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #050507;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .tt-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050507;
    }

    .tt-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.52) 0%,
        rgba(0, 0, 0, 0.04) 26%,
        rgba(0, 0, 0, 0.04) 60%,
        rgba(0, 0, 0, 0.88) 100%
      );
      pointer-events: none;
    }

    .pause-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.48);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease;
      z-index: 8;
    }

    .tt-slide.paused .pause-mark {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .seek-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.22);
      z-index: 12;
    }

    .seek-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
    }

    .heart-pop {
      position: absolute;
      font-size: 82px;
      color: var(--tt-red);
      pointer-events: none;
      z-index: 25;
      transform: translate(-50%, -50%) scale(0);
      animation: heartBurst 0.72s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes heartBurst {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-14deg); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.2) rotate(8deg); opacity: 1; }
      55% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
      100% { transform: translate(-50%, -78%) scale(1.25) rotate(0deg); opacity: 0; }
    }

    .tt-top {
      position: fixed;
      top: calc(10px + var(--safe-top));
      width: 100%;
      max-width: 440px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #fff;
      pointer-events: none;
    }

    .tt-top > * { pointer-events: auto; }

    .live-btn {
      background: none;
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      cursor: pointer;
    }

    .top-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .top-tab {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.68);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      padding: 4px 2px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .top-tab.active {
      color: #ffffff;
    }

    .top-tab.active::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 99px;
      background: #ffffff;
    }

    .tt-overlay {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 12px 14px 10px;
      gap: 10px;
      pointer-events: none;
    }

    .tt-caption-col,
    .tt-action-rail { pointer-events: auto; }

    .tt-caption-col {
      flex: 1;
      min-width: 0;
      padding-left: 8px;
    }

    .tt-handle-line {
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .tt-desc-line {
      font-size: 13.5px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.96);
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .tt-sound-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .tt-action-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
    }

    .avatar-ring-box {
      position: relative;
      width: 48px;
      height: 48px;
      margin-bottom: 6px;
    }

    .avatar-ring-box img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #fff;
      display: block;
    }

    .follow-plus-btn {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: var(--tt-red);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .follow-plus-btn.followed {
      background: #fff;
      color: var(--tt-red);
      font-size: 11px;
    }

    .rail-act-btn {
      background: rgba(18, 18, 22, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      border-radius: 12px;
      padding: 6px 8px;
      min-width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .rail-act-btn.liked {
      border-color: var(--tt-red);
      background: rgba(254, 44, 85, 0.28);
      color: #ff6b86;
    }

    .rail-act-btn.saved {
      border-color: var(--tt-yellow);
      background: rgba(250, 206, 21, 0.24);
      color: var(--tt-yellow);
    }

    .rail-act-label {
      font-size: 11px;
      font-weight: 700;
    }

    .rail-act-val {
      font-size: 12px;
      font-weight: 800;
      direction: ltr;
    }

    .vinyl-spin {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #222 25%, #090909 26%, #2a2a2a 65%, #000 66%);
      border: 6px solid #1c1d24;
      display: grid;
      place-items: center;
      overflow: hidden;
      margin-top: 2px;
      animation: spinWheel 6s linear infinite;
    }

    .tt-slide.paused .vinyl-spin { animation-play-state: paused; }
    .vinyl-spin img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }

    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* نظام صندوق الوارد المطابق تماماً لنظام الصورة */
    .inbox-header {
      position: sticky;
      top: 0;
      z-index: 15;
      background: #fff;
      padding: calc(var(--safe-top) + 10px) 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .inbox-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .inbox-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-svg-btn {
      background: none;
      border: none;
      color: var(--text-dark);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 4px;
    }

    .inbox-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 18px;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
    }

    .status-pill-dot {
      background: var(--surface);
      padding: 3px 7px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .status-pill-dot i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a0a3b1;
      display: inline-block;
    }

    /* شريط الحالات / القصص الأفقية */
    .stories-strip {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 16px 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stories-strip::-webkit-scrollbar { display: none; }

    .story-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 72px;
      flex-shrink: 0;
      position: relative;
      cursor: pointer;
    }

    .how-bubble {
      position: absolute;
      top: -10px;
      background: #fff;
      border: 1px solid #e4e5ea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      z-index: 4;
      white-space: nowrap;
    }

    .story-ring {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, #25f4ee, #18c5e8);
      position: relative;
      display: grid;
      place-items: center;
    }

    .story-ring.create-ring {
      background: transparent;
      padding: 0;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid #fff;
      display: block;
    }

    .story-plus-badge {
      position: absolute;
      bottom: 1px;
      left: 1px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: #20d5ec;
      color: #fff;
      border: 2px solid #fff;
      font-size: 15px;
      font-weight: 900;
      display: grid;
      place-items: center;
      line-height: 1;
    }

    .story-name {
      margin-top: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-dark);
      max-width: 72px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* شريط الفلاتر (الرئيسي / الطلبات / غير مقروءة / تم وضع نجمة) */
    .filter-chips-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 10px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }

    .filter-chips-bar::-webkit-scrollbar { display: none; }

    .f-chip {
      border: none;
      background: var(--surface);
      color: var(--text-dark);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .f-chip.active {
      background: #e1f8fb;
      color: #0b9cb1;
    }

    /* صفوف صندوق الوارد والنشاط وإشعارات النظام والمحادثات */
    .inbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      gap: 12px;
      cursor: pointer;
      background: #fff;
    }

    .inbox-row:active {
      background: #f8f8fa;
    }

    .inbox-row-main {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .sys-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: #fff;
    }

    .sys-circle.activity {
      background: #ff2c55;
    }

    .sys-circle.system {
      background: #161823;
    }

    .chat-av-wrap {
      position: relative;
      width: 54px;
      height: 54px;
      flex-shrink: 0;
    }

    .chat-av-wrap img {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .chat-online-dot {
      position: absolute;
      bottom: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #19d26b;
      border: 2px solid #fff;
    }

    .inbox-row-text {
      flex: 1;
      min-width: 0;
    }

    .inbox-row-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .inbox-row-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cam-quick-btn {
      background: none;
      border: none;
      color: #8a8d9b;
      padding: 6px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .unread-pill {
      background: var(--tt-red);
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* غرفة الدردشة داخل صندوق الوارد */
    .chat-room {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 58px - var(--safe-bottom));
      background: #f7f8fa;
    }

    .chat-room-header {
      background: #fff;
      padding: calc(var(--safe-top) + 8px) 12px 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .msg-bubble-wrap.me {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-bubble-wrap.them {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-bubble {
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-bubble-wrap.me .msg-bubble {
      background: var(--tt-red);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-bubble-wrap.them .msg-bubble {
      background: #fff;
      color: var(--text-dark);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-media-img {
      width: 190px;
      height: 135px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 4px;
      display: block;
    }

    .msg-shared-post {
      background: rgba(0, 0, 0, 0.06);
      border-radius: 10px;
      padding: 8px;
      margin-top: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .msg-meta {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .chat-toolbar {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-media-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .chat-media-bar::-webkit-scrollbar { display: none; }

    .chat-tool-chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dark);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* الصفحات العامة والملف الشخصي */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 15;
      min-height: 52px;
      padding: calc(var(--safe-top) + 4px) 14px 4px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .page-heading {
      font-size: 16.5px;
      font-weight: 800;
    }

    .btn-red {
      background: var(--tt-red);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-gray {
      background: var(--surface);
      color: var(--text-dark);
      border: none;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding-top: 2px;
    }

    .grid-item {
      aspect-ratio: 3 / 4;
      position: relative;
      background: #14151a;
      cursor: pointer;
      overflow: hidden;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grid-play-txt {
      position: absolute;
      bottom: 5px;
      right: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      direction: ltr;
    }

    .profile-head {
      padding: calc(10px + var(--safe-top)) 16px 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .profile-top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .profile-avatar-xl {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .stats-strip {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 14px 0;
    }

    .st-num {
      font-size: 16.5px;
      font-weight: 800;
      direction: ltr;
    }

    .st-lbl {
      font-size: 12px;
      color: var(--text-muted);
    }

    .profile-bio {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .p-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .p-tab {
      background: none;
      border: none;
      padding: 11px 0;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }

    .p-tab.active {
      color: var(--text-dark);
      font-weight: 800;
    }

    .p-tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 22%;
      right: 22%;
      height: 2.5px;
      background: var(--text-dark);
    }

            ${state.activitySummary.unread ? `<span class="unread-pill">جديد</span>` : ""}
          </div>
        ` : ""}

        <!-- أول 4 محادثات -->
        ${firstFour.map(c => renderChatRowHtml(c)).join("")}

        <!-- صف إشعارات النظام في منتصف القائمة مثل الصورة -->
        ${state.inboxFilter === "primary" ? `
          <div class="inbox-row" onclick="openSystemNotifsModal()">
            <div class="inbox-row-main">
              <div class="sys-circle system">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16l2 8v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-7l2-8zm1.5 9v5h13v-5h-3.2a3.3 3.3 0 0 1-6.6 0H5.5z"/></svg>
              </div>
              <div class="inbox-row-text">
                <div class="inbox-row-title">${esc(state.systemNotifSummary.title)}</div>
                <div class="inbox-row-sub">${esc(state.systemNotifSummary.subtitle)}</div>
              </div>
            </div>
          </div>
        ` : ""}

        <!-- باقي المحادثات -->
        ${restChats.map(c => renderChatRowHtml(c)).join("")}
      `;
    }

    function renderChatRowHtml(c) {
      return `
        <div class="inbox-row" onclick="openChatRoom('${c.id}')">
          <div class="inbox-row-main">
            <div class="chat-av-wrap">
              <img src="${esc(c.avatar)}" alt="" />
              ${c.online && state.user.onlineStatusVisible ? `<span class="chat-online-dot"></span>` : ""}
            </div>
            <div class="inbox-row-text">
              <div class="inbox-row-title">
                <span>${esc(c.name)}</span>
                ${c.badge ? `<span style="font-size:12px;">${esc(c.badge)}</span>` : ""}
              </div>
              <div class="inbox-row-sub">${esc(c.subtitle)}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            ${c.unread ? `<span class="unread-pill">${c.unread}</span>` : ""}
            <button class="cam-quick-btn" onclick="event.stopPropagation();quickCameraToChat('${c.id}')" type="button" title="إرسال صورة">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
          </div>
        </div>
      `;
    }

    function setInboxFilter(f) {
      state.inboxFilter = f;
      save();
      render();
    }

    function openChatRoom(id) {
      state.activeChatId = id;
      state.page = "chat";
      save();
      render();
    }

    function quickCameraToChat(chatId) {
      const chat = state.chats.find(c => c.id === chatId);
      if (!chat) return;
      const rnd = Math.floor(60 + Math.random() * 30);
      chat.messages.push({ id: "m_" + Date.now(), from: "me", type: "image", media: `https://picsum.photos/400/300?random=${rnd}`, time: "الآن", read: true });
      chat.subtitle = "تم الإرسال الآن";
      save();
      openChatRoom(chatId);
      toast("تم إرسال لقطة سريعة");
    }

    function renderChatRoom(vp) {
      const chat = state.chats.find(c => c.id === state.activeChatId) || state.chats[0];
      if (!chat) return;
      chat.unread = 0;
      chat.isRequest = false;
      chat.messages.forEach(m => { if (m.from === "me") m.read = true; });
      save();

      vp.innerHTML = `
        <div class="chat-room">
          <div class="chat-room-header">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
              <button class="btn-gray" style="padding:5px 10px;" onclick="goPage('inbox')" type="button">رجوع</button>
              <img src="${esc(chat.avatar)}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;" alt="" />
              <div style="min-width:0;">
                <div style="font-weight:800;font-size:14px;">${esc(chat.name)} ${esc(chat.badge || "")}</div>
                <div style="font-size:11px;color:${chat.online ? "var(--green)" : "var(--text-muted)"};">
                  ${state.user.onlineStatusVisible ? (chat.online ? "متصل الآن" : esc(chat.lastSeen)) : "الحالة مخفية"}
                </div>
              </div>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn-gray" style="padding:6px 9px;" onclick="toggleStarChat('${chat.id}')" type="button">${chat.starred ? "★ مميز" : "☆ نجمة"}</button>
              <button class="btn-gray" style="padding:6px 9px;" onclick="startCall('${esc(chat.name)}','صوتية')" type="button">صوتي</button>
              <button class="btn-red" style="padding:6px 9px;" onclick="startCall('${esc(chat.name)}','مرئية')" type="button">مرئي</button>
            </div>
          </div>

          <div class="chat-messages" id="chatMessagesBox">
            ${chat.messages.map(m => {
              const sharedVid = m.type === "post" ? state.videos.find(v => v.id === m.postId) : null;
              return `
                <div class="msg-bubble-wrap ${m.from}">
                  <div class="msg-bubble">
                    ${m.type === "image" ? `<div>صورة مرسلة</div><img class="msg-media-img" src="${esc(m.media)}" alt="" />` : ""}
                    ${m.type === "video" ? `<div>فيديو مرسل (${esc(m.text)})</div>` : ""}
                    ${m.type === "voice" ? `<div>رسالة صوتية (${esc(m.duration || "0:08")})</div>` : ""}
                    ${m.type === "post" ? `
                      <div>منشور مشارك:</div>
                      <div class="msg-shared-post" onclick="goPage('home')">
                        <strong>${esc(sharedVid ? sharedVid.handle : "@dert")}</strong> — ${esc(m.text)}
                      </div>
                    ` : ""}
                    ${m.type === "text" ? esc(m.text) : ""}
                  </div>
                  <div class="msg-meta">
                    <span>${esc(m.time)}</span>
                    ${m.from === "me" ? `<span>${m.read ? "تمت القراءة" : "تم الإرسال"}</span>` : ""}
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="chat-toolbar">
            <div class="chat-media-bar">
              <button class="chat-tool-chip" onclick="sendMediaMessage('image')" type="button">صورة</button>
              <button class="chat-tool-chip" onclick="sendMediaMessage('video')" type="button">فيديو</button>
              <button class="chat-tool-chip" onclick="sendMediaMessage('voice')" type="button">رسالة صوتية</button>
              <button class="chat-tool-chip" onclick="openSharePostToChatModal('${chat.id}')" type="button">إرسال منشور / فيديو</button>
            </div>
            <div class="chat-input-row">
              <input class="field-inp" style="margin-top:0;" id="chatMsgInput" placeholder="إرسال رسالة..." />
              <button class="btn-red" style="padding:10px 15px;" onclick="sendTextMessage('${chat.id}')" type="button">إرسال</button>
            </div>
          </div>
        </div>
      `;

      const box = document.getElementById("chatMessagesBox");
      if (box) box.scrollTop = box.scrollHeight;
    }

    function toggleStarChat(id) {
      const c = state.chats.find(x => x.id === id);
      if (!c) return;
      c.starred = !c.starred;
      save();
      renderChatRoom(document.getElementById("viewport"));
      toast(c.starred ? "تم وضع نجمة على المحادثة" : "تمت إزالة النجمة");
    }

    function sendTextMessage(chatId) {
      const inp = document.getElementById("chatMsgInput");
      const txt = inp?.value.trim();
      if (!txt) return;
      const chat = state.chats.find(c => c.id === chatId);
      if (!chat) return;
      chat.messages.push({ id: "m_" + Date.now(), from: "me", type: "text", text: txt, time: "الآن", read: true });
      chat.subtitle = "تم الإرسال";
      save();
      renderChatRoom(document.getElementById("viewport"));
    }

    function sendMediaMessage(kind) {
      const chat = state.chats.find(c => c.id === state.activeChatId);
      if (!chat) return;
      const rnd = Math.floor(70 + Math.random() * 25);
      if (kind === "image") {
        chat.messages.push({ id: "m_" + Date.now(), from: "me", type: "image", media: `https://picsum.photos/400/300?random=${rnd}`, time: "الآن", read: true });
      } else if (kind === "video") {
        chat.messages.push({ id: "m_" + Date.now(), from: "me", type: "video", text: "مقطع فيديو 0:15", time: "الآن", read: true });
      } else if (kind === "voice") {
        chat.messages.push({ id: "m_" + Date.now(), from: "me", type: "voice", duration: "0:09", time: "الآن", read: true });
      }
      chat.subtitle = "تم الإرسال";
      save();
      renderChatRoom(document.getElementById("viewport"));
      toast("تم الإرسال");
    }

    function openSharePostToChatModal(chatId) {
      openSheet("إرسال منشور أو فيديو للمحادثة", `
        ${state.videos.map(v => `
          <div class="inbox-row" onclick="sendSharedPost('${chatId}','${v.id}')">
            <div><strong>${esc(v.handle)}</strong> — ${esc(v.caption)}</div>
            <button class="btn-red" type="button">إرسال</button>
          </div>
        `).join("")}
      `);
    }

    function sendSharedPost(chatId, vidId) {
      const chat = state.chats.find(c => c.id === chatId);
      const vid = state.videos.find(v => v.id === vidId);
      if (!chat || !vid) return;
      chat.messages.push({ id: "m_" + Date.now(), from: "me", type: "post", postId: vid.id, text: vid.caption, time: "الآن", read: true });
      chat.subtitle = "تم الإرسال";
      save();
      closeSheet();
      renderChatRoom(document.getElementById("viewport"));
      toast("تم إرسال المنشور");

      box.innerHTML = state.chats
        .filter(c => !term || c.name.toLowerCase().includes(term))
        .map(c => `
          <div class="inbox-row" onclick="closeSheet();openChatRoom('${c.id}')">
            <div class="inbox-row-main">
              <img src="${esc(c.avatar)}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;" alt="" />

        </div>
        <div class="inbox-row">
          <div><div style="font-weight:700;">المصادقة الثنائية (2FA)</div><div style="font-size:12px;color:var(--text-muted);">حماية إضافية لتسجيل الدخول والأمان</div></div>
          <button class="btn-gray" onclick="toggleTwoFactor()" type="button">${state.user.twoFactor ? "مفعّل" : "إيقاف"}</button>
        </div>
        <div class="inbox-row">
          <div><div style="font-weight:700;">حالة الاتصال وآخر ظهور</div><div style="font-size:12px;color:var(--text-muted);">إظهار حالة الاتصال في صندوق الوارد</div></div>
          <button class="btn-gray" onclick="toggleOnlineVis()" type="button">${state.user.onlineStatusVisible ? "ظاهر" : "مخفي"}</button>
        </div>
      `;
    }

    function attachVideoObservers() {
      const slides = document.querySelectorAll(".tt-slide");
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const slide = entry.target;
          const vid = slide.querySelector("video");
          if (!vid) return;
          if (entry.isIntersecting) {
            slide.classList.remove("paused");
            vid.play().catch(() => {});
          } else {
            vid.pause();
            vid.currentTime = 0;
          }
        });
      }, { threshold: 0.65 });

      slides.forEach(slide => {
        const vid = slide.querySelector("video");
        const bar = slide.querySelector(".seek-fill");
        if (vid && bar) {
          vid.addEventListener("timeupdate", () => {
            if (vid.duration) bar.style.width = ((vid.currentTime / vid.duration) * 100) + "%";
          });
        }
        io.observe(slide);
      });
    }

    function onSlideClick(e, id) {
      const slide = e.currentTarget;
      if (tapTimer) {
        clearTimeout(tapTimer);
        tapTimer = null;
        const rect = slide.getBoundingClientRect();
        const pop = document.createElement("div");
        pop.className = "heart-pop";
        pop.textContent = "♥";
        pop.style.left = (e.clientX - rect.left) + "px";
        pop.style.top = (e.clientY - rect.top) + "px";
        slide.appendChild(pop);
        setTimeout(() => pop.remove(), 750);
        const v = state.videos.find(x => x.id === id);
        if (v && !v.liked) toggleLike(id);
      } else {
        tapTimer = setTimeout(() => {
          tapTimer = null;
          const vid = slide.querySelector("video");
          if (!vid) return;
          if (vid.paused) { vid.play().catch(() => {}); slide.classList.remove("paused"); }
          else { vid.pause(); slide.classList.add("paused"); }
        }, 230);
      }
    }

    function setFeedFilter(f) { state.feedFilter = f; save(); render(); }
    function setProfileFilter(f) { state.profileFilter = f; save(); render(); }

    function toggleLike(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.liked = !v.liked;
      v.likes += v.liked ? 1 : -1;
      state.user.likes += v.liked ? 1 : -1;
      save(); render();
    }

    function toggleSave(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.saved = !v.saved;
      v.saves = (v.saves || 0) + (v.saved ? 1 : -1);
      save(); render();
      toast(v.saved ? "تمت الإضافة إلى المحفوظات" : "تمت الإزالة من المحفوظات");
    }

    function toggleFollow(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.following = !v.following;
      state.user.following += v.following ? 1 : -1;
      save(); render();
      toast(v.following ? "تمت المتابعة" : "تم إلغاء المتابعة");
    }

    function openSheet(title, html) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = html;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeSheet() { document.getElementById("modalBackdrop").classList.remove("open"); }

    function openComments(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      openSheet(`${fmtNum(v.comments.length)} تعليق`, `
        <div>
          ${v.comments.map(c => `
            <div class="cmt-row">
              <div style="display:flex;gap:10px;flex:1;min-width:0;">
                <img class="cmt-av" src="${esc(c.avatar)}" alt="" />
                <div>
                  <div style="font-size:12px;font-weight:700;color:var(--text-muted);">${esc(c.user)}</div>
                  <div style="font-size:13.5px;margin-top:2px;">${esc(c.text)}</div>
                  <div style="font-size:11px;color:var(--text-muted);margin-top:3px;">${esc(c.time)}</div>
                </div>
              </div>
            </div>
          `).join("") || `<div style="text-align:center;color:var(--text-muted);padding:18px 0;">كن أول من يعلّق</div>`}
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
          <input class="field-inp" style="margin-top:0;" id="cmtInp" placeholder="إضافة تعليق..." />
          <button class="primary-submit" style="margin-top:0;width:auto;padding:10px 16px;" onclick="submitCmt('${id}')" type="button">نشر</button>
        </div>
      `);
    }

    function submitCmt(id) {
      const val = document.getElementById("cmtInp").value.trim();
      if (!val) return;
      const v = state.videos.find(x => x.id === id);
      v.comments.push({ id: "cm_" + Date.now(), user: state.user.name, avatar: state.user.avatar, text: val, time: "الآن", likes: 0, liked: false });
      save(); render(); openComments(id);
    }

    function openShareModal(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      openSheet(`مشاركة (${fmtNum(v.shares || 0)})`, `
        <div class="share-grid">
          <button class="share-choice" onclick="confirmShare('${id}','إعادة النشر')" type="button">إعادة النشر</button>
          <button class="share-choice" onclick="confirmShare('${id}','نسخ الرابط')" type="button">نسخ الرابط</button>
          <button class="share-choice" onclick="shareToChatDirect('${id}')" type="button">إرسال في صندوق الوارد</button>
          <button class="share-choice" onclick="confirmShare('${id}','مشاركة خارجية')" type="button">مشاركة خارجية</button>
        </div>
      `);
    }

    function shareToChatDirect(vidId) {
      const vid = state.videos.find(x => x.id === vidId);
      const chat = state.chats[0];
      if (vid && chat) {
        chat.messages.push({ id: "m_" + Date.now(), from: "me", type: "post", postId: vid.id, text: vid.caption, time: "الآن", read: true });
        vid.shares = (vid.shares || 0) + 1;
        save(); closeSheet(); openChatRoom(chat.id); toast("تم إرسال المقطع في المحادثة");
      }
    }

    function confirmShare(id, method) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.shares = (v.shares || 0) + 1;
      save(); render(); closeSheet();
      toast(`تمت المشاركة عبر ${method}`);
    }

    function openBalanceSheet() {
      const gws = ["زين كاش", "سوبر كي", "زين العراق", "آسياسيل"];
      const mShare = Math.round(state.user.grossCoins * 0.6);
      const pShare = Math.round(state.user.grossCoins * 0.4);
      openSheet("الرصيد", `
        <div style="font-size:24px;font-weight:800;">${state.user.coins} عملة</div>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:4px;">حصة المذيع (60%): ${mShare} • حصة المنصة (40%): ${pShare}</div>
        <div class="gw-grid">
          ${gws.map(g => `<button class="gw-opt ${state.user.gateway === g ? "active" : ""}" onclick="pickGateway('${g}')" type="button">${g}</button>`).join("")}
        </div>
        <button class="primary-submit" onclick="topupCoins()" type="button">+ شحن 200 عملة (${esc(state.user.gateway)})</button>
      `);
    }

    function pickGateway(g) { state.user.gateway = g; save(); openBalanceSheet(); }
    function topupCoins() {
      state.user.coins += 200;
      state.user.grossCoins += 200;
      save(); render(); openBalanceSheet(); toast("تم شحن 200 عملة");
    }

    function togglePrivate() { state.user.privateAcc = !state.user.privateAcc; save(); render(); toast("تم تحديث الخصوصية"); }
    function toggleTwoFactor() { state.user.twoFactor = !state.user.twoFactor; save(); render(); toast("تم تحديث المصادقة الثنائية"); }
    function toggleOnlineVis() { state.user.onlineStatusVisible = !state.user.onlineStatusVisible; save(); render(); toast("تم تحديث حالة الاتصال"); }

    function openEditProfile() {
      openSheet("تعديل الملف الشخصي", `
        <input class="field-inp" id="pName" value="${esc(state.user.name)}" placeholder="الاسم" />
        <input class="field-inp" id="pHandle" value="${esc(state.user.handle)}" placeholder="@username" />
        <textarea class="field-inp" id="pBio" rows="3" placeholder="النبذة التعريفية">${esc(state.user.bio)}</textarea>
        <button class="primary-submit" onclick="saveProfile()" type="button">حفظ</button>
      `);
    }

    function saveProfile() {
      state.user.name = document.getElementById("pName").value.trim() || state.user.name;
      const h = document.getElementById("pHandle").value.trim();
      if (h) state.user.handle = h.startsWith("@") ? h : "@" + h;
      state.user.bio = document.getElementById("pBio").value;
      save(); render(); closeSheet(); toast("تم الحفظ");
    }

    function openLiveModal() {
      openSheet("البث المباشر (LIVE)", `
        <div style="text-align:center;padding:10px 0;">
          <div style="font-size:15px;font-weight:800;">بدء بث مباشر على DERT</div>
          <div style="font-size:12.5px;color:var(--text-muted);margin-top:6px;">نسبة أرباح الهدايا: 60% للمذيع • 40% للمنصة</div>
          <button class="primary-submit" onclick="closeSheet();toast('تم بدء البث المباشر')" type="button">ابدأ البث المباشر</button>
        </div>
      `);
    }

    function openUploadModal() {
      openSheet("نشر مقطع جديد", `
        <input class="field-inp" id="capInp" placeholder="اكتب وصف المقطع..." />
        <input class="field-inp" id="urlInp" placeholder="رابط فيديو MP4 مباشر (اختياري)" />
        <button class="primary-submit" onclick="createNewVideo()" type="button">نشر الآن</button>
      `);
    }

    function createNewVideo() {
      const cap = document.getElementById("capInp").value.trim() || "مقطع جديد على DERT";
      const customUrl = document.getElementById("urlInp").value.trim();
      const rnd = Math.floor(60 + Math.random() * 40);
      state.videos.unshift({
        id: "v_" + Date.now(),
        author: state.user.name,
        handle: state.user.handle,
        avatar: state.user.avatar,
        videoUrl: customUrl || "https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4",
        poster: `https://picsum.photos/480/850?random=${rnd}`,
        caption: cap,
        sound: "الصوت الأصلي - " + state.user.handle,
        plays: "1",
        likes: 0,
        saves: 0,
        shares: 0,
        liked: false,
        saved: false,
        following: true,
        comments: []
      });
      save(); closeSheet(); state.page = "home"; state.feedFilter = "foryou"; render(); toast("تم نشر المقطع");
    }

    document.querySelectorAll(".nav-item[data-page]").forEach(btn => {
      btn.addEventListener("click", () => goPage(btn.dataset.page));
    });

    document.getElementById("openUploadBtn").addEventListener("click", openUploadModal);
    document.getElementById("closeModalBtn").addEventListener("click", closeSheet);
    document.getElementById("modalBackdrop").addEventListener("click", e => {
      if (e.target.id === "modalBackdrop") closeSheet();
    });

    render();
  </script>
</body>
</html>
