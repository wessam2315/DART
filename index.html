
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090d">
<title>DART | Connect the World</title>

<style>
:root{
  --bg:#09090d;
  --panel:#121218;
  --panel2:#191921;
  --line:#292933;
  --yellow:#f4e94e;
  --blue:#4bd9ff;
  --pink:#ff39c8;
  --text:#f4f4f5;
  --muted:#90909c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{
  display:flex;
  min-height:100vh;
  max-width:1500px;
  margin:auto;
}
.sidebar{
  width:245px;
  padding:25px 18px;
  border-left:1px solid var(--line);
  background:#0e0e13;
  display:flex;
  flex-direction:column;
}
.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:30px;
}
.logo span{color:var(--yellow)}
.nav-btn{
  width:100%;
  background:transparent;
  color:#ddd;
  border:0;
  padding:15px;
  text-align:right;
  border-radius:12px;
  margin:4px 0;
}
.nav-btn:hover,.nav-btn.active{
  background:#22222a;
  color:var(--yellow);
}
.create-btn{
  border:0;
  padding:14px;
  border-radius:12px;
  background:var(--yellow);
  color:#111;
  font-weight:bold;
  margin-bottom:18px;
}
.side-bottom{
  margin-top:auto;
  border-top:1px solid var(--line);
  padding-top:20px;
  color:var(--muted);
  font-size:13px;
}
.main{
  flex:1;
  min-width:0;
  padding-bottom:90px;
}
.topbar{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:5;
  background:#09090deF;
  backdrop-filter:blur(15px);
}
.topbar h2{font-size:19px}
.top-actions{display:flex;gap:15px}
.icon-btn{
  background:transparent;
  border:0;
  color:var(--yellow);
  font-size:22px;
  padding:8px;
}
.content{
  max-width:850px;
  margin:auto;
  padding:22px;
}
.page{display:none}
.page.active{display:block}
.stories{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding:10px 2px 22px;
}
.story{
  flex:0 0 65px;
  text-align:center;
  cursor:pointer;
}
.story-ring{
  width:60px;height:60px;
  border-radius:50%;
  padding:3px;
  border:2px solid var(--yellow);
  margin:auto auto 8px;
}
.story-ring img{
  width:100%;height:100%;
  object-fit:cover;border-radius:50%;
}
.story small{color:var(--muted);font-size:11px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  margin-bottom:20px;
  overflow:hidden;
}
.post-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
}
.avatar{
  width:45px;height:45px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid var(--yellow);
}
.user-info{flex:1}
.user-info strong{display:block;font-size:14px}
.user-info small{color:var(--muted);font-size:12px}
.more{
  border:0;background:transparent;color:var(--yellow);
  font-size:20px;
}
.post-image{
  width:100%;
  display:block;
  max-height:650px;
  object-fit:cover;
  background:#222;
}
.post-body{padding:15px}
.post-actions{
  display:flex;
  gap:18px;
  padding:10px 0;
}
.post-actions button{
  border:0;background:transparent;
  color:white;font-size:23px;
}
.post-actions button.liked{color:var(--pink)}
.post-actions button.saved{color:var(--yellow)}
.likes{font-weight:bold;font-size:13px;margin-bottom:10px}
.caption{line-height:1.8;font-size:14px}
.caption b{margin-left:5px}
.comments-link{
  color:var(--muted);
  margin-top:10px;
  font-size:13px;
  cursor:pointer;
}
.comment-box{
  display:flex;gap:10px;margin-top:12px;
}
.comment-box input{
  flex:1;background:#20202a;border:1px solid var(--line);
  padding:12px;border-radius:10px;color:white;
}
.comment-box button{
  background:var(--yellow);border:0;padding:10px 14px;
  border-radius:10px;color:#111;font-weight:bold;
}
.section-title{
  font-size:22px;
  margin:10px 0 20px;
}
.search-box{
  display:flex;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:20px;
}
.search-box input{
  flex:1;background:transparent;border:0;outline:0;color:white;
}
.people{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}
.person{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  text-align:center;
}
.person img{
  width:80px;height:80px;border-radius:50%;
  object-fit:cover;border:2px solid var(--yellow);
  margin-bottom:10px;
}
.person p{color:var(--muted);font-size:13px;margin:8px}
.follow{
  padding:10px 20px;border:0;border-radius:10px;
  background:var(--yellow);color:#111;font-weight:bold;
}
.follow.following{
  background:#282832;color:white;border:1px solid var(--line);
}
.messages-layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:15px;
  min-height:600px;
}
.chat-list{
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.chat-entry{
  display:flex;gap:12px;align-items:center;
  padding:15px;border-bottom:1px solid var(--line);
  cursor:pointer;
}
.chat-entry:hover{background:var(--panel2)}
.chat-entry img{
  width:45px;height:45px;border-radius:50%;object-fit:cover;
}
.chat-entry div{flex:1;min-width:0}
.chat-entry small{display:block;color:var(--muted);margin-top:5px}
.chat-window{
  border:1px solid var(--line);
  border-radius:16px;
  display:flex;flex-direction:column;
  min-height:500px;
}
.chat-head{
  padding:15px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
.chat-body{
  flex:1;padding:15px;display:flex;flex-direction:column;
  gap:12px;overflow-y:auto;
}
.bubble{
  max-width:80%;padding:12px 15px;border-radius:16px;
  line-height:1.6;font-size:14px;
}
.bubble.in{background:#20202a;align-self:flex-start}
.bubble.out{background:#55521c;align-self:flex-end;color:white}
.chat-send{
  display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);
}
.chat-send input{
  flex:1;background:#1b1b23;border:0;color:white;
  padding:12px;border-radius:10px;min-width:0;
}
.chat-send button{
  border:0;background:var(--yellow);padding:10px 16px;
  border-radius:10px;
}
.profile{
  text-align:center;padding:20px;
}
.profile-cover{
  height:160px;border-radius:18px;
  background:linear-gradient(120deg,#26185c,#102b50,#551e49);
}
.profile-photo{
  width:100px;height:100px;border-radius:50%;
  object-fit:cover;border:4px solid var(--bg);
  margin-top:-50px;
}
.profile h2{margin:12px}
.profile p{color:var(--muted);line-height:1.8}
.stats{
  display:flex;justify-content:center;gap:30px;margin:25px;
}
.stats div{font-size:13px;color:var(--muted)}
.stats strong{display:block;font-size:20px;color:white;margin-bottom:5px}
.profile-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
}
.profile-grid img{
  width:100%;aspect-ratio:1;object-fit:cover;
}
.modal{
  display:none;position:fixed;inset:0;
  background:#000c;z-index:20;
  justify-content:center;align-items:center;padding:15px;
}
.modal.open{display:flex}
.modal-box{
  width:100%;max-width:500px;background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:22px;
}
.modal-box h2{margin-bottom:18px}
.modal-box input,.modal-box textarea{
  width:100%;background:#20202a;border:1px solid var(--line);
  border-radius:12px;color:white;padding:14px;margin:8px 0;
}
.modal-box textarea{min-height:110px;resize:vertical}
.modal-buttons{display:flex;gap:10px;margin-top:12px}
.modal-buttons button{
  flex:1;padding:13px;border:0;border-radius:12px;font-weight:bold;
}
.primary{background:var(--yellow);color:#111}
.secondary{background:#292933;color:white}
.bottom-nav{
  display:none;
}
.empty{
  padding:30px;text-align:center;color:var(--muted);
}
@media(max-width:800px){
  .sidebar{display:none}
  .main{padding-bottom:80px}
  .content{padding:14px}
  .topbar{height:60px;padding:0 15px}
  .people{grid-template-columns:1fr 1fr}
  .messages-layout{grid-template-columns:1fr}
  .chat-list{max-height:260px;overflow-y:auto}
  .chat-window{min-height:400px}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    height:72px;background:#0d0d12;
    border-top:1px solid var(--line);
    z-index:10;justify-content:space-around;
    align-items:center;padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav button{
    background:transparent;border:0;color:#aaa;
    font-size:23px;padding:8px;
  }
  .bottom-nav button.active{color:var(--yellow)}
}
@media(max-width:400px){
  .people{grid-template-columns:1fr}
  .top-actions{gap:5px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div class="logo">DART<span>.</span></div>
  <button class="create-btn" onclick="openCreate()">＋ إنشاء منشور</button>
  <button class="nav-btn active" data-page="home" onclick="go('home')">⌂ الرئيسية</button>
  <button class="nav-btn" data-page="explore" onclick="go('explore')">⌕ اكتشاف</button>
  <button class="nav-btn" data-page="messages" onclick="go('messages')">✉ الرسائل</button>
  <button class="nav-btn" data-page="profile" onclick="go('profile')">◉ الملف الشخصي</button>
  <button class="nav-btn" onclick="openCreate()">＋ إنشاء</button>
  <div class="side-bottom">DART<br>Connect the World 🌍</div>
</aside>

<main class="main">
<header class="topbar">
  <h2 id="pageTitle">الرئيسية</h2>
  <div class="top-actions">
    <button class="icon-btn" onclick="go('explore')">⌕</button>
    <button class="icon-btn" onclick="go('messages')">✉</button>
  </div>
</header>

<div class="content">

<!-- HOME -->
<section class="page active" id="home">

<div class="stories" id="stories"></div>

<div id="feed"></div>

</section>

<!-- EXPLORE -->
<section class="page" id="explore">
<h2 class="section-title">اكتشاف 🌍</h2>

<div class="search-box">
<span>⌕</span>
<input id="searchPeople" placeholder="ابحث عن أشخاص..." oninput="filterPeople()">
</div>

<div class="people" id="people"></div>
</section>

<!-- MESSAGES -->
<section class="page" id="messages">
<h2 class="section-title">الرسائل ✉</h2>

<div class="messages-layout">

<div class="chat-list" id="chatList"></div>

<div class="chat-window">
<div class="chat-head" id="chatHead">
  <div>اختر محادثة</div>
</div>
<div class="chat-body" id="chatBody">
<div class="empty">اختَر شخصاً من القائمة لبدء المحادثة</div>
</div>
<div class="chat-send">
<input id="chatInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendChat()">
<button onclick="sendChat()">إرسال</button>
</div>
</div>

</div>
</section>

<!-- PROFILE -->
<section class="page" id="profile">
<div class="profile">
<div class="profile-cover"></div>
<img class="profile-photo" src="https://i.pravatar.cc/300?img=12">
<h2 id="profileName">DART User</h2>
<p>Connect the World 🌍</p>
<p>مرحباً، أنا عضو في مجتمع DART.</p>

<div class="stats">
<div><strong id="myPostCount">0</strong>منشورات</div>
<div><strong>120</strong>متابع</div>
<div><strong>85</strong>أتابع</div>
</div>

<button class="follow" onclick="editProfile()">✎ تعديل الملف</button>
</div>

<div class="profile-grid" id="profileGrid"></div>
</section>

</div>
</main>
</div>

<nav class="bottom-nav">
<button class="active" data-page="home" onclick="go('home')">⌂</button>
<button data-page="explore" onclick="go('explore')">⌕</button>
<button onclick="openCreate()" style="color:var(--yellow);font-size:30px">＋</button>
<button data-page="messages" onclick="go('messages')">✉</button>
<button data-page="profile" onclick="go('profile')">◉</button>
</nav>

<!-- CREATE POST MODAL -->
<div class="modal" id="createModal">
<div class="modal-box">
<h2>إنشاء منشور ✨</h2>
<textarea id="postText" placeholder="بماذا تفكر؟"></textarea>
<input id="postImage" placeholder="رابط الصورة (اختياري)">
<div class="modal-buttons">
<button class="primary" onclick="createPost()">نشر</button>
<button class="secondary" onclick="closeModal()">إلغاء</button>
</div>
</div>
</div>

<!-- EDIT PROFILE -->
<div class="modal" id="profileModal">
<div class="modal-box">
<h2>تعديل الملف الشخصي</h2>
<input id="editName" placeholder="اسمك">
<div class="modal-buttons">
<button class="primary" onclick="saveProfile()">حفظ</button>
<button class="secondary" onclick="closeProfileModal()">إلغاء</button>
</div>
</div>
</div>

<script>
const demoPeople=[
 {id:1,name:"Gemma Ward",img:"https://i.pravatar.cc/300?img=47",city:"London"},
 {id:2,name:"Karlie Kloss",img:"https://i.pravatar.cc/300?img=44",city:"Ukraine"},
 {id:3,name:"Jordan Barrett",img:"https://i.pravatar.cc/300?img=12",city:"Vinnitsa"},
 {id:4,name:"David Gandy",img:"https://i.pravatar.cc/300?img=13",city:"London"},
 {id:5,name:"Bella Hadid",img:"https://i.pravatar.cc/300?img=49",city:"Paris"},
 {id:6,name:"Sean O'Pry",img:"https://i.pravatar.cc/300?img=68",city:"New York"}
];

const demoPosts=[
 {id:1,user:"Gemma Ward",img:"https://i.pravatar.cc/300?img=47",photo:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=80",caption:"Photography is my hobby. ✨",likes:120,comments:[]},
 {id:2,user:"Karlie Kloss",img:"https://i.pravatar.cc/300?img=44",photo:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=1000&q=80",caption:"Beautiful day! 🌍",likes:85,comments:[]},
 {id:3,user:"Jordan Barrett",img:"https://i.pravatar.cc/300?img=12",photo:"https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1000&q=80",caption:"Keep moving forward.",likes:210,comments:[]}
];

let posts=demoPosts.map(p=>({...p,liked:false,saved:false}));
let currentChat=null;
let chats={};
let followed={};
let myName="DART User";

function renderStories(){
 const stories=document.getElementById("stories");
 stories.innerHTML="";
 const add=document.createElement("div");
 add.className="story";
 add.innerHTML=`<div class="story-ring" style="display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--yellow)">＋</div><small>قصتي</small>`;
 add.onclick=()=>openCreate();
 stories.appendChild(add);

 demoPeople.forEach(p=>{
  const s=document.createElement("div");
  s.className="story";
  s.innerHTML=`<div class="story-ring"><img src="${p.img}"></div><small>${p.name.split(" ")[0]}</small>`;
  s.onclick=()=>go("explore");
  stories.appendChild(s);
 });
}

function renderFeed(){
 const feed=document.getElementById("feed");
 feed.innerHTML="";
 posts.forEach(p=>{
  const card=document.createElement("article");
  card.className="card";
  card.innerHTML=`
   <div class="post-header">
    <img class="avatar" src="${p.img}">
    <div class="user-info"><strong>${esc(p.user)}</strong><small>🌍 DART</small></div>
    <button class="more" onclick="alert('خيارات المنشور')">⋯</button>
   </div>
   ${p.photo?`<img class="post-image" src="${esc(p.photo)}" onerror="this.style.display='none'">`:""}
   <div class="post-body">
    <div class="post-actions">
      <button class="${p.liked?'liked':''}" onclick="toggleLike(${p.id})">${p.liked?'♥':'♡'}</button>
      <button onclick="focusComment(${p.id})">♧</button>
      <button onclick="sharePost(${p.id})">➤</button>
      <button class="${p.saved?'saved':''}" onclick="toggleSave(${p.id})" style="margin-right:auto">♧</button>
    </div>
    <div class="likes">${p.likes} إعجاب</div>
    <div class="caption"><b>${esc(p.user)}</b> ${esc(p.caption)}</div>
    <div class="comments-link" onclick="focusComment(${p.id})">عرض التعليقات (${p.comments.length})</div>
    <div id="comments-${p.id}">
      ${p.comments.map(c=>`<div class="caption" style="margin-top:8px"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join("")}
    </div>
    <div class="comment-box">
      <input id="comment-${p.id}" placeholder="اكتب تعليقاً...">
      <button onclick="addComment(${p.id})">نشر</button>
    </div>
   </div>`;
  feed.appendChild(card);
 });
 updateProfile();
}

function toggleLike(id){
 const p=posts.find(x=>x.id===id);
 if(!p)return;
 p.liked=!p.liked;
 p.likes+=p.liked?1:-1;
 renderFeed();
}

function toggleSave(id){
 const p=posts.find(x=>x.id===id);
 if(!p)return;
 p.saved=!p.saved;
 renderFeed();
}

function focusComment(id){
 const el=document.getElementById("comment-"+id);
 if(el)el.focus();
}

function addComment(id){
 const el=document.getElementById("comment-"+id);
 if(!el)return;
 const text=el.value.trim();
 if(!text)return;
 const p=posts.find(x=>x.id===id);
 p.comments.push({name:myName,text});
 renderFeed();
}

function sharePost(id){
 const p=posts.find(x=>x.id===id);
 if(!p)return;
 const text=p.caption;
 if(navigator.share){
  navigator.share({title:"DART",text});
 }else if(navigator.clipboard){
  navigator.clipboard.writeText(text).then(()=>alert("تم نسخ النص"));
 }else{
  alert(text);
 }
}

function renderPeople(list=demoPeople){
 const container=document.getElementById("people");
 container.innerHTML="";
 list.forEach(p=>{
  const card=document.createElement("div");
  card.className="person";
  card.innerHTML=`
   <img src="${p.img}">
   <h3>${esc(p.name)}</h3>
   <p>📍 ${esc(p.city)}</p>
   <button class="follow ${followed[p.id]?'following':''}" onclick="toggleFollow(${p.id})">
   ${followed[p.id]?'متابَع':'متابعة'}
   </button>
   <button class="follow" style="margin-top:8px;background:#252530;color:white" onclick="startChat(${p.id})">رسالة</button>`;
  container.appendChild(card);
 });
}

function filterPeople(){
 const q=document.getElementById("searchPeople").value.toLowerCase();
 renderPeople(demoPeople.filter(p=>p.name.toLowerCase().includes(q)||p.city.toLowerCase().includes(q)));
}

function toggleFollow(id){
 followed[id]=!followed[id];
 filterPeople();
}

function renderChatList(){
 const list=document.getElementById("chatList");
 list.innerHTML="";
 demoPeople.forEach(p=>{
  const entry=document.createElement("div");
  entry.className="chat-entry";
  const last=(chats[p.id]||[]).slice(-1)[0];
  entry.innerHTML=`<img src="${p.img}"><div><strong>${esc(p.name)}</strong><small>${last?esc(last.text):'ابدأ محادثة'}</small></div>`;
  entry.onclick=()=>startChat(p.id);
  list.appendChild(entry);
 });
}

function startChat(id){
 currentChat=id;
 const p=demoPeople.find(x=>x.id===id);
 if(!p)return;
 document.getElementById("chatHead").innerHTML=`<img class="avatar" src="${p.img}"><div><strong>${esc(p.name)}</strong><small style="display:block;color:var(--muted)">DART</small></div>`;
 renderChatBody();
 go("messages");
}

function renderChatBody(){
 const body=document.getElementById("chatBody");
 body.innerHTML="";
 if(!currentChat){
  body.innerHTML='<div class="empty">اختر محادثة</div>';
  return;
 }
 const history=chats[currentChat]||[];
 if(!history.length){
  body.innerHTML='<div class="empty">ابدأ محادثة جديدة</div>';
 }
 history.forEach(m=>{
  const b=document.createElement("div");
  b.className="bubble "+(m.mine?"out":"in");
  b.textContent=m.text;
  body.appendChild(b);
 });
 body.scrollTop=body.scrollHeight;
}

function sendChat(){
 const input=document.getElementById("chatInput");
 const text=input.value.trim();
 if(!text||!currentChat)return;
 if(!chats[currentChat])chats[currentChat]=[];
 chats[currentChat].push({text,mine:true});
 input.value="";
 renderChatBody();
 renderChatList();
}

function go(page){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(page).classList.add("active");
 document.querySelectorAll("[data-page]").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===page);
 });
 const names={home:"الرئيسية",explore:"اكتشاف",messages:"الرسائل",profile:"الملف الشخصي"};
 document.getElementById("pageTitle").textContent=names[page]||"DART";
 if(page==="messages")renderChatList();
 if(page==="explore")renderPeople();
 if(page==="profile")updateProfile();
 window.scrollTo(0,0);
}

function openCreate(){
 document.getElementById("createModal").classList.add("open");
}

function closeModal(){
 document.getElementById("createModal").classList.remove("open");
}

function createPost(){
 const text=document.getElementById("postText").value.trim();
 const photo=document.getElementById("postImage").value.trim();
 if(!text&&!photo){
  alert("اكتب شيئاً أو أضف رابط صورة");
  return;
 }
 posts.unshift({
  id:Date.now(),
  user:myName,
  img:"https://i.pravatar.cc/300?img=12",
  photo:photo,
  caption:text,
  likes:0,
  comments:[],
  liked:false,
  saved:false
 });
 document.getElementById("postText").value="";
 document.getElementById("postImage").value="";
 closeModal();
 go("home");
 renderFeed();
}

function editProfile(){
 document.getElementById("editName").value=myName;
 document.getElementById("profileModal").classList.add("open");
}

function closeProfileModal(){
 document.getElementById("profileModal").classList.remove("open");
}

function saveProfile(){
 const name=document.getElementById("editName").value.trim();
 if(name)myName=name;
 closeProfileModal();
 updateProfile();
 renderFeed();
}

function updateProfile(){
 document.getElementById("profileName").textContent=myName;
 document.getElementById("myPostCount").textContent=posts.filter(p=>p.user===myName).length;
 const grid=document.getElementById("profileGrid");
 grid.innerHTML="";
 posts.filter(p=>p.user===myName).forEach(p=>{
  const img=document.createElement("img");
  img.src=p.photo||"https://i.pravatar.cc/300?img=12";
  grid.appendChild(img);
 });
}

function esc(text){
 return String(text).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

renderStories();
renderFeed();
renderPeople();
renderChatList();
</script>

</body>
</html>
