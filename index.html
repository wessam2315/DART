<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>DERT</title>
  <style>
    :root {
      --bg-dark: #000000;
      --bg-light: #ffffff;
      --surface: #f2f2f5;
      --surface-2: #e7e8ed;
      --text-dark: #161823;
      --text-muted: #737685;
      --border: #e8e8ec;
      --tt-red: #fe2c55;
      --tt-cyan: #25f4ee;
      --tt-yellow: #face15;
      --green: #0f9d58;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text;
      font-family: inherit;
    }

    html, body {
      height: 100%;
      background: #08080a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Kufi Arabic", "Cairo", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background: #000;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-viewport {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      padding-bottom: calc(56px + var(--safe-bottom));
    }

    .main-viewport::-webkit-scrollbar {
      display: none;
    }

    .main-viewport.light-mode {
      background: var(--bg-light);
      color: var(--text-dark);
      scroll-snap-type: none;
    }

    .tt-slide {
      position: relative;
      width: 100%;
      height: calc(100dvh - 56px - var(--safe-bottom));
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #050507;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .tt-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050507;
    }

    .tt-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.5) 0%,
        rgba(0, 0, 0, 0) 26%,
        rgba(0, 0, 0, 0) 60%,
        rgba(0, 0, 0, 0.86) 100%
      );
      pointer-events: none;
    }

    .pause-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.48);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease;
      z-index: 8;
    }

    .tt-slide.paused .pause-mark {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .seek-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.22);
      z-index: 12;
    }

    .seek-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
    }

    .heart-pop {
      position: absolute;
      font-size: 82px;
      color: var(--tt-red);
      pointer-events: none;
      z-index: 25;
      transform: translate(-50%, -50%) scale(0);
      animation: heartBurst 0.72s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
      text-shadow: 0 6px 20px rgba(254, 44, 85, 0.6);
    }

    @keyframes heartBurst {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-14deg); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.2) rotate(8deg); opacity: 1; }
      55% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
      100% { transform: translate(-50%, -78%) scale(1.25) rotate(0deg); opacity: 0; }
    }

    .tt-top {
      position: fixed;
      top: calc(10px + var(--safe-top));
      width: 100%;
      max-width: 440px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #fff;
      pointer-events: none;
    }

    .tt-top > * {
      pointer-events: auto;
    }

    .live-btn {
      background: none;
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .top-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .top-tab {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-size: 16.5px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      padding: 4px 2px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .top-tab.active {
      color: #ffffff;
    }

    .top-tab.active::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 99px;
      background: #ffffff;
    }

    .plain-top-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      padding: 5px 8px;
      cursor: pointer;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .tt-overlay {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 12px 14px 10px;
      gap: 10px;
      pointer-events: none;
    }

    .tt-caption-col,
    .tt-action-rail {
      pointer-events: auto;
    }

    .tt-caption-col {
      flex: 1;
      min-width: 0;
      padding-left: 8px;
    }

    .tt-handle-line {
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .tt-desc-line {
      font-size: 13.5px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.96);
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .tt-sound-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .tt-action-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .avatar-ring-box {
      position: relative;
      width: 48px;
      height: 48px;
      margin-bottom: 6px;
    }

    .avatar-ring-box img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #fff;
      display: block;
    }

    .follow-plus-btn {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: var(--tt-red);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .follow-plus-btn.followed {
      background: #fff;
      color: var(--tt-red);
      font-size: 11px;
    }

    .rail-act-btn {
      background: rgba(18, 18, 22, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      border-radius: 12px;
      padding: 6px 8px;
      min-width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.14s ease;
    }

    .rail-act-btn:active {
      transform: scale(0.92);
    }

    .rail-act-btn.liked {
      border-color: var(--tt-red);
      background: rgba(254, 44, 85, 0.28);
      color: #ff6b86;
    }

    .rail-act-btn.saved {
      border-color: var(--tt-yellow);
      background: rgba(250, 206, 21, 0.24);
      color: var(--tt-yellow);
    }

    .rail-act-label {
      font-size: 11px;
      font-weight: 700;
    }

    .rail-act-val {
      font-size: 12px;
      font-weight: 800;
      direction: ltr;
    }

    .vinyl-spin {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #222 25%, #090909 26%, #2a2a2a 65%, #000 66%);
      border: 6px solid #1c1d24;
      display: grid;
      place-items: center;
      overflow: hidden;
      margin-top: 2px;
      animation: spinWheel 6s linear infinite;
    }

    .tt-slide.paused .vinyl-spin {
      animation-play-state: paused;
    }

    .vinyl-spin img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .page-header {
      position: sticky;
      top: 0;
      z-index: 15;
      min-height: 52px;
      padding: calc(var(--safe-top) + 4px) 14px 4px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .page-heading {
      font-size: 16.5px;
      font-weight: 800;
    }

    .sub-pill-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      background: #fff;
    }

    .sub-pill-bar::-webkit-scrollbar { display: none; }

    .sub-pill {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dark);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .sub-pill.active {
      background: var(--text-dark);
      color: #fff;
      border-color: var(--text-dark);
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .row-user {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .av-50 {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .online-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid #fff;
      display: inline-block;
      margin-right: 4px;
    }

    .btn-red {
      background: var(--tt-red);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-gray {
      background: var(--surface);
      color: var(--text-dark);
      border: none;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--tt-red);
      display: inline-block;
    }

    .chat-room {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 56px - var(--safe-bottom));
      background: #f7f8fa;
    }

    .chat-room-header {
      background: #fff;
      padding: calc(var(--safe-top) + 8px) 12px 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .msg-bubble-wrap.me {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-bubble-wrap.them {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-bubble {
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-bubble-wrap.me .msg-bubble {
      background: var(--tt-red);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-bubble-wrap.them .msg-bubble {
      background: #fff;
      color: var(--text-dark);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-media-img {
      width: 190px;
      height: 135px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 4px;
      display: block;
    }

    .msg-shared-post {
      background: rgba(0, 0, 0, 0.06);
      border-radius: 10px;
      padding: 8px;
      margin-top: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .msg-meta {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .chat-toolbar {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-media-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .chat-media-bar::-webkit-scrollbar { display: none; }

    .chat-tool-chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dark);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-box-wrap {
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding-top: 2px;
    }

    .grid-item {
      aspect-ratio: 3 / 4;
      position: relative;
      background: #14151a;
      cursor: pointer;
      overflow: hidden;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grid-play-txt {
      position: absolute;
      bottom: 5px;
      right: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      direction: ltr;
    }

    .profile-head {
      padding: calc(10px + var(--safe-top)) 16px 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .profile-top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .profile-avatar-xl {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .stats-strip {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 14px 0;
    }

    .st-num {
      font-size: 16.5px;
      font-weight: 800;
      direction: ltr;
    }

    .st-lbl {
      font-size: 12px;
      color: var(--text-muted);
    }

    .profile-bio {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .p-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .p-tab {
      background: none;
      border: none;
      padding: 11px 0;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }

    .p-tab.active {
      color: var(--text-dark);
      font-weight: 800;
    }

    .p-tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 22%;
      right: 22%;
      height: 2.5px;
      background: var(--text-dark);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      height: calc(56px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: #000000;
      color: #ffffff;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 25;
    }

    .bottom-nav.light-nav {
      background: #ffffff;
      color: var(--text-dark);
      border-top-color: var(--border);
    }

    .nav-item {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.62;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      height: 100%;
    }

    .nav-item.active {
      opacity: 1;
      font-weight: 800;
    }

    .plus-box {
      width: 42px;
      height: 27px;
      border-radius: 8px;
      background: #ffffff;
      color: #000000;
      display: grid;
      place-items: center;
      font-size: 19px;
      font-weight: 900;
      box-shadow: -3px 0 0 var(--tt-cyan), 3px 0 0 var(--tt-red);
    }

    .bottom-nav.light-nav .plus-box {
      background: #161823;
      color: #ffffff;
    }

    .inbox-num {
      position: absolute;
      top: 3px;
      left: 16%;
      background: var(--tt-red);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: flex-start;
      z-index: 50;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer-box {
      width: 84%;
      max-width: 340px;
      background: #fff;
      color: var(--text-dark);
      height: 100%;
      padding-top: calc(14px + var(--safe-top));
      padding-bottom: calc(16px + var(--safe-bottom));
      overflow-y: auto;
    }

    .drawer-sec-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 12px 18px 5px;
    }

    .drawer-item-btn {
      width: 100%;
      border: none;
      background: #fff;
      color: var(--text-dark);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: right;
    }

    .drawer-item-btn:hover {
      background: var(--surface);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 60;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 440px;
      max-height: 84dvh;
      background: #fff;
      color: var(--text-dark);
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 14.5px;
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
    }

    .cmt-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cmt-av {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .share-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 6px 0;
    }

    .share-choice {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dark);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .field-inp {
      width: 100%;
      border: 1px solid #d8dae2;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-top: 6px;
    }

    .primary-submit {
      width: 100%;
      background: var(--tt-red);
      color: #fff;
      border: none;
      border-radius: 10px;

    function attachVideoObservers() {
      const slides = document.querySelectorAll(".tt-slide");
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const slide = entry.target;
          const vid = slide.querySelector("video");
          if (!vid) return;
          if (entry.isIntersecting) {
            slide.classList.remove("paused");
            vid.play().catch(() => {});
          } else {
            vid.pause();
            vid.currentTime = 0;
          }
        });
      }, { threshold: 0.65 });

      slides.forEach(slide => {
        const vid = slide.querySelector("video");
        const bar = slide.querySelector(".seek-fill");
        if (vid && bar) {
          vid.addEventListener("timeupdate", () => {
            if (vid.duration) bar.style.width = ((vid.currentTime / vid.duration) * 100) + "%";
          });
        }
        io.observe(slide);
      });
    }

    function onSlideClick(e, id) {
      const slide = e.currentTarget;
      if (tapTimer) {
        clearTimeout(tapTimer);
        tapTimer = null;
        const rect = slide.getBoundingClientRect();
        const pop = document.createElement("div");
        pop.className = "heart-pop";
        pop.textContent = "♥";
        pop.style.left = (e.clientX - rect.left) + "px";
        pop.style.top = (e.clientY - rect.top) + "px";
        slide.appendChild(pop);
        setTimeout(() => pop.remove(), 750);
        const v = state.videos.find(x => x.id === id);
        if (v && !v.liked) toggleLike(id);
      } else {
        tapTimer = setTimeout(() => {
          tapTimer = null;
          const vid = slide.querySelector("video");
          if (!vid) return;
          if (vid.paused) { vid.play().catch(() => {}); slide.classList.remove("paused"); }
          else { vid.pause(); slide.classList.add("paused"); }
        }, 230);
      }
    }

    function togglePrivate() { state.user.privateAcc = !state.user.privateAcc; save(); render(); toast("تم تحديث الخصوصية"); }
    function toggleTwoFactor() { state.user.twoFactor = !state.user.twoFactor; save(); render(); toast("تم تحديث المصادقة الثنائية"); }
    function toggleOnlineVis() { state.user.onlineStatusVisible = !state.user.onlineStatusVisible; save(); render(); toast("تم تحديث حالة الاتصال"); }

    function openEditProfile() {
      openSheet("تعديل الملف الشخصي", `
        <input class="field-inp" id="pName" value="${esc(state.user.name)}" placeholder="الاسم" />
        <input class="field-inp" id="pHandle" value="${esc(state.user.handle)}" placeholder="@username" />
        <textarea class="field-inp" id="pBio" rows="3" placeholder="النبذة التعريفية">${esc(state.user.bio)}</textarea>
        <button class="primary-submit" onclick="saveProfile()" type="button">حفظ</button>
      `);
    }

    function saveProfile() {
      state.user.name = document.getElementById("pName").value.trim() || state.user.name;
      const h = document.getElementById("pHandle").value.trim();
      if (h) state.user.handle = h.startsWith("@") ? h : "@" + h;
      state.user.bio = document.getElementById("pBio").value;
      save(); render(); closeSheet(); toast("تم الحفظ");
    }

    function openLiveModal() {
      openSheet("البث المباشر (LIVE)", `
        <div style="text-align:center;padding:10px 0;">
          <div style="font-size:15px;font-weight:800;">بدء بث مباشر على DERT</div>
          <div style="font-size:12.5px;color:var(--text-muted);margin-top:6px;">نسبة أرباح الهدايا: 60% للمذيع • 40% للمنصة</div>
          <button class="primary-submit" onclick="closeSheet();toast('تم بدء البث المباشر')" type="button">ابدأ البث المباشر</button>
        </div>
      `);
    }

    function openUploadModal() {
      openSheet("نشر مقطع جديد", `
        <input class="field-inp" id="capInp" placeholder="اكتب وصف المقطع..." />
        <input class="field-inp" id="urlInp" placeholder="رابط فيديو MP4 مباشر (اختياري)" />
        <button class="primary-submit" onclick="createNewVideo()" type="button">نشر الآن</button>
      `);
    }

    function createNewVideo() {
      const cap = document.getElementById("capInp").value.trim() || "مقطع جديد على DERT";
      const customUrl = document.getElementById("urlInp").value.trim();
      const rnd = Math.floor(60 + Math.random() * 40);
      state.videos.unshift({
        id: "v_" + Date.now(),
        author: state.user.name,
        handle: state.user.handle,
        avatar: state.user.avatar,
        videoUrl: customUrl || "https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4",
        poster: `https://picsum.photos/480/850?random=${rnd}`,
        caption: cap,
        sound: "الصوت الأصلي - " + state.user.handle,
        plays: "1",
        likes: 0,
        saves: 0,
        shares: 0,
        liked: false,
        saved: false,
        following: true,
        comments: []
      });
      save(); closeSheet(); state.page = "home"; state.feedFilter = "foryou"; render(); toast("تم نشر المقطع");
    }

    document.querySelectorAll(".nav-item[data-page]").forEach(btn => {
      btn.addEventListener("click", () => goPage(btn.dataset.page));
    });

    document.getElementById("openUploadBtn").addEventListener("click", openUploadModal);
    document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
    document.getElementById("drawerBackdrop").addEventListener("click", e => {
      if (e.target.id === "drawerBackdrop") closeDrawer();
    });
    document.getElementById("closeModalBtn").addEventListener("click", closeSheet);
    document.getElementById("modalBackdrop").addEventListener("click", e => {
      if (e.target.id === "modalBackdrop") closeSheet();
    });

    render();
  </script>
</body>
</html>
