
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DERT - ديرت</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      color: #172033;
    }
    .container {
      width: 92%;
      max-width: 440px;
      margin: 55px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px #00000012;
    }
    h1 { text-align: center; color: #2563eb; }
    h2 { text-align: center; }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; }
    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.7;
      color: #2563eb;
    }
    #home { display: none; }
    .welcome {
      background: #eff6ff;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin: 15px 0;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .tabs button { font-size: 13px; }
    .small { color: #64748b; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <h1>DERT</h1>
    <p class="small">منصة تواصل اجتماعي للجميع</p>

    <section id="auth">
      <h2>مرحباً بك</h2>
      <input id="email" type="email" placeholder="البريد الإلكتروني">
      <input id="password" type="password" placeholder="كلمة المرور">

      <button id="loginBtn">تسجيل الدخول</button>
      <button id="signupBtn" class="secondary">إنشاء حساب جديد</button>

      <p id="message"></p>
    </section>

    <section id="home">
      <div class="welcome">
        <h2 id="welcomeTitle">أهلاً بك في DERT</h2>
        <p id="userEmail"></p>
      </div>

      <div class="tabs">
        <button onclick="showSection('الرئيسية')">الرئيسية</button>
        <button onclick="showSection('استكشاف')">استكشاف</button>
        <button onclick="showSection('حسابي')">حسابي</button>
      </div>

      <div class="welcome">
        <h3 id="sectionTitle">الرئيسية</h3>
        <p>أهلاً بك في عالم DERT</p>
        <p class="small">نعمل على إضافة المنشورات والرسائل والتعليقات.</p>
      </div>

      <button id="logoutBtn" class="danger">تسجيل الخروج</button>
      <p id="homeMessage"></p>
    </section>
  </div>

  <script>
    const SUPABASE_URL =
      "https://forwefmjghgcybiccdxz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_xsXMr3yr2yJXOgRn9ZjMtQ_sfoS0OIR";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const authSection = document.getElementById("auth");
    const homeSection = document.getElementById("home");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
    }

    function showHome(user) {
      authSection.style.display = "none";
      homeSection.style.display = "block";

      document.getElementById("welcomeTitle").textContent =
        "أهلاً بك في DERT";

      document.getElementById("userEmail").textContent =
        user.email || "";

      document.getElementById("homeMessage").textContent = "";
    }

    function showLogin() {
      authSection.style.display = "block";
      homeSection.style.display = "none";
    }

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("أدخل البريد الإلكتروني وكلمة المرور");
        return;
      }

      if (password.length < 6) {
        showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل");
        return;
      }

      showMessage("جارٍ إنشاء الحساب...");

      const { data, error } = await client.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        showMessage("خطأ: " + error.message);
        return;
      }

      if (data.session) {
        showHome(data.user);
      } else {
        showMessage("تم إنشاء الحساب. افحص بريدك الإلكتروني لتأكيد الحساب، ثم سجّل الدخول.");
      }
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("أدخل البريد الإلكتروني وكلمة المرور");
        return;
      }

      showMessage("جارٍ تسجيل الدخول...");

      const { data, error } = await client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        showMessage("تعذّر تسجيل الدخول: " + error.message);
        return;
      }

      showHome(data.user);
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      const { error } = await client.auth.signOut();

      if (error) {
        document.getElementById("homeMessage").textContent =
          "حدث خطأ: " + error.message;
        return;
      }

      showLogin();
      showMessage("تم تسجيل الخروج");
    });

    function showSection(name) {
      document.getElementById("sectionTitle").textContent = name;
    }

    async function checkSession() {
      const { data, error } = await client.auth.getSession();

      if (error) {
        showMessage("تعذّر التحقق من الجلسة: " + error.message);
        return;
      }

      if (data.session) {
        showHome(data.session.user);
      } else {
        showLogin();
      }
    }

    client.auth.onAuthStateChange((event, session) => {
      if (session) {
        showHome(session.user);
      } else if (event === "SIGNED_OUT") {
        showLogin();
      }
    });

    checkSession();
  </script>

</body>
</html>
