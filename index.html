<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>DERT</title>
  <style>
    :root {
      --bg-dark: #000000;
      --bg-light: #ffffff;
      --surface: #f1f1f2;
      --text-dark: #161823;
      --text-muted: #737685;
      --border: #e8e8eb;
      --tt-red: #fe2c55;
      --tt-cyan: #25f4ee;
      --tt-yellow: #face15;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea {
      user-select: text;
      font-family: inherit;
    }

    html, body {
      height: 100%;
      background: #0a0a0c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Kufi Arabic", "Cairo", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background: #000;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* التمرير العمودي للفيديوهات */
    .feed-container {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      padding-bottom: calc(54px + var(--safe-bottom));
    }

    .feed-container::-webkit-scrollbar {
      display: none;
    }

    .feed-container.page-mode {
      background: var(--bg-light);
      color: var(--text-dark);
      scroll-snap-type: none;
    }

    .video-slide {
      position: relative;
      width: 100%;
      height: calc(100dvh - 54px - var(--safe-bottom));
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #050507;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .video-element {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050507;
    }

    .video-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.5) 0%,
        rgba(0, 0, 0, 0) 28%,
        rgba(0, 0, 0, 0) 62%,
        rgba(0, 0, 0, 0.85) 100%
      );
      pointer-events: none;
    }

    /* زر الإيقاف المؤقت وسط الشاشة */
    .pause-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 8;
    }

    .video-slide.paused .pause-indicator {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* شريط تقدم الفيديو السفلي الرقيق */
    .video-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.22);
      z-index: 12;
    }

    .video-progress-bar {
      height: 100%;
      width: 0%;
      background: #ffffff;
      transition: width 0.1s linear;
    }

    /* القلب المنبثق عند النقر المزدوج */
    .burst-heart {
      position: absolute;
      width: 96px;
      height: 96px;
      pointer-events: none;
      z-index: 25;
      transform: translate(-50%, -50%) scale(0);
      animation: ttHeartPop 0.75s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
      filter: drop-shadow(0 6px 16px rgba(254, 44, 85, 0.55));
    }

    @keyframes ttHeartPop {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-14deg); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.2) rotate(8deg); opacity: 1; }
      55% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
      100% { transform: translate(-50%, -80%) scale(1.25) rotate(0deg); opacity: 0; }
    }

    /* الشريط العلوي في الرئيسية (LIVE - أتابعه - لك - بحث) */
    .tt-header {
      position: fixed;
      top: calc(10px + var(--safe-top));
      width: 100%;
      max-width: 440px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #fff;
      pointer-events: none;
    }

    .tt-header > * {
      pointer-events: auto;
    }

    .live-badge-btn {
      background: none;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .top-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .top-tab {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-size: 16.5px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      padding: 4px 2px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .top-tab.active {
      color: #ffffff;
    }

    .top-tab.active::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 99px;
      background: #ffffff;
    }

    .top-icon-btn {
      background: none;
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    /* معلومات الفيديو وشريط التفاعل الجانبي */
    .slide-bottom-ui {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 12px 14px 10px;
      gap: 10px;
      pointer-events: none;
    }

    .slide-info,
    .side-actions {
      pointer-events: auto;
    }

    .slide-info {
      flex: 1;
      min-width: 0;
      padding-left: 8px;
    }

    .slide-username {
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    }

    .slide-desc {
      font-size: 13.5px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    }

    .slide-music {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    }

    .side-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      flex-shrink: 0;
    }

    .creator-avatar-box {
      position: relative;
      width: 48px;
      height: 48px;
      margin-bottom: 6px;
    }

    .creator-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #fff;
      display: block;
    }

    .follow-dot {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: var(--tt-red);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .follow-dot.done {
      background: #fff;
      color: var(--tt-red);
      font-size: 11px;
    }

    .rail-item {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      min-width: 46px;
    }

    .rail-svg {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.6));
      transition: transform 0.16s cubic-bezier(0.17, 0.89, 0.32, 1.49);
    }

    .rail-item:active .rail-svg {
      transform: scale(0.84);
    }

    .rail-num {
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      direction: ltr;
    }

    .sound-disc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #222 25%, #090909 26%, #2a2a2a 65%, #000 66%);
      border: 6px solid #1c1d24;
      display: grid;
      place-items: center;
      overflow: hidden;
      margin-top: 2px;
      animation: discSpin 6s linear infinite;
    }

    .video-slide.paused .sound-disc {
      animation-play-state: paused;
    }

    .sound-disc img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    @keyframes discSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* الصفحات البيضاء (الأصدقاء، صندوق الوارد، الملف الشخصي) */
    .white-topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      height: 50px;
      padding: var(--safe-top) 16px 0;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .white-title {
      font-size: 16.5px;
      font-weight: 800;
    }

    .friend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }

    .friend-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-50 {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .tt-btn-red {
      background: var(--tt-red);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .tt-btn-gray {
      background: var(--surface);
      color: var(--text-dark);
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* صندوق الوارد */
    .stories-bar {
      display: flex;
      gap: 14px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .stories-bar::-webkit-scrollbar { display: none; }

    .story-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 60px;
      font-size: 11.5px;
      cursor: pointer;
    }

    .story-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #00c48c;
      padding: 2px;
      position: relative;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .story-plus {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: var(--tt-cyan);
      color: #000;
      font-size: 14px;
      font-weight: 900;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
    }

    .inbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .inbox-badge-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
      flex-shrink: 0;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--tt-red);
      display: inline-block;
    }

    /* الملف الشخصي */
    .profile-box {
      padding: calc(10px + var(--safe-top)) 16px 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .profile-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .profile-img-lg {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .profile-counters {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 14px 0;
    }

    .counter-num {
      font-size: 16.5px;
      font-weight: 800;
      direction: ltr;
    }

    .counter-lbl {
      font-size: 12px;
      color: var(--text-muted);
    }

    .profile-bio-txt {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .profile-subtabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .subtab-btn {
      background: none;
      border: none;
      padding: 11px 0;
      font-size: 16px;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }

    .subtab-btn.active {
      color: var(--text-dark);
      font-weight: 800;
    }

    .subtab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 25%;
      right: 25%;
      height: 2.5px;
      background: var(--text-dark);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding-top: 2px;
    }

    .grid-cell {
      aspect-ratio: 3 / 4;
      position: relative;
      background: #14151a;
      cursor: pointer;
      overflow: hidden;
    }

    .grid-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grid-views {
      position: absolute;
      bottom: 5px;
      right: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      direction: ltr;
    }

    /* الشريط السفلي */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      height: calc(54px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: #000000;
      color: #ffffff;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 25;
    }

    .bottom-bar.light {
      background: #ffffff;
      color: var(--text-dark);
      border-top-color: var(--border);
    }

    .b-tab {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    .b-tab.active {
      opacity: 1;
      font-weight: 800;
    }

    .tt-plus-btn {
      width: 44px;
      height: 28px;
      border-radius: 8px;
      background: #ffffff;
      color: #000000;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 900;
      box-shadow: -3px 0 0 var(--tt-cyan), 3px 0 0 var(--tt-red);
    }

    .bottom-bar.light .tt-plus-btn {
      background: #161823;
      color: #ffffff;
    }

    .badge-count {
      position: absolute;
      top: -3px;
      left: 22%;
      background: var(--tt-red);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
    }

    /* القائمة الجانبية والنوافذ */
    .drawer-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: flex-start;
      z-index: 50;
    }

    .drawer-bg.open {
      display: flex;
    }

    .drawer-panel {
      width: 82%;
      max-width: 330px;
      background: #fff;
      color: var(--text-dark);
      height: 100%;
      padding-top: calc(14px + var(--safe-top));
      padding-bottom: calc(16px + var(--safe-bottom));
      overflow-y: auto;
    }

    .drawer-sec {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 14px 18px 6px;
    }

    .drawer-btn {
      width: 100%;
      border: none;
      background: #fff;
      color: var(--text-dark);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: right;
    }

    .drawer-btn:hover {
      background: var(--surface);
    }

    .sheet-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 60;
    }

    .sheet-bg.open {
      display: flex;
    }

    .sheet-box {
      width: 100%;
      max-width: 440px;
      max-height: 80dvh;
      background: #fff;
      color: var(--text-dark);
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sheet-head {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 14.5px;
    }

    .sheet-body {
      padding: 14px 16px;
      overflow-y: auto;
    }

    .cmt-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cmt-av {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .share-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 8px 0;
      text-align: center;
    }

    .share-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
    }

    .share-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      color: #fff;
    }

    .txt-input {
      width: 100%;
      border: 1px solid #d8dae2;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-top: 8px;
    }

    .action-submit {
      width: 100%;
      background: var(--tt-red);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    .gw-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .gw-btn {
      border: 1px solid #d8dae2;
      background: #fff;
      border-radius: 9px;
      padding: 9px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .gw-btn.active {
      border-color: var(--tt-red);
      background: #fff0f3;
      color: var(--tt-red);
    }

    .toast {
      position: fixed;
      bottom: calc(66px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 24, 35, 0.92);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 80;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="feed-container" id="feedContainer"></div>

    <!-- الشريط السفلي المطابق لتيك توك (الصفحة الرئيسية - الأصدقاء - + - صندوق الوارد - الملف الشخصي) -->
    <nav class="bottom-bar" id="bottomBar">
      <button class="b-tab active" data-page="home" type="button">
        <span>🏠</span>
        <span>الصفحة الرئيسية</span>
      </button>
      <button class="b-tab" data-page="friends" type="button">
        <span>👥</span>
        <span>الأصدقاء</span>
      </button>
      <button class="b-tab" id="openUploadBtn" type="button">
        <span class="tt-plus-btn">+</span>
      </button>

    // تشغيل الفيديو التلقائي عند التمرير وشريط التقدم
    function setupVideoPlayback() {
      const slides = document.querySelectorAll(".video-slide");
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const slide = entry.target;
          const vid = slide.querySelector("video");
          if (!vid) return;
          if (entry.isIntersecting) {
            slide.classList.remove("paused");
            vid.play().catch(() => {});
          } else {
            vid.pause();
            vid.currentTime = 0;
          }
        });
      }, { threshold: 0.65 });

      slides.forEach(slide => {
        const vid = slide.querySelector("video");
        const bar = slide.querySelector(".video-progress-bar");
        if (vid && bar) {
          vid.addEventListener("timeupdate", () => {
            if (vid.duration) {
              bar.style.width = ((vid.currentTime / vid.duration) * 100) + "%";
            }
          });
        }
        observer.observe(slide);
      });
    }

    // نقرة واحدة = إيقاف/تشغيل الفيديو، نقرتان = لايك مع القلب المنبثق
    function handleSlideTap(e, id) {
      const slide = e.currentTarget;
      if (clickTimer) {
        clearTimeout(clickTimer);
        clickTimer = null;
        spawnBurstHeart(slide, e);
        const v = state.videos.find(x => x.id === id);
        if (v && !v.liked) toggleLike(id);
      } else {
        clickTimer = setTimeout(() => {
          clickTimer = null;
          const vid = slide.querySelector("video");
          if (!vid) return;
          if (vid.paused) {
            vid.play().catch(() => {});
            slide.classList.remove("paused");
          } else {
            vid.pause();
            slide.classList.add("paused");
          }
        }, 230);
      }
    }

    function spawnBurstHeart(slide, e) {
      const rect = slide.getBoundingClientRect();
      const heart = document.createElement("div");
      heart.className = "burst-heart";
      heart.style.left = (e.clientX - rect.left) + "px";
      heart.style.top = (e.clientY - rect.top) + "px";
      heart.innerHTML = `<svg width="96" height="96" viewBox="0 0 24 24" fill="#fe2c55"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
      slide.appendChild(heart);
      setTimeout(() => heart.remove(), 760);
    }

    function setFeedFilter(f) { state.feedFilter = f; save(); render(); }
    function setProfileFilter(f) { state.profileFilter = f; save(); render(); }

    function toggleLike(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.liked = !v.liked;
      v.likes += v.liked ? 1 : -1;
      state.user.likes += v.liked ? 1 : -1;
      save(); render();
    }

    function toggleSave(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.saved = !v.saved;
      v.saves = (v.saves || 0) + (v.saved ? 1 : -1);
      save(); render();
      toast(v.saved ? "تمت الإضافة إلى المفضلة" : "تمت الإزالة من المفضلة");
    }

    function toggleFollow(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.following = !v.following;
      state.user.following += v.following ? 1 : -1;
      save(); render();
      toast(v.following ? "تمت المتابعة" : "تم إلغاء المتابعة");
    }

    function openDrawer() { document.getElementById("drawerBg").classList.add("open"); }
    function closeDrawer() { document.getElementById("drawerBg").classList.remove("open"); }

    function openSheet(title, html) {
      document.getElementById("sheetTitle").textContent = title;
      document.getElementById("sheetBody").innerHTML = html;
      document.getElementById("sheetBg").classList.add("open");
    }

    function closeSheet() { document.getElementById("sheetBg").classList.remove("open"); }

    function openComments(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      openSheet(`${fmtNum(v.comments.length)} تعليق`, `
        <div>
          ${v.comments.map(c => `
            <div class="cmt-row">
              <div style="display:flex;gap:10px;flex:1;min-width:0;">
                <img class="cmt-av" src="${esc(c.avatar)}" alt="" />
                <div>
                  <div style="font-size:12px;font-weight:700;color:var(--text-muted);">${esc(c.user)}</div>
                  <div style="font-size:13.5px;margin-top:2px;">${esc(c.text)}</div>
                  <div style="font-size:11px;color:var(--text-muted);margin-top:3px;">${esc(c.time)} • رد</div>
                </div>
              </div>
              <button style="background:none;border:none;color:${c.liked ? "#fe2c55" : "#737685"};font-size:11.5px;cursor:pointer;" onclick="likeComment('${id}','${c.id}')" type="button">
                <div>${c.liked ? "♥" : "♡"}</div>
                <div>${fmtNum(c.likes || 0)}</div>
              </button>
            </div>
          `).join("") || `<div style="text-align:center;color:var(--text-muted);padding:18px 0;">كن أول من يعلّق</div>`}
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
          <input class="txt-input" style="margin-top:0;" id="newCmtInp" placeholder="إضافة تعليق..." />
          <button class="action-submit" style="margin-top:0;width:auto;padding:10px 16px;" onclick="postComment('${id}')" type="button">نشر</button>
        </div>
      `);
    }

    function postComment(id) {
      const val = document.getElementById("newCmtInp").value.trim();
      if (!val) return;
      const v = state.videos.find(x => x.id === id);
      v.comments.push({
        id: "c_" + Date.now(),
        user: state.user.name,
        avatar: state.user.avatar,
        text: val,
        time: "الآن",
        likes: 0,
        liked: false
      });
      save(); render(); openComments(id);
    }

    function likeComment(vidId, cmtId) {
      const v = state.videos.find(x => x.id === vidId);
      const c = v?.comments.find(x => x.id === cmtId);
      if (!c) return;
      c.liked = !c.liked;
      c.likes = (c.likes || 0) + (c.liked ? 1 : -1);
      save(); openComments(vidId);
    }

    function openShare(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      openSheet(`مشاركة (${fmtNum(v.shares || 0)})`, `
        <div class="share-options">
          <button class="share-item" onclick="doShare('${id}', 'إعادة النشر')" type="button">
            <span class="share-icon" style="background:#face15;color:#000;">🔁</span>
            <span>إعادة النشر</span>
          </button>
          <button class="share-item" onclick="doShare('${id}', 'نسخ الرابط')" type="button">
            <span class="share-icon" style="background:#25f4ee;color:#000;">🔗</span>
            <span>نسخ الرابط</span>
          </button>
          <button class="share-item" onclick="doShare('${id}', 'واتساب')" type="button">
            <span class="share-icon" style="background:#25d366;">💬</span>
            <span>واتساب</span>
          </button>
          <button class="share-item" onclick="doShare('${id}', 'إرسال لصديق')" type="button">
            <span class="share-icon" style="background:#fe2c55;">✈️</span>
            <span>إرسال</span>
          </button>
        </div>
      `);
    }

    function doShare(id, label) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.shares = (v.shares || 0) + 1;
      save(); render(); closeSheet();
      toast(`تمت المشاركة عبر ${label}`);
    }

    function openBalanceModal() {
      closeDrawer();
      const gws = ["زين كاش", "سوبر كي", "زين العراق", "آسياسيل"];
      const mShare = Math.round(state.user.grossCoins * 0.6);
      const pShare = Math.round(state.user.grossCoins * 0.4);
      openSheet("الرصيد", `
        <div style="font-size:24px;font-weight:800;">${state.user.coins} عملة</div>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:4px;">حصة المذيع (60%): ${mShare} • حصة المنصة (40%): ${pShare}</div>
        <div class="gw-grid">
          ${gws.map(g => `<button class="gw-btn ${state.user.gateway === g ? "active" : ""}" onclick="setGateway('${g}')" type="button">${g}</button>`).join("")}
        </div>
        <button class="action-submit" onclick="chargeCoins()" type="button">+ شحن 200 عملة (${esc(state.user.gateway)})</button>
      `);
    }

    function setGateway(g) { state.user.gateway = g; save(); openBalanceModal(); }
    function chargeCoins() {
      state.user.coins += 200;
      state.user.grossCoins += 200;
      save(); render(); openBalanceModal(); toast("تم شحن 200 عملة");
    }

    function saveOfflineItem() { state.user.offlineCount += 1; save(); toast("تم حفظ فيديو دون اتصال"); }
    function addPromotion() { state.user.promoCount += 1; save(); toast("تم تفعيل حملة ترويج"); }
    function togglePrivacy() { state.user.privateAcc = !state.user.privateAcc; save(); toast("تم تحديث الخصوصية"); }

    function openEditProfile() {
      openSheet("تعديل الملف الشخصي", `
        <input class="txt-input" id="inName" value="${esc(state.user.name)}" placeholder="الاسم" />
        <input class="txt-input" id="inHandle" value="${esc(state.user.handle)}" placeholder="@username" />
        <textarea class="txt-input" id="inBio" rows="3" placeholder="النبذة التعريفية">${esc(state.user.bio)}</textarea>
        <button class="action-submit" onclick="saveProfileData()" type="button">حفظ</button>
      `);
    }

    function saveProfileData() {
      state.user.name = document.getElementById("inName").value.trim() || state.user.name;
      const h = document.getElementById("inHandle").value.trim();
      if (h) state.user.handle = h.startsWith("@") ? h : "@" + h;
      state.user.bio = document.getElementById("inBio").value;
      save(); render(); closeSheet(); toast("تم حفظ الملف الشخصي");
    }

    function openInboxChat(id) {
      const item = state.inbox.find(x => x.id === id);
      if (!item) return;
      item.dot = false;
      save(); render();
      openSheet(item.title, `
        <p style="font-size:14px;line-height:1.6;">${esc(item.sub)}</p>
        <input class="txt-input" id="chatReplyInp" placeholder="اكتب رسالة..." />
        <button class="action-submit" onclick="sendReply('${id}')" type="button">إرسال</button>
      `);
    }

    function sendReply(id) {
      const val = document.getElementById("chatReplyInp").value.trim();
      if (!val) return;
      const item = state.inbox.find(x => x.id === id);
      item.sub = val;
      item.time = "الآن";
      save(); render(); openInboxChat(id);
    }

    function openSearch() {
      openSheet("بحث", `
        <input class="txt-input" id="searchBoxInp" placeholder="ابحث عن حساب أو مقطع..." oninput="runSearch(this.value)" />
        <div id="searchResultsBox" style="margin-top:10px;"></div>
      `);
      runSearch("");
    }

    function runSearch(q) {
      const term = q.trim().toLowerCase();
      const res = state.videos.filter(v => !term || v.author.toLowerCase().includes(term) || v.caption.toLowerCase().includes(term));
      document.getElementById("searchResultsBox").innerHTML = res.map(v => `
        <div style="padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;cursor:pointer;" onclick="closeSheet();openComments('${v.id}')">
          <strong>${esc(v.author)}</strong> — ${esc(v.caption)}
        </div>
      `).join("");
    }

    function openLivePreview() {
      openSheet("البث المباشر (LIVE)", `
        <div style="text-align:center;padding:12px 0;">
          <div style="font-size:15px;font-weight:800;">بدء بث مباشر على DERT</div>
          <div style="font-size:12.5px;color:var(--text-muted);margin-top:6px;">نسبة أرباح الهدايا: 60% للمذيع • 40% للمنصة</div>
          <button class="action-submit" onclick="closeSheet();toast('تم الدخول إلى وضع البث المباشر')" type="button">ابدأ البث المباشر الآن</button>
        </div>
      `);
    }

    function openUploadModal() {
      openSheet("نشر مقطع جديد", `
        <input class="txt-input" id="newVidCap" placeholder="اكتب وصف المقطع والهاشتاغات..." />
        <input class="txt-input" id="newVidUrl" placeholder="رابط فيديو MP4 مباشر (اختياري)" />
        <button class="action-submit" onclick="publishNewVideo()" type="button">نشر الآن</button>
      `);
    }

    function publishNewVideo() {
      const cap = document.getElementById("newVidCap").value.trim() || "مقطع جديد على DERT 🔥";
      const customUrl = document.getElementById("newVidUrl").value.trim();
      const rnd = Math.floor(60 + Math.random() * 40);
      state.videos.unshift({
        id: "v_" + Date.now(),
        author: state.user.name,
        handle: state.user.handle,
        avatar: state.user.avatar,
        videoUrl: customUrl || "https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4",
        poster: `https://picsum.photos/480/850?random=${rnd}`,
        caption: cap,
        sound: "الصوت الأصلي - " + state.user.handle,
        plays: "1",
        likes: 0,
        saves: 0,
        shares: 0,
        liked: false,
        saved: false,
        following: true,
        comments: []
      });
      save(); closeSheet(); state.page = "home"; state.feedFilter = "foryou"; render(); toast("تم نشر المقطع");
    }

    document.querySelectorAll(".b-tab[data-page]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.page = btn.dataset.page;
        save();
        render();
      });
    });

    document.getElementById("openUploadBtn").addEventListener("click", openUploadModal);
    document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
    document.getElementById("drawerBg").addEventListener("click", e => {
      if (e.target.id === "drawerBg") closeDrawer();
    });
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    document.getElementById("sheetBg").addEventListener("click", e => {
      if (e.target.id === "sheetBg") closeSheet();
    });

    render();
  </script>
</body>
</html>
