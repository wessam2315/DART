<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>DERT — التطبيق المتكامل</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f9;
      --surface-2: #f0f1f4;
      --text: #161823;
      --muted: #6e7280;
      --section-label: #737685;
      --divider: #ededf0;
      --hover: #f7f7f9;
      --active: #efefef;
      --chevron: #8a8d99;
      --accent: #fe2c55;
      --accent-hover: #e52248;
      --accent-soft: #fff0f3;
      --cyan: #25f4ee;
      --success: #0f9d58;
      --success-soft: #e8f6ef;
      --danger: #d93025;
      --danger-soft: #fff4f3;
      --gold: #f59e0b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    input, textarea, select {
      font-family: inherit;
    }

    html, body {
      height: 100%;
      background: #e9ecf1;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Kufi Arabic", "Cairo", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(66px + var(--safe-bottom));
      box-shadow: 0 10px 40px rgba(22, 24, 35, 0.09);
      overflow-x: hidden;
    }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 25;
      height: 54px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 8px;
    }

    .topbar-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn, .chip-btn {
      border: 1px solid var(--divider);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn:active, .chip-btn:active {
      background: var(--active);
    }

    .main-view {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 18px;
    }

    /* Stories Bar */
    .stories-bar {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--divider);
      background: var(--bg);
      scrollbar-width: none;
    }
    .stories-bar::-webkit-scrollbar { display: none; }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 64px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text);
    }

    .story-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      display: grid;
      place-items: center;
      position: relative;
    }

    .story-ring.seen {
      background: #d5d8e0;
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
    }

    .story-name {
      font-size: 11px;
      font-weight: 600;
      max-width: 68px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Feed Cards */
    .feed-list {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .post-card {
      border: 1px solid var(--divider);
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(22, 24, 35, 0.03);
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      gap: 10px;
    }

    .post-author-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mini-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .post-author-name {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-badge {
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.4px;
    }

    .post-sub {
      font-size: 11.5px;
      color: var(--muted);
    }

    .follow-btn {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .follow-btn.following {
      background: var(--surface);
      color: var(--text);
      border-color: var(--divider);
    }

    .media-stage {
      position: relative;
      height: 260px;
      background: linear-gradient(145deg, #161823 0%, #272b3d 55%, #3d1624 100%);
      color: #fff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .media-stage.alt-1 {
      background: linear-gradient(145deg, #0f172a 0%, #1e3a8a 60%, #0e7490 100%);
    }

    .media-stage.alt-2 {
      background: linear-gradient(145deg, #1f1629 0%, #4c1d95 60%, #be185d 100%);
    }

    .stage-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-dark {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .stage-caption {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .post-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-top: 1px solid var(--divider);
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .act-btn {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 6px;
      border-radius: 8px;
    }

    .act-btn:active { background: var(--surface); }
    .act-btn.liked { color: var(--accent); }

    /* Filter Pills */
    .filter-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--divider);
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }

    .filter-pill {
      border: 1px solid var(--divider);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-pill.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .chat-row {
      width: 100%;
      border: none;
      background: #fff;
      border-bottom: 1px solid var(--divider);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: right;
    }

    .chat-row:active { background: var(--active); }

    .unread-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* Profile Screen */
    .profile-banner {
      height: 86px;
      background: linear-gradient(120deg, #161823 0%, #fe2c55 100%);
      position: relative;
    }

    .profile-head {
      padding: 0 16px 14px;
      border-bottom: 1px solid var(--divider);
    }

    .profile-avatar-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: -36px;
      margin-bottom: 10px;
    }

    .profile-avatar-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .profile-avatar {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      display: grid;
      place-items: center;
      border: 3px solid #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    .status-bubble {
      background: var(--surface);
      border: 1px solid var(--divider);
      border-radius: 14px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 18px;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 800;
    }

    .profile-handle {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .profile-bio {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 12px;
    }

    .stats-row {
      display: flex;
      gap: 22px;
      margin-bottom: 12px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-num {
      font-size: 16px;
      font-weight: 800;
    }

    .stat-lbl {
      font-size: 11.5px;
      color: var(--muted);
    }

    .profile-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--divider);
      background: #fff;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 12px 6px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: var(--divider);
      padding: 2px;
    }

    .grid-tile {
      aspect-ratio: 3 / 4;
      background: linear-gradient(150deg, #1d2030, #3a1826);
      color: #fff;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      border: none;
      text-align: right;
    }

    .pin-tag {
      background: var(--accent);
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      align-self: flex-start;
    }

    .views-tag {
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.45);
      padding: 2px 6px;
      border-radius: 6px;
      align-self: flex-start;
    }

    /* Settings & Shortcuts Drawer */
    .section {
      padding-top: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--divider);
    }

    .section:last-of-type { border-bottom: none; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--section-label);
      padding: 0 18px 8px;
      text-align: right;
    }

    .menu-item {
      width: 100%;
      border: none;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      text-align: right;
      gap: 10px;
    }

    .menu-item:active { background: var(--active); }

    .menu-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
      flex: 1;
    }

    .menu-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: var(--text);
      display: grid;
      place-items: center;
    }

    .menu-icon svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-label {
      font-size: 15px;
      font-weight: 500;
    }

    .menu-meta {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .menu-chevron {
      color: var(--chevron);
      display: grid;
      place-items: center;
    }

    /* Drawer & Subpages */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 45;
      display: flex;
      justify-content: center;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      width: 100%;
      max-width: 480px;
      background: var(--bg);
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(14px + var(--safe-bottom));
      transform: translateX(-100%);
      transition: transform 0.22s ease;
    }

    .drawer-backdrop.open .drawer-panel {
      transform: translateX(0);
    }

    .panel-header {
      height: 54px;
      padding: 0 14px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
    }

    .close-btn {
      border: none;
      background: var(--surface);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .panel-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .card {
      border: 1px solid var(--divider);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fff;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--divider);
    }
    .card-row:first-child { padding-top: 0; }
    .card-row:last-child { border-bottom: none; padding-bottom: 0; }

    .row-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .row-desc { font-size: 12px; color: var(--muted); line-height: 1.45; }

    .split-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .split-box {
      background: var(--surface);
      border-radius: 10px;
      padding: 10px;
      border: 1px solid var(--divider);
    }

    .split-val { font-size: 15px; font-weight: 800; margin-top: 2px; }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .gateway-btn {
      border: 1px solid #dfe2ea;
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }

    .gateway-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .switch {
      position: relative;
      width: 46px;
      height: 25px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #d6d8df;
      border-radius: 999px;
      transition: 0.2s;
      cursor: pointer;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 19px;
      height: 19px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(21px); }

    .btn-primary {
      width: 100%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: 11px;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-secondary {
      width: 100%;
      border: 1px solid var(--divider);
      background: var(--surface);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 11px;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-danger-outline {
      width: 100%;
      border: 1px solid #f3c6c3;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 11px;
      cursor: pointer;
      margin-top: 8px;
    }

    .input-field, .select-field, .textarea-field {
      width: 100%;
      border: 1px solid #d8dbe3;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-top: 6px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .textarea-field {
      min-height: 130px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.5;
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 18px;
      border: 1px dashed #cfd2dc;
      border-radius: 14px;
      background: #fafafa;
    }

    .qr-grid {
      display: grid;
      grid-template-columns: repeat(9, 17px);
      gap: 3px;
      padding: 12px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--divider);
    }

    .qr-cell { width: 17px; height: 17px; border-radius: 2px; background: #fff; }
    .qr-cell.on { background: #161823; }

    .log-item {
      padding: 9px 0;
      border-bottom: 1px solid var(--divider);
      font-size: 12.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .log-item:last-child { border-bottom: none; }

    .badge-ok {
      color: var(--success);
      font-weight: 700;
      font-size: 11px;
      background: var(--success-soft);
      padding: 2px 7px;
      border-radius: 999px;
      display: inline-block;
      margin-top: 2px;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .msg-bubble.me {
      background: var(--accent);
      color: #fff;
      margin-right: auto;
    }

    .msg-bubble.them {
      background: var(--surface);
      color: var(--text);
      margin-left: auto;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: calc(58px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--divider);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 30;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: relative;
    }

    .nav-btn.active { color: var(--text); }

    .create-pill {
      width: 40px;
      height: 28px;
      border-radius: 9px;
      background: var(--text);
      color: #fff;
      font-size: 18px;
      font-weight: 800;

    function cloneDefault() {
      return JSON.parse(JSON.stringify(defaultState));
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const base = cloneDefault();
        return {
          ...base,
          ...(raw || {}),
          profile: { ...base.profile, ...(raw?.profile || {}) },
          studioStats: { ...base.studioStats, ...(raw?.studioStats || {}) },
          settings: { ...base.settings, ...(raw?.settings || {}) },
          stories: Array.isArray(raw?.stories) ? raw.stories : base.stories,
          posts: Array.isArray(raw?.posts) ? raw.posts : base.posts,
          chats: Array.isArray(raw?.chats) ? raw.chats : base.chats,
          transactions: Array.isArray(raw?.transactions) ? raw.transactions : base.transactions,
          offlineVideos: Array.isArray(raw?.offlineVideos) ? raw.offlineVideos : base.offlineVideos,
          minis: Array.isArray(raw?.minis) ? raw.minis : base.minis,
          shopItems: Array.isArray(raw?.shopItems) ? raw.shopItems : base.shopItems,
          searchHistory: Array.isArray(raw?.searchHistory) ? raw.searchHistory : base.searchHistory
        };
      } catch {
        return cloneDefault();
      }
    }

    let state = loadState();
    let settingsSearch = "";

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateBadges();
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2100);
    }

    function updateBadges() {
      const unreadCount = state.chats.filter(c => c.unread).length;
      const badge = document.getElementById("inboxBadge");
      badge.textContent = unreadCount;
      badge.style.display = unreadCount > 0 ? "grid" : "none";

      document.querySelectorAll(".nav-btn[data-tab]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === state.currentTab);
      });
    }

    function openModal(title, renderFn) {
      document.getElementById("modalTitle").textContent = title;
      const body = document.getElementById("modalBody");
      body.innerHTML = "";
      renderFn(body);
      const backdrop = document.getElementById("modalBackdrop");
      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      const backdrop = document.getElementById("modalBackdrop");
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    /* SQL / Supabase Schema Generator */
    function getSqlSchema() {
      return `-- DERT PostgreSQL / Supabase Schema
create table if not exists public.profiles (
  id uuid primary key default gen_random_uuid(),
  display_name text not null,
  handle text unique not null,
  bio text default '',
  status_bubble text default '',
  coins_balance integer not null default 0,
  following_count integer not null default 0,
  followers_count integer not null default 0,
  likes_count integer not null default 0,
  updated_at timestamptz default now()
);

create table if not exists public.posts (
  id uuid primary key default gen_random_uuid(),
  author_id uuid references public.profiles(id) on delete cascade,
  caption text not null,
  is_live boolean not null default false,
  is_private boolean not null default false,
  pinned boolean not null default false,
  views_count integer not null default 0,
  likes_count integer not null default 0,
  created_at timestamptz default now()
);

create table if not exists public.wallet_transactions (
  id uuid primary key default gen_random_uuid(),
  profile_id uuid references public.profiles(id) on delete cascade,
  gateway text not null,
  coins_delta integer not null,
  broadcaster_share integer not null,
  platform_share integer not null,
  status text not null default 'completed',
  created_at timestamptz default now()
);

create table if not exists public.direct_messages (
  id uuid primary key default gen_random_uuid(),
  sender_handle text not null,
  recipient_handle text not null,
  body text not null,
  is_read boolean not null default false,
  is_starred boolean not null default false,
  created_at timestamptz default now()
);`;
    }

    /* Stories Bar Renderer */
    function renderStoriesHtml() {
      return `
        <div class="stories-bar">
          ${state.stories.map(st => `
            <button type="button" class="story-item" data-story-id="${escapeHtml(st.id)}">
              <div class="story-ring ${st.seen ? "seen" : ""}">
                <div class="story-avatar">${escapeHtml(st.avatar)}</div>
              </div>
              <span class="story-name">${escapeHtml(st.name)}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function bindStoryClicks(container) {
      container.querySelectorAll("[data-story-id]").forEach(btn => {
        btn.onclick = () => {
          const st = state.stories.find(s => s.id === btn.dataset.storyId);
          if (!st) return;
          st.seen = true;
          saveState();
          openModal(`قصة ${st.name}`, (body) => {
            body.innerHTML = `
              <div class="card">
                <div class="row-title">${escapeHtml(st.name)}</div>
                <div style="font-size:16px;font-weight:700;margin:12px 0;">${escapeHtml(st.text)}</div>
                <button type="button" class="btn-primary" id="replyStoryBtn">إرسال رد سريع</button>
              </div>
            `;
            body.querySelector("#replyStoryBtn").onclick = () => {
              closeModal();
              showToast(`تم إرسال رد إلى ${st.name}`);
            };
          });
          renderCurrentScreen();
        };
      });
    }

    /* Post Card Renderer */
    function renderPostCard(post) {
      const isFollowed = state.profile.following > 0 && post.isFriendPost;
      return `
        <article class="post-card" data-post-id="${escapeHtml(post.id)}">
          <div class="post-header">
            <div class="post-author-wrap">
              <div class="mini-avatar">${escapeHtml(post.avatar)}</div>

                <div class="post-author-name">
                  <span>${escapeHtml(post.author)}</span>
                  ${post.isLive ? `<span class="live-badge">LIVE • 60/40</span>` : ""}
                </div>
                <div class="post-sub">${escapeHtml(post.handle)} • ${escapeHtml(post.views)} مشاهدة</div>
              </div>
            </div>
            <button type="button" class="follow-btn ${isFollowed ? "following" : ""}" data-follow-post="${escapeHtml(post.id)}">
              ${isFollowed ? "متابَع" : "متابعة"}
            </button>
          </div>
          <div class="media-stage ${escapeHtml(post.theme || "")}">
            <div class="stage-top-row">
              <span class="pill-dark">${post.isLive ? "بث مباشر • أرباح المذيع 60% / المنصة 40%" : "مقطع قصير • DERT"}</span>
              ${post.isPrivate ? `<span class="pill-dark">🔒 خاص</span>` : ""}
            </div>
            <div class="stage-caption">${escapeHtml(post.caption)}</div>
          </div>
          <div class="post-actions">
            <div class="action-group">
              <button type="button" class="act-btn ${post.liked ? "liked" : ""}" data-like-post="${escapeHtml(post.id)}">
                <span>${post.liked ? "❤️" : "🤍"}</span>
                <span>${post.likes}</span>
              </button>
              <button type="button" class="act-btn" data-comment-post="${escapeHtml(post.id)}">
                <span>💬</span>
                <span>${post.comments.length}</span>
              </button>
              <button type="button" class="act-btn" data-share-post="${escapeHtml(post.id)}">
                <span>↗️</span>
                <span>مشاركة</span>
              </button>
            </div>
            <button type="button" class="act-btn" data-fav-post="${escapeHtml(post.id)}">
              <span>${post.favorited ? "⭐" : "☆"}</span>
              <span>مفضلة</span>
            </button>
          </div>
        </article>
      `;
    }

    function bindPostEvents(container) {
      container.querySelectorAll("[data-follow-post]").forEach(btn => {
        btn.onclick = () => {
          const p = state.posts.find(x => x.id === btn.dataset.followPost);
          if (!p) return;
          p.isFriendPost = !p.isFriendPost;
          state.profile.following += p.isFriendPost ? 1 : -1;
          saveState();
          renderCurrentScreen();
          showToast(p.isFriendPost ? `تمت متابعة ${p.author}` : `تم إلغاء متابعة ${p.author}`);
        };
      });

      container.querySelectorAll("[data-like-post]").forEach(btn => {
        btn.onclick = () => {
          const p = state.posts.find(x => x.id === btn.dataset.likePost);
          if (!p) return;
          p.liked = !p.liked;
          p.likes += p.liked ? 1 : -1;
          state.profile.likes += p.liked ? 1 : -1;
          saveState();
          renderCurrentScreen();
        };
      });

      container.querySelectorAll("[data-fav-post]").forEach(btn => {
        btn.onclick = () => {
          const p = state.posts.find(x => x.id === btn.dataset.favPost);
          if (!p) return;
          p.favorited = !p.favorited;
          saveState();
          renderCurrentScreen();
          showToast(p.favorited ? "أُضيف إلى المفضلة" : "أُزيل من المفضلة");
        };
      });

      container.querySelectorAll("[data-share-post]").forEach(btn => {
        btn.onclick = () => {
          const p = state.posts.find(x => x.id === btn.dataset.sharePost);
          if (!p) return;
          const firstChat = state.chats[0];
          if (firstChat) {
            firstChat.messages.push({ from: "me", text: `مشاركة منشور ${p.author}: ${p.caption}` });
            firstChat.lastTime = "الآن";
          }
          saveState();
          showToast("تمت المشاركة إلى صندوق الوارد");
        };
      });

      container.querySelectorAll("[data-comment-post]").forEach(btn => {
        btn.onclick = () => {
          const p = state.posts.find(x => x.id === btn.dataset.commentPost);
          if (!p) return;
          openModal(`تعليقات (${p.comments.length})`, (body) => {
            body.innerHTML = `
              <div class="card">
                ${p.comments.map(c => `<div class="log-item"><span>${escapeHtml(c)}</span></div>`).join("") || `<div class="row-desc">لا توجد تعليقات بعد</div>`}

              </div>
            `;
            body.querySelector("#addCommentBtn").onclick = () => {
              const val = body.querySelector("#newCommentInput").value.trim();
              if (!val) return;
              p.comments.push(val);
              saveState();
              closeModal();
              renderCurrentScreen();
              showToast("تم إضافة التعليق");
            };
          });
        };
      });
    }

    function renderQrCells(seedText) {
      let hash = 0;
      for (let i = 0; i < seedText.length; i++) {
        hash = (hash * 31 + seedText.charCodeAt(i)) >>> 0;
      }
      return Array.from({ length: 81 }, (_, idx) => {
        const bit = ((hash >> (idx % 24)) ^ (idx * 7)) & 1;
        return `<span class="qr-cell ${bit ? "on" : ""}"></span>`;
      }).join("");
    }

            state.transactions.unshift({
              id: "TX-" + Math.floor(100 + Math.random() * 900),
              title: `شحن رصيد (${state.selectedGateway})${ref ? " • " + ref : ""}`,
              amount: "+200 عملة",
              status: "مكتمل"
            });
            saveState();
            openSettingSubpage(id, label);
            showToast("تم شحن 200 عملة");
          };
        } else if (id === "activity") {
          body.innerHTML = `
            <div class="card">
              <div class="card-row"><div><div class="row-title">وقت الاستخدام اليومي</div><div class="row-desc">سجل النشاط</div></div><strong>${escapeHtml(state.activityTime)}</strong></div>
              <div class="card-row"><div><div class="row-title">سجل البحث</div><div class="row-desc">${state.searchHistory.map(escapeHtml).join(" • ") || "فارغ"}</div></div><button type="button" class="chip-btn" id="clrHistBtn">مسح</button></div>
            </div>
          `;
          body.querySelector("#clrHistBtn").onclick = () => { state.searchHistory = []; saveState(); openSettingSubpage(id, label); showToast("تم المسح"); };
        } else if (id === "offline") {
          body.innerHTML = `
            <div class="card">
              <div class="row-title">المحفوظات (${state.offlineVideos.length})</div>
              ${state.offlineVideos.map(v => `<div class="log-item"><div><strong>${escapeHtml(v.title)}</strong><div class="row-desc">${escapeHtml(v.size)}</div></div><span class="badge-ok">جاهز</span></div>`).join("")}
              <button type="button" class="btn-primary" id="addOffBtn">+ حفظ فيديو جديد</button>
              <button type="button" class="btn-danger-outline" id="clrOffBtn">حذف الكل</button>
            </div>
          `;
          body.querySelector("#addOffBtn").onclick = () => {
            state.offlineVideos.push({ id: "VID-" + Date.now(), title: `مقطع محفوظ #${state.offlineVideos.length + 1}`, size: "22.0 MB" });
            saveState(); openSettingSubpage(id, label); showToast("تم الحفظ");
          };
          body.querySelector("#clrOffBtn").onclick = () => {
            state.offlineVideos = []; saveState(); openSettingSubpage(id, label); showToast("تم الحذف");
          };
        } else if (id === "qr") {
          body.innerHTML = `
            <div class="qr-box">
              <div class="row-title">${escapeHtml(state.profile.displayName)} (${escapeHtml(state.profile.handle)})</div>
              <div class="qr-grid">${renderQrCells(state.profile.handle)}</div>
              <input class="input-field" id="qrHandleInp" value="${escapeHtml(state.profile.handle)}" />
              <button type="button" class="btn-primary" id="saveQrBtn">حفظ رمز QR</button>
            </div>
          `;
          body.querySelector("#saveQrBtn").onclick = () => {
            const v = body.querySelector("#qrHandleInp").value.trim();
            if (v) state.profile.handle = v.startsWith("@") ? v : "@" + v;
            saveState(); openSettingSubpage(id, label); renderCurrentScreen(); showToast("تم التحديث");
          };
        } else if (id === "minis") {
          body.innerHTML = `<div class="card">${state.minis.map((m, i) => `
            <div class="card-row">
              <div><div class="row-title">${escapeHtml(m.name)}</div><div class="row-desc">${escapeHtml(m.desc)}</div></div>
              <label class="switch"><input type="checkbox" data-mi="${i}" ${m.enabled ? "checked" : ""} /><span class="slider"></span></label>
            </div>
          `).join("")}</div>`;
          body.querySelectorAll("[data-mi]").forEach(c => {
            c.onchange = () => { state.minis[Number(c.dataset.mi)].enabled = c.checked; saveState(); showToast("تم التحديث"); };
          });
        } else if (id === "shop") {
          body.innerHTML = `
            <div class="card">
              ${state.shopItems.map((s, idx) => `
                <div class="log-item">
                  <div><strong>${escapeHtml(s.name)}</strong><div class="row-desc">${escapeHtml(s.id)}</div></div>
                  <div style="display:flex;align-items:center;gap:8px;"><strong>${escapeHtml(s.price)}</strong><button type="button" class="btn-danger-outline" style="width:auto;margin:0;padding:4px 8px;" data-delsh="${idx}">حذف</button></div>
                </div>
              `).join("")}
              <input class="input-field" id="shNameInp" placeholder="اسم منتج أو خدمة" />
              <input class="input-field" id="shPriceInp" placeholder="السعر" />
              <button type="button" class="btn-primary" id="addShBtn">+ إضافة</button>
            </div>
          `;
          body.querySelectorAll("[data-delsh]").forEach(b => {
            b.onclick = () => { state.shopItems.splice(Number(b.dataset.delsh), 1); saveState(); openSettingSubpage(id, label); };
          });
          body.querySelector("#addShBtn").onclick = () => {
            const n = body.querySelector("#shNameInp").value.trim();
            const p = body.querySelector("#shPriceInp").value.trim() || "15,000 د.ع";
            if (!n) return;
            state.shopItems.push({ id: "SH-" + Math.floor(100 + Math.random() * 900), name: n, price: p });
            saveState(); openSettingSubpage(id, label); showToast("تمت الإضافة");
          };
        } else if (id === "studio") {
          body.innerHTML = `
            <div class="card">
              <div class="card-row"><div><div class="row-title">المشاهدات</div><div class="row-desc">آخر 30 يوماً</div></div><strong>${escapeHtml(state.studioStats.views)}</strong></div>
              <div class="card-row"><div><div class="row-title">نمو المتابعين</div><div class="row-desc">صافي الزيادة</div></div><strong>${escapeHtml(state.studioStats.followersGrowth)}</strong></div>
              <div class="card-row"><div><div class="row-title">البث المباشر</div><div class="row-desc">تفعيل البث من الاستوديو</div></div><label class="switch"><input type="checkbox" id="stLiveChk" ${state.studioStats.liveEnabled ? "checked" : ""} /><span class="slider"></span></label></div>
            </div>
          `;
          body.querySelector("#stLiveChk").onchange = (e) => { state.studioStats.liveEnabled = e.target.checked; saveState(); showToast("تم الحفظ"); };
        } else if (id === "promote") {
          body.innerHTML = `
            <div class="card">
              <div class="row-title">حملات الترويج النشطة: ${state.promotedCount}</div>
              <button type="button" class="btn-primary" id="addPrBtn">+ إطلاق حملة ترويج</button>
            </div>
          `;
          body.querySelector("#addPrBtn").onclick = () => { state.promotedCount += 1; saveState(); openSettingSubpage(id, label); showToast("تم إطلاق الحملة"); };
        } else if (id === "settings") {
          const s = state.settings;
          const row = (k, t, d) => `
            <div class="card-row">
              <div><div class="row-title">${t}</div><div class="row-desc">${d}</div></div>
              <label class="switch"><input type="checkbox" data-sk="${k}" ${s[k] ? "checked" : ""} /><span class="slider"></span></label>
            </div>
          `;
          body.innerHTML = `
            <div class="card">
              ${row("privateAccount", "حساب خاص", "تقييد مشاهدة المحتوى")}
              ${row("allowComments", "التعليقات", "السماح بالتعليق على المنشورات")}
              ${row("allowDownloads", "التنزيلات", "السماح بتنزيل المقاطع")}
              ${row("pushNotifications", "الإشعارات الفورية", "تنبيهات النشاط والرسائل")}
              ${row("dataSaver", "توفير البيانات", "تقليل استهلاك الإنترنت")}
              ${row("twoFactorAuth", "المصادقة الثنائية", "حماية إضافية للحساب")}
              <div class="card-row" style="flex-direction:column;align-items:stretch;">
                <div class="row-title">اللغة والمنطقة</div>
                <select class="select-field" id="langSel">
                  <option value="العربية (العراق)" ${s.language === "العربية (العراق)" ? "selected" : ""}>العربية (العراق)</option>
                  <option value="العربية" ${s.language === "العربية" ? "selected" : ""}>العربية</option>
                  <option value="English" ${s.language === "English" ? "selected" : ""}>English</option>
                </select>
              </div>
            </div>
            <div class="card"><div class="row-desc">الحزمة: <strong>${escapeHtml(state.packageId)}</strong> • الإصدار: <strong>${escapeHtml(state.versionName)}</strong></div></div>
          `;
          body.querySelectorAll("[data-sk]").forEach(c => {
            c.onchange = () => { state.settings[c.dataset.sk] = c.checked; saveState(); showToast("تم الحفظ"); };
          });
          body.querySelector("#langSel").onchange = (e) => { state.settings.language = e.target.value; saveState(); showToast("تم تغيير اللغة"); };
        }
      });
    }

    function openSqlModal() {
      openModal("مخطط قاعدة البيانات (SQL / Supabase)", (body) => {
        body.innerHTML = `
          <div class="card">
            <div class="row-title">جداول DERT الجاهزة</div>
            <textarea class="textarea-field" readonly>${escapeHtml(getSqlSchema())}</textarea>
            <button type="button" class="btn-primary" id="copySqlBtn">نسخ SQL</button>
          </div>
        `;
        body.querySelector("#copySqlBtn").onclick = () => {
          const ta = body.querySelector("textarea");
          ta.select();
          document.execCommand("copy");
          showToast("تم نسخ مخطط SQL");
        };
      });
    }

    function renderCurrentScreen() {
      const topbar = document.getElementById("appTopbar");
      const main = document.getElementById("mainView");
      updateBadges();
      if (state.currentTab === "friends") return renderFriends(topbar, main);
      if (state.currentTab === "inbox") return renderInbox(topbar, main);
      if (state.currentTab === "profile") return renderProfile(topbar, main);
      return renderHome(topbar, main);
    }

    document.querySelectorAll(".nav-btn[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.currentTab = btn.dataset.tab;
        saveState();
        renderCurrentScreen();
      });
    });

    renderCurrentScreen();
  </script>
</body>
</html>
