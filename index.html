<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>DERT</title>
  <style>
    :root {
      --bg-dark: #000000;
      --bg-light: #ffffff;
      --surface: #f2f2f4;
      --text-dark: #161823;
      --text-muted: #737685;
      --border: #e8e8ec;
      --tt-red: #fe2c55;
      --tt-cyan: #25f4ee;
      --tt-yellow: #face15;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text;
      font-family: inherit;
    }

    html, body {
      height: 100%;
      background: #08080a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Kufi Arabic", "Cairo", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background: #000;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* التمرير العمودي */
    .main-viewport {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      padding-bottom: calc(54px + var(--safe-bottom));
    }

    .main-viewport::-webkit-scrollbar {
      display: none;
    }

    .main-viewport.light-view {
      background: var(--bg-light);
      color: var(--text-dark);
      scroll-snap-type: none;
    }

    /* بطاقة الفيديو الكاملة */
    .tt-slide {
      position: relative;
      width: 100%;
      height: calc(100dvh - 54px - var(--safe-bottom));
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #050507;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .tt-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050507;
    }

    .tt-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.48) 0%,
        rgba(0, 0, 0, 0) 26%,
        rgba(0, 0, 0, 0) 60%,
        rgba(0, 0, 0, 0.86) 100%
      );
      pointer-events: none;
    }

    .pause-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.48);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease;
      z-index: 8;
    }

    .tt-slide.paused .pause-mark {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .seek-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.22);
      z-index: 12;
    }

    .seek-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
    }

    .heart-pop {
      position: absolute;
      font-size: 82px;
      color: var(--tt-red);
      pointer-events: none;
      z-index: 25;
      transform: translate(-50%, -50%) scale(0);
      animation: heartBurst 0.72s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
      text-shadow: 0 6px 20px rgba(254, 44, 85, 0.6);
    }

    @keyframes heartBurst {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-14deg); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.2) rotate(8deg); opacity: 1; }
      55% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
      100% { transform: translate(-50%, -78%) scale(1.25) rotate(0deg); opacity: 0; }
    }

    /* الشريط العلوي */
    .tt-top {
      position: fixed;
      top: calc(10px + var(--safe-top));
      width: 100%;
      max-width: 440px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #fff;
      pointer-events: none;
    }

    .tt-top > * {
      pointer-events: auto;
    }

    .live-btn {
      background: none;
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .top-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .top-tab {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-size: 16.5px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      padding: 4px 2px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .top-tab.active {
      color: #ffffff;
    }

    .top-tab.active::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 99px;
      background: #ffffff;
    }

    .plain-top-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 5px 8px;
      cursor: pointer;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* المحتوى السفلي والشريط الجانبي (بدون أيقونات، نص نظيف) */
    .tt-overlay {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 12px 14px 10px;
      gap: 10px;
      pointer-events: none;
    }

    .tt-caption-col,
    .tt-action-rail {
      pointer-events: auto;
    }

    .tt-caption-col {
      flex: 1;
      min-width: 0;
      padding-left: 8px;
    }

    .tt-handle-line {
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .tt-desc-line {
      font-size: 13.5px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.96);
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .tt-sound-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .tt-action-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .avatar-ring-box {
      position: relative;
      width: 48px;
      height: 48px;
      margin-bottom: 6px;
    }

    .avatar-ring-box img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #fff;
      display: block;
    }

    .follow-plus-btn {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: var(--tt-red);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .follow-plus-btn.followed {
      background: #fff;
      color: var(--tt-red);
      font-size: 11px;
    }

    .rail-act-btn {
      background: rgba(18, 18, 22, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      border-radius: 12px;
      padding: 7px 9px;
      min-width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }

    .rail-act-btn:active {
      transform: scale(0.92);
    }

    .rail-act-btn.liked {
      border-color: var(--tt-red);
      background: rgba(254, 44, 85, 0.28);
      color: #ff6b86;
    }

    .rail-act-btn.saved {
      border-color: var(--tt-yellow);
      background: rgba(250, 206, 21, 0.24);
      color: var(--tt-yellow);
    }

    .rail-act-label {
      font-size: 11px;
      font-weight: 700;
    }

    .rail-act-val {
      font-size: 12.5px;
      font-weight: 800;
      direction: ltr;
    }

    .vinyl-spin {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #222 25%, #090909 26%, #2a2a2a 65%, #000 66%);
      border: 6px solid #1c1d24;
      display: grid;
      place-items: center;
      overflow: hidden;
      margin-top: 2px;
      animation: spinWheel 6s linear infinite;
    }

    .tt-slide.paused .vinyl-spin {
      animation-play-state: paused;
    }

    .vinyl-spin img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* الصفحات البيضاء */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 15;
      height: 50px;
      padding: var(--safe-top) 16px 0;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-heading {
      font-size: 16.5px;
      font-weight: 800;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .row-user {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .av-50 {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .btn-red {
      background: var(--tt-red);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-gray {
      background: var(--surface);
      color: var(--text-dark);
      border: none;
      border-radius: 7px;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .stories-strip {
      display: flex;
      gap: 14px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .stories-strip::-webkit-scrollbar { display: none; }

    .story-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 60px;
      font-size: 11.5px;
      cursor: pointer;
    }

    .story-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #00c48c;
      padding: 2px;
      position: relative;
    }

    .story-circle img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .story-add {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: var(--tt-cyan);
      color: #000;
      font-size: 14px;
      font-weight: 900;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
    }

    .badge-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .red-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--tt-red);
      display: inline-block;
    }

    /* الملف الشخصي */
    .profile-head {
      padding: calc(10px + var(--safe-top)) 16px 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .profile-top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .profile-avatar-xl {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .stats-strip {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 14px 0;
    }

    .st-num {
      font-size: 16.5px;
      font-weight: 800;
      direction: ltr;
    }

    .st-lbl {
      font-size: 12px;
      color: var(--text-muted);
    }

    .profile-bio {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .p-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .p-tab {
      background: none;
      border: none;
      padding: 11px 0;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }

    .p-tab.active {
      color: var(--text-dark);
      font-weight: 800;
    }

    .p-tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 22%;
      right: 22%;
      height: 2.5px;
      background: var(--text-dark);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding-top: 2px;
    }

    .grid-item {
      aspect-ratio: 3 / 4;
      position: relative;
      background: #14151a;
      cursor: pointer;
      overflow: hidden;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grid-play-txt {
      position: absolute;
      bottom: 5px;
      right: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      direction: ltr;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      height: calc(54px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: #000000;
      color: #ffffff;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 25;
    }

    .bottom-nav.light-nav {
      background: #ffffff;
      color: var(--text-dark);
      border-top-color: var(--border);
    }

    .nav-item {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.62;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      height: 100%;
    }

    .nav-item.active {
      opacity: 1;
      font-weight: 800;
    }

    .plus-box {
      width: 44px;
      height: 28px;
      border-radius: 8px;
      background: #ffffff;
      color: #000000;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 900;
      box-shadow: -3px 0 0 var(--tt-cyan), 3px 0 0 var(--tt-red);
    }

    .bottom-nav.light-nav .plus-box {
      background: #161823;
      color: #ffffff;
    }

    .inbox-num {
      position: absolute;
      top: 4px;
      left: 18%;
      background: var(--tt-red);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
    }

    /* القائمة الجانبية والنوافذ السفلية */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: flex-start;
      z-index: 50;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer-box {
      width: 82%;
      max-width: 330px;
      background: #fff;
      color: var(--text-dark);
      height: 100%;
      padding-top: calc(14px + var(--safe-top));
      padding-bottom: calc(16px + var(--safe-bottom));
      overflow-y: auto;
    }

    .drawer-sec-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 14px 18px 6px;
    }

    .drawer-item-btn {
      width: 100%;
      border: none;
      background: #fff;
      color: var(--text-dark);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: right;
    }

    .drawer-item-btn:hover {
      background: var(--surface);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 60;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 440px;
      max-height: 82dvh;
      background: #fff;
      color: var(--text-dark);
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 14.5px;
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
    }

    .cmt-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cmt-av {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .share-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 6px 0;
    }

    .share-choice {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dark);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .field-inp {
      width: 100%;
      border: 1px solid #d8dae2;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-top: 8px;
    }

    .primary-submit {
      width: 100%;
      background: var(--tt-red);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    .gw-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .gw-opt {
      border: 1px solid #d8dae2;
      background: #fff;
      border-radius: 9px;
      padding: 9px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .gw-opt.active {
      border-color: var(--tt-red);
      background: #fff0f3;
      color: var(--tt-red);
    }

    .toast {
      position: fixed;
      bottom: calc(66px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 24, 35, 0.92);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 80;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="main-viewport" id="viewport"></div>

    <!-- الشريط السفلي بأسلوب تيك توك -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-page="home" type="button">
        <span>الصفحة الرئيسية</span>
      </button>
      <button class="nav-item" data-page="friends" type="button">
        <span>الأصدقاء</span>
      </button>
      <button class="nav-item" id="openUploadBtn" type="button">
        <span class="plus-box">+</span>
      </button>
      <button class="nav-item" data-page="inbox" type="button">
        <span class="inbox-num" id="inboxBadge">2</span>
        <span>صندوق الوارد</span>
      </button>
      <button class="nav-item" data-page="profile" type="button">
        <span>الملف الشخصي</span>
      </button>
    </nav>
  </div>

  <!-- قائمة الإعدادات والاختصارات الجانبية -->

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));

    function fmtNum(num) {
      const n = Number(num) || 0;

      return String(n);

    function attachVideoObservers() {
      const slides = document.querySelectorAll(".tt-slide");
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const slide = entry.target;
          const vid = slide.querySelector("video");
          if (!vid) return;
          if (entry.isIntersecting) {
            slide.classList.remove("paused");
            vid.play().catch(() => {});
          } else {
            vid.pause();
            vid.currentTime = 0;
          }
        });
      }, { threshold: 0.65 });

      slides.forEach(slide => {
        const vid = slide.querySelector("video");
        const bar = slide.querySelector(".seek-fill");
        if (vid && bar) {
          vid.addEventListener("timeupdate", () => {
            if (vid.duration) {
              bar.style.width = ((vid.currentTime / vid.duration) * 100) + "%";
            }
          });
        }
        io.observe(slide);
      });
    }

    function onSlideClick(e, id) {
      const slide = e.currentTarget;
      if (tapTimer) {
        clearTimeout(tapTimer);
        tapTimer = null;
        const rect = slide.getBoundingClientRect();
        const pop = document.createElement("div");
        pop.className = "heart-pop";
        pop.textContent = "♥";
        pop.style.left = (e.clientX - rect.left) + "px";
        pop.style.top = (e.clientY - rect.top) + "px";
        slide.appendChild(pop);
        setTimeout(() => pop.remove(), 750);

        const v = state.videos.find(x => x.id === id);
        if (v && !v.liked) toggleLike(id);
      } else {
        tapTimer = setTimeout(() => {
          tapTimer = null;
          const vid = slide.querySelector("video");
          if (!vid) return;
          if (vid.paused) {
            vid.play().catch(() => {});
            slide.classList.remove("paused");
          } else {
            vid.pause();
            slide.classList.add("paused");
          }
        }, 230);
      }
    }

    function setFeedFilter(f) { state.feedFilter = f; save(); render(); }
    function setProfileFilter(f) { state.profileFilter = f; save(); render(); }

    function toggleLike(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.liked = !v.liked;
      v.likes += v.liked ? 1 : -1;
      state.user.likes += v.liked ? 1 : -1;
      save(); render();
    }

    function toggleSave(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.saved = !v.saved;
      v.saves = (v.saves || 0) + (v.saved ? 1 : -1);
      save(); render();
      toast(v.saved ? "تمت الإضافة إلى المحفوظات" : "تمت الإزالة من المحفوظات");
    }

    function toggleFollow(id) {
      const v = state.videos.find(x => x.id === id);

      v.following = !v.following;
      state.user.following += v.following ? 1 : -1;

      toast(v.following ? "تمت المتابعة" : "تم إلغاء المتابعة");

    function openDrawer() { document.getElementById("drawerBackdrop").classList.add("open"); }
    function closeDrawer() { document.getElementById("drawerBackdrop").classList.remove("open"); }

    function openSheet(title, html) {

      document.getElementById("modalBackdrop").classList.add("open");

    function closeSheet() { document.getElementById("modalBackdrop").classList.remove("open"); }

    function openComments(id) {
      const v = state.videos.find(x => x.id === id);

      openSheet(`${fmtNum(v.comments.length)} تعليق`, `
        <div>

                <img class="cmt-av" src="${esc(c.avatar)}" alt="" />

                  <div style="font-size:13.5px;margin-top:2px;">${esc(c.text)}</div>
                  <div style="font-size:11px;color:var(--text-muted);margin-top:3px;">${esc(c.time)} • رد</div>
                </div>
              </div>
              <button style="background:none;border:none;color:${c.liked ? "#fe2c55" : "#737685"};font-size:11.5px;font-weight:700;cursor:pointer;" onclick="likeComment('${id}','${c.id}')" type="button">
                <div>${c.liked ? "إعجاب" : "أعجبني"}</div>
                <div>${fmtNum(c.likes || 0)}</div>
              </button>
            </div>
          `).join("") || `<div style="text-align:center;color:var(--text-muted);padding:18px 0;">كن أول من يعلّق</div>`}
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
          <input class="field-inp" style="margin-top:0;" id="cmtInp" placeholder="إضافة تعليق..." />
          <button class="primary-submit" style="margin-top:0;width:auto;padding:10px 16px;" onclick="submitCmt('${id}')" type="button">نشر</button>
        </div>
      `);
    }

    function submitCmt(id) {
      const val = document.getElementById("cmtInp").value.trim();
      if (!val) return;
      const v = state.videos.find(x => x.id === id);
      v.comments.push({
        id: "c_" + Date.now(),
        user: state.user.name,
        avatar: state.user.avatar,
        text: val,
        time: "الآن",
        likes: 0,
        liked: false
      });
      save(); render(); openComments(id);
    }

    function likeComment(vidId, cmtId) {
      const v = state.videos.find(x => x.id === vidId);
      const c = v?.comments.find(x => x.id === cmtId);
      if (!c) return;
      c.liked = !c.liked;
      c.likes = (c.likes || 0) + (c.liked ? 1 : -1);
      save(); openComments(vidId);
    }

    function openShareModal(id) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      openSheet(`مشاركة (${fmtNum(v.shares || 0)})`, `
        <div class="share-grid">
          <button class="share-choice" onclick="confirmShare('${id}','إعادة النشر')" type="button">إعادة النشر</button>
          <button class="share-choice" onclick="confirmShare('${id}','نسخ الرابط')" type="button">نسخ الرابط</button>
          <button class="share-choice" onclick="confirmShare('${id}','واتساب')" type="button">واتساب</button>
          <button class="share-choice" onclick="confirmShare('${id}','إرسال لصديق')" type="button">إرسال لصديق</button>
        </div>
      `);
    }

    function confirmShare(id, method) {
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      v.shares = (v.shares || 0) + 1;
      save(); render(); closeSheet();
      toast(`تمت المشاركة عبر ${method}`);
    }

    function openBalanceSheet() {
      closeDrawer();
      const gws = ["زين كاش", "سوبر كي", "زين العراق", "آسياسيل"];
      const mShare = Math.round(state.user.grossCoins * 0.6);
      const pShare = Math.round(state.user.grossCoins * 0.4);
      openSheet("الرصيد", `
        <div style="font-size:24px;font-weight:800;">${state.user.coins} عملة</div>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:4px;">حصة المذيع (60%): ${mShare} • حصة المنصة (40%): ${pShare}</div>
        <div class="gw-grid">
          ${gws.map(g => `<button class="gw-opt ${state.user.gateway === g ? "active" : ""}" onclick="pickGateway('${g}')" type="button">${g}</button>`).join("")}
        </div>
        <button class="primary-submit" onclick="topupCoins()" type="button">+ شحن 200 عملة (${esc(state.user.gateway)})</button>
      `);
    }

    function pickGateway(g) { state.user.gateway = g; save(); openBalanceSheet(); }
    function topupCoins() {
      state.user.coins += 200;
      state.user.grossCoins += 200;
      save(); render(); openBalanceSheet(); toast("تم شحن 200 عملة");
    }

    function saveOfflineVideo() { state.user.offlineCount += 1; save(); toast("تم حفظ فيديو دون اتصال"); }
    function addPromo() { state.user.promoCount += 1; save(); toast("تم تفعيل حملة ترويج"); }
    function togglePrivacy() { state.user.privateAcc = !state.user.privateAcc; save(); toast("تم تحديث الخصوصية"); }

    function openEditProfile() {
      openSheet("تعديل الملف الشخصي", `
        <input class="field-inp" id="pName" value="${esc(state.user.name)}" placeholder="الاسم" />
        <input class="field-inp" id="pHandle" value="${esc(state.user.handle)}" placeholder="@username" />
        <textarea class="field-inp" id="pBio" rows="3" placeholder="النبذة التعريفية">${esc(state.user.bio)}</textarea>
        <button class="primary-submit" onclick="saveProfile()" type="button">حفظ</button>
      `);
    }

    function saveProfile() {
      state.user.name = document.getElementById("pName").value.trim() || state.user.name;
      const h = document.getElementById("pHandle").value.trim();
      if (h) state.user.handle = h.startsWith("@") ? h : "@" + h;
      state.user.bio = document.getElementById("pBio").value;
      save(); render(); closeSheet(); toast("تم الحفظ");
    }

    function openInboxItem(id) {
      const item = state.inbox.find(x => x.id === id);
      if (!item) return;
      item.dot = false;
      save(); render();
      openSheet(item.title, `
        <p style="font-size:14px;line-height:1.6;">${esc(item.sub)}</p>
        <input class="field-inp" id="replyInp" placeholder="اكتب رسالة..." />
        <button class="primary-submit" onclick="sendReply('${id}')" type="button">إرسال</button>
      `);
    }

    function sendReply(id) {
      const val = document.getElementById("replyInp").value.trim();
      if (!val) return;
      const item = state.inbox.find(x => x.id === id);
      item.sub = val;
      item.time = "الآن";
      save(); render(); openInboxItem(id);
    }

    function openSearchModal() {
      openSheet("بحث", `
        <input class="field-inp" id="sInp" placeholder="ابحث عن حساب أو مقطع..." oninput="filterSearch(this.value)" />
        <div id="sList" style="margin-top:10px;"></div>
      `);
      filterSearch("");
    }

    function filterSearch(q) {
      const term = q.trim().toLowerCase();
      const res = state.videos.filter(v => !term || v.author.toLowerCase().includes(term) || v.caption.toLowerCase().includes(term));
      document.getElementById("sList").innerHTML = res.map(v => `
        <div style="padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;cursor:pointer;" onclick="closeSheet();openComments('${v.id}')">
          <strong>${esc(v.author)}</strong> — ${esc(v.caption)}
        </div>
      `).join("");
    }

    function openLiveModal() {
      openSheet("البث المباشر (LIVE)", `
        <div style="text-align:center;padding:10px 0;">
          <div style="font-size:15px;font-weight:800;">بدء بث مباشر على DERT</div>
          <div style="font-size:12.5px;color:var(--text-muted);margin-top:6px;">نسبة أرباح الهدايا: 60% للمذيع • 40% للمنصة</div>
          <button class="primary-submit" onclick="closeSheet();toast('تم تفعيل وضع البث المباشر')" type="button">ابدأ البث المباشر</button>
        </div>
      `);
    }

    function openUploadModal() {
      openSheet("نشر مقطع جديد", `
        <input class="field-inp" id="capInp" placeholder="اكتب وصف المقطع..." />
        <input class="field-inp" id="urlInp" placeholder="رابط فيديو MP4 مباشر (اختياري)" />
        <button class="primary-submit" onclick="createNewVideo()" type="button">نشر الآن</button>
      `);
    }

    function createNewVideo() {
      const cap = document.getElementById("capInp").value.trim() || "مقطع جديد على DERT";
      const customUrl = document.getElementById("urlInp").value.trim();
      const rnd = Math.floor(60 + Math.random() * 40);
      state.videos.unshift({
        id: "v_" + Date.now(),
        author: state.user.name,
        handle: state.user.handle,
        avatar: state.user.avatar,
        videoUrl: customUrl || "https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4",
        poster: `https://picsum.photos/480/850?random=${rnd}`,
        caption: cap,
        sound: "الصوت الأصلي - " + state.user.handle,
        plays: "1",
        likes: 0,
        saves: 0,
        shares: 0,
        liked: false,
        saved: false,
        following: true,
        comments: []
      });
      save(); closeSheet(); state.page = "home"; state.feedFilter = "foryou"; render(); toast("تم نشر المقطع");
    }

    document.querySelectorAll(".nav-item[data-page]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.page = btn.dataset.page;
        save();
        render();
      });
    });

    document.getElementById("openUploadBtn").addEventListener("click", openUploadModal);
    document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
    document.getElementById("drawerBackdrop").addEventListener("click", e => {
      if (e.target.id === "drawerBackdrop") closeDrawer();
    });
    document.getElementById("closeModalBtn").addEventListener("click", closeSheet);
    document.getElementById("modalBackdrop").addEventListener("click", e => {
      if (e.target.id === "modalBackdrop") closeSheet();
    });

    render();
  </script>
</body>
</html>
