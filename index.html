  <style>
    /* الخط العربي الأساسي وتهيئة التطبيق */
    :root {
      --dert-rose: #fe2c55;
      --dert-cyan: #25f4ee;
    }

    * {
      font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: #090b0f;
      color: #111827;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* إخفاء شريط التمرير مع الحفاظ على التمرير السلس */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* حركة انزلاق القائمة الجانبية من اليمين في وضع RTL */
    @keyframes slideInRight {
      from {
        transform: translateX(100%);
        opacity: 0.7;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    .animate-slide-right {
      animation: slideInRight 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* حركة ظهور النوافذ المنبثقة */
    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-pop-in {
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* تأثير زر الإضافة المركزي (+) */
    .plus-duo {
      position: relative;
      z-index: 1;
    }
    .plus-duo::before,
    .plus-duo::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      border-radius: 9px;
      z-index: -1;
    }
    .plus-duo::before {
      background-color: var(--dert-cyan);
      right: -3px;
    }
    .plus-duo::after {
      background-color: var(--dert-rose);
      left: -3px;
    }

    /* نبض مؤشر البث المباشر */
    @keyframes pulseLive {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.65;
        transform: scale(1.06);
      }
    }
    .live-pulse {
      animation: pulseLive 1.4s infinite ease-in-out;
    }
  </style>
</head>

    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(INITIAL_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(INITIAL_STATE),
          ...parsed,
          user: { ...structuredClone(INITIAL_STATE.user), ...(parsed.user || {}) },
          settings: { ...structuredClone(INITIAL_STATE.settings), ...(parsed.settings || {}) }
        };
      } catch (err) {
        console.error('خطأ في قراءة الحالة من localStorage:', err);
        return structuredClone(INITIAL_STATE);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.error('خطأ في حفظ الحالة في localStorage:', err);
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/'/g, '&#39;');
    }

    function formatCompact(num) {
      const n = Number(num) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + ' مليون';
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + ' ألف';
      return String(n);
    }

    function showToast(message) {
      const wrap = document.getElementById('toast-wrap');
      const msgEl = document.getElementById('toast-msg');
      msgEl.textContent = message;
      wrap.classList.remove('hidden');
      clearTimeout(window.__dertToastTimeout);
      window.__dertToastTimeout = setTimeout(() => {
        wrap.classList.add('hidden');
      }, 2500);
    }

    function copyToClipboardFallback(text, successMsg = 'تم النسخ إلى الحافظة') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg);
      } catch (e) {
        showToast('تعذر النسخ تلقائياً');
      }
    }

    function updateClock() {
      const el = document.getElementById('status-clock');
      if (!el) return;
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${hh}:${mm}`;
    }

    function updateInboxBadge() {
      const badge = document.getElementById('nav-inbox-badge');
      if (!badge) return;
      const unreadTotal = appState.messages.reduce((sum, m) => sum + (Number(m.unread) || 0), 0);
      if (unreadTotal > 0) {
        badge.textContent = unreadTotal;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function switchTab(tabName) {
      appState.activeTab = tabName;
      saveState();
      render();
    }

    function updateNavStyles() {
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        const active = btn.dataset.nav === appState.activeTab;
        btn.classList.toggle('text-gray-900', active);
        btn.classList.toggle('font-extrabold', active);
        btn.classList.toggle('text-gray-500', !active);
      });
      updateInboxBadge();
    }

    function render() {
      updateNavStyles();
      const main = document.getElementById('main-content');
      if (!main) return;

      if (appState.activeTab === 'profile') {
        main.innerHTML = renderProfileScreen();
      } else if (appState.activeTab === 'inbox') {
        main.innerHTML = renderInboxScreen();
      } else if (appState.activeTab === 'home') {

    /**

      const liveBanner = appState.activeLiveStream

    function toggleRow(label, key, currentVal) {
      return `
        <div class="flex items-center justify-between py-2 border-b border-gray-100">
          <span class="font-bold text-gray-800">${escapeHtml(label)}</span>
          <button onclick="toggleSetting('${key}')" class="px-3 py-1 rounded-xl text-[11px] font-extrabold ${currentVal ? 'bg-emerald-500 text-white' : 'bg-gray-200 text-gray-700'}">
            ${currentVal ? 'مفعّل' : 'متوقف'}
          </button>
        </div>
      `;
    }

    function toggleSetting(key) {
      appState.settings[key] = !appState.settings[key];
      saveState();
      openModal('settings');
      showToast('تم تحديث الإعداد');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    /**
     * عارض المنشور والتعليقات والمشاركة إلى صندوق الوارد
     */
    function openPostModal(postId) {
      const post = appState.posts.find((p) => p.id === postId);
      if (!post) return;

      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');

      const commentsHtml = (post.comments || []).length
        ? post.comments
            .map(
              (c) => `
          <div class="p-2 rounded-xl bg-gray-50 text-xs">
            <div class="font-extrabold text-gray-900">${escapeHtml(c.user)} <span class="text-[10px] font-normal text-gray-400">• ${escapeHtml(c.time)}</span></div>
            <div class="text-gray-700 mt-0.5">${escapeHtml(c.text)}</div>
          </div>
        `
            )
            .join('')
        : `<div class="text-[11px] text-gray-400 text-center py-2">لا توجد تعليقات بعد. كن أول من يعلق!</div>`;

      panel.innerHTML = `
        <div class="p-3.5 border-b border-gray-100 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <img src="${post.authorAvatar}" alt="${escapeHtml(post.authorName)}" class="w-8 h-8 rounded-full object-cover" />
            <div>
              <div class="text-xs font-extrabold text-gray-900">${escapeHtml(post.authorName)}</div>
              <div class="text-[10px] text-gray-500">${escapeHtml(post.views)} مشاهدة</div>
            </div>
          </div>
          <button onclick="closeModal()" class="p-1 rounded-full hover:bg-gray-100 text-gray-500">✕</button>
        </div>

        <div class="p-4 overflow-y-auto space-y-3">
          <div class="h-48 rounded-2xl bg-gradient-to-b ${post.bg} text-white flex flex-col items-center justify-center p-4 text-center">
            <div class="text-sm font-extrabold">${escapeHtml(post.title)}</div>
            <div class="text-xs text-white/80 mt-1">${escapeHtml(post.thumbText)}</div>
          </div>

          <p class="text-xs text-gray-800 leading-relaxed">${escapeHtml(post.caption)}</p>

          <div class="flex items-center justify-between pt-1 border-t border-gray-100 text-xs font-bold">
            <button onclick="toggleLikePost('${post.id}'); openPostModal('${post.id}');" class="px-3 py-1.5 rounded-xl ${post.liked ? 'bg-rose-500 text-white' : 'bg-gray-100 text-gray-800'}">
              ${post.liked ? '♥ معجب' : '♡ إعجاب'} (${post.likes})
            </button>
            <button onclick="toggleSavePost('${post.id}'); openPostModal('${post.id}');" class="px-3 py-1.5 rounded-xl bg-gray-100 text-gray-800">
              ${post.saved ? '★ محفوظ' : '☆ حفظ'}
            </button>
            <button onclick="sharePostToInbox('${post.id}')" class="px-3 py-1.5 rounded-xl bg-sky-50 text-sky-700 font-extrabold">
              إرسال للوارد
            </button>
          </div>

          <div class="space-y-2 pt-2 border-t border-gray-100">
            <div class="text-xs font-extrabold text-gray-900">التعليقات (${post.comments?.length || 0})</div>
            <div class="space-y-1.5 max-h-32 overflow-y-auto">${commentsHtml}</div>
            <form onsubmit="addPostComment(event, '${post.id}')" class="flex items-center gap-2 pt-1">
              <input id="comment-text" type="text" placeholder="أضف تعليقاً..." class="flex-1 px-3 py-1.5 rounded-xl bg-gray-100 text-xs focus:outline-none focus:bg-white border border-transparent focus:border-gray-300" required />
              <button type="submit" class="px-3 py-1.5 rounded-xl bg-gray-900 text-white text-xs font-extrabold">نشر</button>
            </form>
          </div>
        </div>
      `;
      backdrop.classList.remove('hidden');
    }

    function toggleLikePost(postId) {
      const post = appState.posts.find((p) => p.id === postId);
      if (!post) return;
      post.liked = !post.liked;
      post.likes = Math.max(0, (Number(post.likes) || 0) + (post.liked ? 1 : -1));
      appState.user.likesCount = Math.max(0, appState.user.likesCount + (post.liked ? 1 : -1));
      saveState();
      render();
    }

    function toggleSavePost(postId) {
      const post = appState.posts.find((p) => p.id === postId);
      if (!post) return;
      post.saved = !post.saved;
      if (post.saved && !appState.posts.some((p) => p.category === 'favorites' && p.id === post.id)) {
        const clone = { ...post, id: 'fav-' + post.id + '-' + Date.now(), category: 'favorites' };
        appState.posts.unshift(clone);
      } else if (!post.saved) {
        appState.posts = appState.posts.filter((p) => !(p.category === 'favorites' && p.id.startsWith('fav-' + post.id)));
      }
      saveState();
      render();
      showToast(post.saved ? 'تمت الإضافة إلى المفضلة' : 'تمت الإزالة من المفضلة');
    }

    function toggleRepost(postId) {
      const post = appState.posts.find((p) => p.id === postId);
      if (!post) return;
      post.reposted = !post.reposted;
      if (post.reposted) {
        appState.posts.unshift({
          ...post,
          id: 'rep-' + Date.now(),
          category: 'reposts',
          thumbText: 'معاد نشره'
        });
      }
      saveState();
      render();
      showToast(post.reposted ? 'تمت إعادة نشر المقطع' : 'تم التراجع عن إعادة النشر');
    }

    function addPostComment(event, postId) {
      event.preventDefault();
      const input = document.getElementById('comment-text');
      const text = (input.value || '').trim();
      if (!text) return;
      const post = appState.posts.find((p) => p.id === postId);
      if (!post) return;
      post.comments = post.comments || [];
      post.comments.push({ id: 'c-' + Date.now(), user: appState.user.name, text, time: 'الآن' });
      saveState();
      openPostModal(postId);
      showToast('تم إضافة التعليق');
    }

    function sharePostToInbox(postId) {
      const post = appState.posts.find((p) => p.id === postId);
      const firstChat = appState.messages.find((m) => !m.isRequest);
      if (post && firstChat) {
        firstChat.history.push({ from: 'me', text: `شارك منشوراً: ${post.title}`, time: 'الآن' });
        firstChat.preview = `شارك منشوراً: ${post.title}`;
        firstChat.time = 'الآن';
        saveState();
        closeModal();
        switchTab('inbox');
        showToast(`تم إرسال المنشور إلى ${firstChat.sender}`);
      }
    }

    /**
     * نافذة المحادثة المباشرة (Chat Modal)
     */
    function openChatModal(msgId) {
      const msg = appState.messages.find((m) => m.id === msgId);
      if (!msg) return;
      msg.unread = 0;
      saveState();
      updateInboxBadge();
      if (appState.activeTab === 'inbox') render();

      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');

      const bubbles = (msg.history || [])
        .map(
          (h) => `
        <div class="flex ${h.from === 'me' ? 'justify-start' : 'justify-end'}">
          <div class="max-w-[78%] px-3 py-2 rounded-2xl text-xs ${
            h.from === 'me' ? 'bg-rose-500 text-white rounded-br-sm' : 'bg-gray-100 text-gray-900 rounded-bl-sm'
          }">
            <div>${escapeHtml(h.text)}</div>
            <div class="text-[10px] opacity-70 mt-1">${escapeHtml(h.time)}</div>
          </div>
        </div>
      `
        )
        .join('');

      panel.innerHTML = `
        <div class="p-3.5 border-b border-gray-100 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <img src="${msg.avatar}" alt="${escapeHtml(msg.sender)}" class="w-9 h-9 rounded-full object-cover" />
            <div>
              <div class="text-sm font-extrabold text-gray-900">${escapeHtml(msg.sender)}</div>
              <div class="text-[10px] text-emerald-600 font-bold">متصل في DERT</div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="toggleStarChat('${msg.id}')" class="p-1.5 rounded-full hover:bg-gray-100 text-amber-500 text-sm" title="تمييز بنجمة">${msg.starred ? '★' : '☆'}</button>
            <button onclick="closeModal()" class="p-1.5 rounded-full hover:bg-gray-100 text-gray-500">✕</button>
          </div>
        </div>

        <div class="p-4 space-y-2.5 overflow-y-auto flex-1 min-h-[210px] max-h-[340px]">
          ${bubbles}
        </div>

        <form onsubmit="sendDirectMessage(event, '${msg.id}')" class="p-3 border-t border-gray-100 flex items-center gap-2 bg-white">
          <input id="dm-text-input" type="text" placeholder="اكتب رسالتك..." class="flex-1 px-3 py-2 rounded-xl bg-gray-100 text-xs focus:outline-none focus:bg-white border border-transparent focus:border-gray-300" required />
          <button type="submit" class="px-3.5 py-2 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-extrabold">إرسال</button>
        </form>
      `;
      backdrop.classList.remove('hidden');
    }

    function toggleStarChat(msgId) {
      const msg = appState.messages.find((m) => m.id === msgId);
      if (!msg) return;
      msg.starred = !msg.starred;
      saveState();
      if (appState.activeTab === 'inbox') render();
      openChatModal(msgId);
      showToast(msg.starred ? 'تمت إضافة نجمة للمحادثة' : 'تمت إزالة النجمة');
    }

    function sendDirectMessage(event, msgId) {
      event.preventDefault();
      const input = document.getElementById('dm-text-input');
      const text = (input.value || '').trim();
      if (!text) return;
      const msg = appState.messages.find((m) => m.id === msgId);
      if (!msg) return;
      msg.history.push({ from: 'me', text, time: 'الآن' });
      msg.preview = text;
      msg.time = 'الآن';
      msg.isRequest = false;
      saveState();
      if (appState.activeTab === 'inbox') render();
      openChatModal(msgId);
    }

    function openStoryView(storyId) {
      const st = appState.stories.find((s) => s.id === storyId);
      if (!st) return;
      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = `
        <div class="p-4 border-b border-gray-100 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <img src="${st.avatar}" alt="${escapeHtml(st.name)}" class="w-8 h-8 rounded-full object-cover" />
            <span class="text-xs font-extrabold text-gray-900">${escapeHtml(st.name)}</span>
          </div>
          <button onclick="closeModal()" class="p-1 rounded-full hover:bg-gray-100 text-gray-500">✕</button>
        </div>
        <div class="p-6 bg-gradient-to-b from-gray-900 to-slate-800 text-white text-center space-y-3">
          <p class="text-sm font-extrabold">${escapeHtml(st.text || 'حالة جديدة على DERT')}</p>
          <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-white/15 text-xs font-bold">إغلاق</button>
        </div>
      `;
      backdrop.classList.remove('hidden');
    }

    function filterSearchResults() {
      const input = document.getElementById('dm-search-input');
      const out = document.getElementById('dm-search-results');
      if (!input || !out) return;
      const q = (input.value || '').trim().toLowerCase();
      const matches = appState.messages.filter(
        (m) => !q || m.sender.toLowerCase().includes(q) || m.preview.toLowerCase().includes(q)
      );
      out.innerHTML = matches.length
        ? matches
            .map(
              (m) => `
          <button onclick="closeModal(); openChatModal('${m.id}');" class="w-full p-2.5 rounded-xl bg-gray-50 hover:bg-gray-100 flex items-center justify-between text-right text-xs">
            <span class="font-extrabold text-gray-900">${escapeHtml(m.sender)}</span>
            <span class="text-gray-500 truncate max-w-[160px]">${escapeHtml(m.preview)}</span>
          </button>
        `
            )
            .join('')
        : `<div class="text-center text-xs text-gray-400 py-4">لا توجد نتائج مطابقة.</div>`;
    }

    function submitNewPost(event) {
      event.preventDefault();
      const title = document.getElementById('new-post-title').value.trim();
      const caption = document.getElementById('new-post-caption').value.trim() || 'منشور جديد على DERT.';
      const mediaType = document.getElementById('new-post-media').value;
      const category = document.getElementById('new-post-cat').value;
      if (!title) return;

      appState.posts.unshift({
        id: 'post-' + Date.now(),
        authorName: appState.user.name,
        authorHandle: appState.user.username,
        authorAvatar: appState.user.avatarUrl,
        title,
        views: '1',
        viewsNum: 1,
        likes: 0,
        liked: false,
        saved: false,
        reposted: false,
        pinned: false,
        promoted: false,
        category,
        mediaType,
        thumbText: title,
        caption,
        bg: 'from-rose-950 via-slate-900 to-black',
        comments: []
      });

      saveState();
      closeModal();
      switchTab('profile');
      showToast('تم نشر المحتوى بنجاح');
    }

    function startLiveFromModal() {
      const input = document.getElementById('live-title-input');
      const title = (input?.value || '').trim() || `بث مباشر مع ${appState.user.name}`;
      appState.activeLiveStream = { title, startedAt: new Date().toLocaleTimeString('ar-IQ') };
      saveState();
      closeModal();
      switchTab('home');
      showToast('بدأ البث المباشر (60% مذيع / 40% منصة)');
    }

    function endLiveStream() {
      appState.activeLiveStream = null;
      saveState();
      render();
      showToast('تم إنهاء البث المباشر');
    }

    function processTopUp(gateway, coinsAdded, usdAmount) {
      appState.user.coins += coinsAdded;
      appState.transactions.unshift({
        id: 'tx-' + Date.now(),
        title: `شحن رصيد عبر ${gateway}`,
        coins: `+${coinsAdded.toLocaleString('ar-IQ')} عملة`,
        amount: `$${Number(usdAmount).toFixed(2)}`,
        date: 'الآن'
      });
      saveState();
      render();
      openModal('balance');
      showToast(`تم شحن ${coinsAdded} عملة عبر ${gateway}`);
    }

    function applyPromotion(postId, costCoins, reachLabel) {
      if (appState.user.coins < costCoins) {
        showToast('رصيد العملات غير كافٍ، يرجى الشحن أولاً');
        return;
      }
      appState.user.coins -= costCoins;
      const post = appState.posts.find((p) => p.id === postId);
      if (post) {
        post.promoted = true;
      }
      appState.transactions.unshift({
        id: 'tx-' + Date.now(),
        title: `ترويج منشور (${reachLabel})`,
        coins: `-${costCoins} عملة`,
        amount: `-$${(costCoins / 100).toFixed(2)}`,
        date: 'الآن'
      });
      saveState();
      render();
      closeModal();
      showToast(`تم تفعيل الترويج (${reachLabel})`);
    }

    function submitEditProfile(event) {
      event.preventDefault();
      appState.user.name = document.getElementById('edit-name').value.trim() || appState.user.name;
      appState.user.username = document.getElementById('edit-username').value.trim() || appState.user.username;
      appState.user.statusBubble = document.getElementById('edit-bubble').value.trim() || appState.user.statusBubble;
      const rawBio = document.getElementById('edit-bio').value || '';
      appState.user.bioLines = rawBio
        .split('\n')
        .map((line) => line.trim())
        .filter(Boolean);

      saveState();
      closeModal();
      render();
      showToast('تم تحديث بيانات الملف الشخصي');
    }

    function resetDemoState() {
      appState = structuredClone(INITIAL_STATE);
      saveState();
      closeModal();
      render();
      showToast('تمت إعادة ضبط البيانات الافتراضية');
    }

    function getDertSqlScript() {
      return `create table if not exists profiles (
  id uuid primary key default gen_random_uuid(),
  username text unique not null,
  full_name text not null,
  bio text,
  coins_balance bigint not null default 0,
  creator_earnings numeric(12,2) not null default 0,
  created_at timestamptz not null default now()
);

create table if not exists posts (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references profiles(id) on delete cascade,
  title text not null,
  caption text,
  views_count bigint not null default 0,
  likes_count bigint not null default 0,
  is_pinned boolean not null default false,
  created_at timestamptz not null default now()
);

insert into profiles (username, full_name, bio, coins_balance, creator_earnings)
values ('w20xw', 'وسام | wessam', 'الانبار_ الرمادي - م.مهندس', 4250, 185.50)
on conflict (username) do nothing;`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateClock();
      setInterval(updateClock, 30000);
      render();
    });
  </script>
</body>
</html>
